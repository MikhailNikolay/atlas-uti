TOPICS.vni = [
{ t: 'Insuficiência respiratória aguda (IRpA)', s: 'Antes da máscara: o que está falhando?',
b: `<p>Incapacidade, de instalação aguda, de manter trocas gasosas adequadas: <b>oxigenar</b> o sangue e/ou <b>eliminar o CO₂</b>.</p>
<div class="minis"><div class="mini"><b>Critérios gasométricos</b>Hipoxemia: PaO₂ &lt; 60 em ar ambiente. Hipercapnia: PaCO₂ &gt; 45–50 com pH &lt; 7,35. Em O₂: P/F &lt; 300. Sem gaso: S/F (se SpO₂ ≤ 97%).</div><div class="mini"><b>Sinais clínicos</b>FR &gt; 25–30, dispneia, acessórios, tiragem, batimento de asa de nariz, respiração paradoxal, taquicardia, sudorese, cianose, agitação/confusão/sonolência (hipercapnia).</div></div>
<h4>Mecanismos</h4>
<div class="tblwrap"><table class="t"><thead><tr><th>Mecanismo</th><th>Exemplos</th><th>Resultado</th></tr></thead><tbody><tr><td>Hipoventilação alveolar</td><td>Depressão do centro respiratório, neuromuscular, fadiga, DPOC</td><td>↑ PaCO₂ e ↓ PaO₂</td></tr><tr><td>Baixa V/Q (mais comum)</td><td>Pneumonia, atelectasia, broncoespasmo</td><td>Hipoxemia que melhora com O₂</td></tr><tr><td>Shunt (V/Q = 0)</td><td>SDRA, EAP, pneumonia extensa</td><td>Hipoxemia refratária ao O₂ → PEEP/EPAP</td></tr><tr><td>Difusão</td><td>Doença intersticial</td><td>Hipoxemia sem hipercapnia (CO₂ difunde ~20×)</td></tr><tr><td>Baixa PiO₂ / gases</td><td>Altitude, fumaça, CO</td><td>Hipóxia tecidual com SpO₂ "normal"</td></tr></tbody></table></div>
<div class="pearl">Hipoxemia que não melhora com O₂ = shunt → precisa de EPAP/PEEP. Hipercapnia = falha da bomba → precisa de ventilação (IPAP/PS).</div>
<h4>Tipos de IRpA</h4>
<div class="minis"><div class="mini"><b>I · Hipoxêmica</b>PaO₂ &lt; 60 com PaCO₂ normal/baixa. V/Q e shunt (pneumonia, SDRA, EAP, TEP, COVID). Na VNI: EPAP e FiO₂; risco de P-SILI.</div><div class="mini"><b>II · Hipercápnica</b>PaCO₂ &gt; 45 e pH &lt; 7,35. Hipoventilação (DPOC, SHO, neuromuscular, opioides). Na VNI: PS (↑ VC), <b style="display:inline;color:inherit;text-transform:none">melhor evidência</b>.</div><div class="mini"><b>III · Perioperatória</b>Hipoxêmica por ↓ CRF, atelectasia (cirurgia abdominal alta e torácica). CPAP/VNI + mobilizar cedo.</div><div class="mini"><b>IV · Choque</b>Hipoperfusão dos músculos respiratórios. Instabilidade é contraindicação → IOT.</div></div>` },

{ t: 'Hipoxêmica × hipercápnica na VNI', s: 'O que a VNI corrige em cada uma',
b: `<div class="minis"><div class="mini"><b>Tipo I · Hipoxêmica</b>Problema: alvéolos colapsados/inundados (shunt).<br>Ferramenta: <u>EPAP/PEEP</u> (ou CPAP) → ↑ CRF, recruta.<br>PS: a mínima que alivie o esforço sem volumes altos.<br>Sucesso: menor (~50% de falha).<br>Perigo: VC &gt; 9,5 mL/kg → P-SILI e atraso da IOT.<br>Evidência: <b style="display:inline;color:inherit;text-transform:none">CNAF é 1ª linha (ATS 2026)</b>; VNI/CPAP condicional.</div>
<div class="mini"><b>Tipo II · Hipercápnica</b>Problema: bomba insuficiente para a carga (↑ resistência, auto-PEEP, fadiga).<br>Ferramenta: <u>IPAP/PS</u> → ↑ VC → ↓ PaCO₂, corrige pH.<br>EPAP: contrabalança auto-PEEP e lava CO₂ da máscara.<br>Sucesso: alto (~75–80% na DPOC).<br>Perigo: secreção abundante, rebaixamento, assincronia.<br>Evidência: <b style="display:inline;color:inherit;text-transform:none">forte</b>: reduz IOT e mortalidade.</div></div>` },

{ t: 'Intubar ou tentar VNI?', s: 'A VNI é ponte, nunca obstáculo à intubação',
b: `<div class="minis"><div class="mini"><b>IOT imediata (não é VNI)</b>PCR, respiração agônica/gasping · rebaixamento grave sem proteção de via aérea (exceto encefalopatia hipercápnica em teste monitorizado) · instabilidade grave/vasopressor em dose crescente · vômitos incoercíveis, HDA ativa, obstrução de via aérea alta · exaustão iminente (FR muito alta ou bradipneia, paradoxo franco).</div>
<div class="mini"><b>Há janela para não invasivo</b>Consciente, colaborativo, protege a via aérea · hemodinâmica estável · causa reversível em horas/dias (DPOC, EAP, atelectasia) · equipe capacitada e critério de falha definido ANTES · possibilidade de IOT rápida.</div></div>
<h4>Checklist do fisio antes de instalar</h4>
<ol><li><b>Objetivo:</b> curativa, preventiva pós-extubação, facilitadora, paliativa ou pré-oxigenação.</li><li><b>Contraindicações:</b> excluir absolutas, pesar relativas; tosse, secreção, deglutição.</li><li><b>Equipamento e interface</b> do tamanho certo.</li><li><b>Paciente:</b> explicar, cabeceira 30–45°, prótese dentária, proteção do dorso nasal.</li><li><b>Monitorização basal:</b> FR, SpO₂, FC, PA, consciência, acessórios e gasometria antes.</li><li><b>Plano:</b> alvo de SpO₂, reavaliar em 30–60 min (gaso em 1–2 h) e critério de falha comunicado.</li></ol>` },

{ t: 'Fundamentos: VNI é ventilação mecânica', s: 'O que muda é a interface',
b: `<p>Suporte ventilatório com pressão positiva por interface externa (máscara ou capacete), sem via aérea artificial.</p>
<div class="minis"><div class="mini"><b>Vantagens</b>Evita complicações da IOT/VMI (PAV, lesão de laringe, sedação, delirium, fraqueza). Preserva defesas e tosse. Fala, come e expectora nas pausas. Pode ser usada fora da UTI com protocolo.</div><div class="mini"><b>Desvantagens</b>Principal: <b style="display:inline;color:var(--bad);text-transform:none">retardar a intubação</b> de quem está falhando (↑ morbimortalidade). Exige cooperação e vigilância, vazamento, assincronia, lesão de pele. Não protege a via aérea.</div></div>
<p>Terminologia atual: <b>NIRS</b> (suporte respiratório não invasivo) = CNAF + CPAP + VNI bilevel.</p>
<h4>A escada do suporte</h4>
<div class="flow"><span>O₂ convencional (só oferta O₂)</span><i>→</i><span>CNAF (até 60 L/min, PEEP ~3–5)</span><i>→</i><span>CPAP (pressão única: ↑ CRF, ↓ pós-carga do VE)</span><i>→</i><span>Bilevel (IPAP + EPAP: ↑ VC, ↓ PaCO₂)</span><i>→</i><span>VMI</span></div>
<h4>Efeitos respiratórios</h4>
<ul><li><b>↑ Oxigenação:</b> EPAP mantém alvéolos abertos, ↓ shunt.</li><li><b>↑ Ventilação alveolar:</b> PS ↑ VC → elimina CO₂.</li><li><b>↓ Trabalho respiratório</b> e consumo de O₂ dos músculos.</li><li><b>Contrabalança auto-PEEP:</b> DPOC, EPAP ≈ 70–80% da auto-PEEP.</li><li><b>Estabiliza via aérea</b> (AOS, obesidade) e <b>reexpande</b> atelectasias.</li></ul>
<h4>Efeitos cardiovasculares</h4>
<p>↑ pressão intratorácica → <b>↓ pré-carga</b> (↓ retorno venoso, ↓ congestão no EAP) e <b>↓ pós-carga do VE</b> (↓ pressão transmural, ejeção mais fácil). Na IC esquerda: ↑ DC e ↓ consumo de O₂ miocárdico.</p>
<div class="warn">Em hipovolêmicos ou dependentes de pré-carga (choque, sangramento, IAM de VD), a queda do retorno venoso ↓ DC e PA. Monitorar PA e FC ao iniciar e a cada ajuste.</div>` },

{ t: 'P-SILI', s: 'Quando o próprio esforço do paciente lesa o pulmão',
b: `<p><b>Patient self-inflicted lung injury:</b> em pulmões já lesados, esforços vigorosos geram grandes variações de pressão transpulmonar (ΔPL) e volumes altos, agravando a lesão mesmo sem ventilação invasiva.</p>
<div class="flow"><span>Hipoxemia, ↑ drive</span><i>→</i><span>Esforço vigoroso (↑ ΔPes)</span><i>→</i><span>↑ ΔPL, VC alto</span><i>→</i><span>↑ pressão transvascular: edema e lesão</span><i>→</i><span>Piora da troca (ciclo vicioso)</span></div>
<div class="warn">A VNI só protege se REDUZIR o esforço. PS alta + esforço intenso = VC muito alto. Esforço que não cede em 1–2 h é sinal de FALHA, não de "mais tempo" de VNI.</div>` },

{ t: 'Momentos de uso da VNI', s: 'Curativa, preventiva, facilitadora, resgate...',
b: `<div class="minis"><div class="mini"><b>Curativa</b>IRpA de novo ou crônica agudizada: DPOC, EAP, pós-operatório. Evidência mais robusta na hipercapnia.</div><div class="mini"><b>Preventiva</b>Logo após extubar pacientes de ALTO risco, antes da IRpA.</div><div class="mini"><b>Facilitadora</b>Extubação precoce de hipercápnicos (DPOC) que falharam no TRE.</div><div class="mini" style="border-color:var(--bad)"><b style="color:var(--bad)">Resgate pós-extubação</b>IRpA já instalada após extubar: <u>EVITAR</u>. Atrasa a reintubação e ↑ mortalidade.</div><div class="mini"><b>Pré-oxigenação</b>Antes da IOT em hipoxêmicos (VNI ou CNAF).</div><div class="mini"><b>Paliativa</b>Decisão de não intubar: alívio da dispneia, teto terapêutico.</div></div>` },

{ t: 'Parâmetros da VNI', s: 'O que você programa × o que você monitora',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Parâmetro</th><th>O que é</th><th>Ajusta</th></tr></thead><tbody>
<tr><td>IPAP</td><td>Pressão inspiratória total (pico)</td><td>Quanto o ventilador "empurra"; VC junto com EPAP</td></tr>
<tr><td>EPAP / PEEP</td><td>Pressão no fim da expiração</td><td>CRF (alvéolos abertos), contrabalança auto-PEEP</td></tr>
<tr><td>PS (ΔP)</td><td>IPAP − EPAP</td><td>A ajuda inspiratória real: VC, ventilação alveolar, trabalho muscular</td></tr>
<tr><td>FiO₂</td><td>0,21–1,0</td><td>Oxigenação. <b>Não altera o CO₂</b></td></tr>
<tr><td>Sensibilidade</td><td>Disparo por fluxo ou pressão</td><td>Sincronia no início da inspiração</td></tr>
<tr><td>Rise time</td><td>Rampa de pressurização</td><td>Fluxo inicial, conforto do dispneico</td></tr>
<tr><td>Ciclagem</td><td>% do pico de fluxo</td><td>Fim da inspiração; tempo para exalar (DPOC)</td></tr>
<tr><td>FR backup / Ti</td><td>Frequência mínima, limite de tempo</td><td>Segurança em apneia e vazamento</td></tr></tbody></table></div>
<div class="formula">PS = IPAP − EPAP   ex.: IPAP 15, EPAP 5 → PS 10</div>
<p><b>Programados:</b> pressões, FiO₂, disparo, rampa, ciclagem. <b>Resultados (monitorar):</b> VC, volume-minuto, FR total, vazamento.</p>
<div class="formula">Pvent + Pmus = (VC ÷ complacência) + (resistência × fluxo) + PEEP</div>
<h4>Se exagerar...</h4>
<ul><li><b>↑ EPAP:</b> hiperdistensão, ↓ retorno venoso e PA, mais vazamento.</li><li><b>↑ PS:</b> VC alto (P-SILI), aerofagia, ciclagem tardia.</li><li><b>↑ FiO₂:</b> hiperóxia; na DPOC ↑ PaCO₂.</li><li><b>Disparo/rampa/ciclagem:</b> autodisparo, fome de fluxo, duplo disparo, aprisionamento.</li></ul>` },

{ t: 'Indicações por cenário (diretrizes)', s: 'A força da evidência muda muito',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Condição</th><th>Recomendação</th><th>Força · certeza</th></tr></thead><tbody>
<tr><td>DPOC exacerbada com acidose (pH ≤ 7,35)</td><td>VNI bilevel</td><td><b>Forte · alta</b></td></tr>
<tr><td>DPOC que seria intubada (sem deterioração imediata)</td><td>Tentar VNI</td><td>Forte · moderada</td></tr>
<tr><td>DPOC hipercápnica SEM acidose</td><td><b>Não usar VNI</b></td><td>Condicional · baixa</td></tr>
<tr><td>EAP cardiogênico</td><td>Bilevel ou CPAP</td><td><b>Forte · moderada</b></td></tr>
<tr><td>Imunocomprometidos</td><td>VNI precoce</td><td>Condicional · moderada</td></tr>
<tr><td>IRpA pós-operatória</td><td>VNI</td><td>Condicional · moderada</td></tr>
<tr><td>Paliativos com dispneia</td><td>Oferecer VNI</td><td>Condicional · moderada</td></tr>
<tr><td>Trauma torácico com IRpA</td><td>VNI</td><td>Condicional · moderada</td></tr>
<tr><td>Pós-extubação ALTO risco (preventiva)</td><td>VNI</td><td>Condicional · baixa</td></tr>
<tr><td>IRpA já instalada após extubação</td><td><b>Não usar VNI</b></td><td>Condicional · baixa</td></tr>
<tr><td>Desmame de hipercápnicos (facilitadora)</td><td>VNI</td><td>Condicional · moderada</td></tr></tbody></table></div>
<h4>Suporte não invasivo × O₂ convencional</h4>
<div class="tblwrap"><table class="t"><thead><tr><th>Cenário</th><th>Intervenção</th><th>Força</th></tr></thead><tbody><tr><td>IRpA hipoxêmica</td><td>CNAF</td><td>Forte (moderada)</td></tr><tr><td>IRpA hipoxêmica</td><td>VNI bilevel / CPAP</td><td>Condicional (baixa)</td></tr><tr><td>IRpA hipercápnica</td><td>VNI por máscara facial</td><td>Forte (moderada)</td></tr><tr><td>Hipercápnica com pH ≥ 7,25</td><td>CNAF como alternativa, com acesso rápido à VNI</td><td>Condicional</td></tr><tr><td>Pré-oxigenação</td><td>CNAF ou VNI</td><td>Forte</td></tr><tr><td>Pós-extubação alto risco</td><td>VNI (× O₂ ou CNAF)</td><td>Condicional</td></tr></tbody></table></div>` },

{ t: 'DPOC exacerbada', s: 'A melhor evidência da VNI',
b: `<h4>Indicação (GOLD 2026): pelo menos UM</h4>
<ul><li><b>Acidose respiratória:</b> PaCO₂ ≥ 45 e pH ≤ 7,35.</li><li>Dispneia grave com fadiga / ↑ trabalho respiratório (acessórios, paradoxo, retração).</li><li>Hipoxemia persistente apesar do O₂.</li></ul>
<div class="warn">Hipercapnia com pH normal (compensada) NÃO é indicação de VNI na exacerbação.</div>
<p>Melhora de pH, PaCO₂ e FR nas primeiras horas → ↓ IOT, ↓ mortalidade, ↓ complicações e internação. <b>pH &lt; 7,25:</b> maior risco de falha, iniciar onde há IOT disponível (UTI). Sucesso ~75–80%.</p>
<h4>Ajuste prático</h4>
<div class="minis"><div class="mini"><b>Interface</b>Oronasal na fase aguda.</div><div class="mini"><b>EPAP</b>Iniciar 4–5; ↑ se disparo ineficaz (auto-PEEP) ou apneias.</div><div class="mini"><b>IPAP</b>Iniciar ~15; ↑ 2–5 a cada ~10 min até 20 (máx ~30).</div><div class="mini"><b>Alvo</b>VC 6–8 mL/kg predito, ↓ FR, ↓ acessórios.</div><div class="mini"><b>Ciclagem/Ti</b>Ti curto e ciclagem precoce para exalar.</div><div class="mini"><b>SpO₂</b>88–92%.</div><div class="mini"><b>Gasometria</b>Em 1–2 h e 4–6 h; manter VNI o máximo nas primeiras 24 h.</div></div>` },

{ t: 'EAP, hipoxêmica de novo, SDRA, imunossuprimidos', s: 'Do forte ao controverso',
b: `<h4>EAP cardiogênico (evidência forte)</h4>
<p>↑ pressão intratorácica → ↓ pré-carga e ↓ pós-carga do VE; recrutamento ↓ shunt; ↓ esforço. <b>CPAP ou bilevel: ambos forte.</b> Considerar se FR &gt; 25 e SpO₂ &lt; 90%. Iniciar cedo com vasodilatador e diurético. <b>CPAP ~10</b> ou EPAP 8–10 + PS baixa. Bilevel se hipercapnia ou fadiga. Resposta rápida (minutos a 1 h).</p>
<div class="warn">Choque cardiogênico ou IAM instável: VNI não substitui a IOT e pode reduzir ainda mais o débito.</div>
<h4>Hipoxêmica de novo (pneumonia, SDRA): maior controvérsia</h4>
<p>ATS 2026: CNAF forte; VNI/CPAP condicional (certeza baixa). ERS 2022: CNAF em vez de VNI; CNAF nas pausas. ESICM 2023: sem recomendação fora da COVID. <b>Falha em ~50%</b>: indicação seletiva e reavaliação precoce.</p>
<h4>SDRA e COVID-19</h4>
<p>Não invasivo pode evitar IOT, mas <b>falha tardia piora o desfecho: não postergar IOT</b>. Definição global de SDRA (2024): inclui não intubado em CNAF ≥ 30 L/min ou VNI/CPAP com PEEP ≥ 5; P/F ≤ 300 ou S/F ≤ 315; infiltrados bilaterais não explicados só por IC/hipervolemia.</p>
<h4>Imunocomprometidos e pós-operatório</h4>
<p>IOT no imunossuprimido tem mortalidade muito alta; hoje a tendência é CNAF como 1ª linha, VNI selecionada. Neutropenia/plaquetopenia: cuidado com pele e sangramento nasal. Pós-operatório: atelectasia e ↓ CRF; VNI condicional. <b>CPAP profilático de rotina após cirurgia abdominal não reduziu complicações.</b> Esofagectomia/gastrectomia: pressões baixas e decisão com a cirurgia.</p>` },

{ t: 'Pós-extubação: preventiva sim, resgate NÃO', s: 'VNI de resgate: 25% × 14% de mortalidade',
b: `<div class="minis"><div class="mini"><b>Preventiva (alto risco)</b>Logo após extubar, ANTES da IRpA: idade &gt; 65, IMC &gt; 30, hipercapnia ao fim do TRE, DPOC, IC, VM &gt; 7 dias, falha prévia de TRE/desmame difícil, tosse fraca, secreção abundante, APACHE II alto.</div><div class="mini" style="border-color:var(--bad)"><b style="color:var(--bad)">Resgate (IRpA instalada)</b>NÃO usar. Aumenta a mortalidade na UTI (<b style="display:inline;color:inherit">25% × 14%</b>) por atrasar a reintubação (~12 h × ~2,5 h). Exceção relativa: DPOC hipercápnico, equipe experiente, prazo curto.</div></div>
<h4>Outros cenários</h4>
<ul><li><b>Pré-oxigenação:</b> VNI reduz hipoxemia na IOT (9% × 19%).</li><li><b>Trauma torácico:</b> com analgesia; cuidado com pneumotórax não drenado.</li><li><b>Obesidade/AOS:</b> EPAP corrige colapso de VAS.</li><li><b>Neuromusculares:</b> VNI + assistência à tosse; crise miastênica grave → IOT precoce.</li><li><b>Asma grave:</b> sem recomendação; se usar, UTI e não atrasar IOT.</li><li><b>Fibrose cística/bronquiectasias:</b> ponte, associar higiene brônquica.</li></ul>` },

{ t: 'Contraindicações', s: 'Absolutas e relativas',
b: `<div class="minis"><div class="mini" style="border-color:var(--bad)"><b style="color:var(--bad)">Absolutas</b>• Parada cardíaca ou respiratória<br>• Necessidade de IOT imediata (exaustão iminente, choque grave, hipoxemia refratária com risco de PCR)<br>• Glasgow ≤ 8 sem proteção de via aérea (exceção: encefalopatia hipercápnica da DPOC em teste curto, com IOT disponível)<br>• Na prática: impossibilidade de adaptar interface (trauma/deformidade facial), obstrução fixa de VAS, vômitos incoercíveis, HDA ativa</div>
<div class="mini"><b>Relativas (risco × benefício)</b>• Falência não respiratória: encefalopatia grave, arritmia maligna, instabilidade, angina instável<br>• HDA<br>• Não protege via aérea / tosse ineficaz<br>• Alto risco de aspiração, distensão abdominal<br>• Cirurgia/trauma/queimadura facial<br>• Anastomose esofágica ou cirurgia gástrica alta recente<br>• Agitação, não cooperação, claustrofobia<br>• IRpA instalada após extubação<br>• DPOC hipercápnico SEM acidemia<br>• Pneumotórax não drenado</div></div>` },

{ t: 'Equipamento e interfaces', s: 'Metade do sucesso está na máscara',
b: `<div class="tblwrap"><table class="t"><thead><tr><th></th><th>Ventilador de UTI (módulo VNI)</th><th>Ventilador específico ("BiPAP")</th></tr></thead><tbody>
<tr><td>Circuito</td><td>Duplo</td><td>Único</td></tr><tr><td>Exalação</td><td>Válvula do ventilador</td><td>Orifício/porta exalatória (vazamento intencional)</td></tr><tr><td>Máscara</td><td><b>Sem</b> orifício (non-vented)</td><td><b>Com</b> orifício (vented) ou porta</td></tr><tr><td>Vazamento</td><td>Compensado só no modo VNI</td><td>Compensação ampla</td></tr><tr><td>FiO₂</td><td>Precisa (blender)</td><td>Imprecisa: guiar por SpO₂</td></tr><tr><td>Monitorização</td><td>Completa</td><td>Limitada</td></tr><tr><td>Melhor uso</td><td>IRpA grave, hipoxemia com FiO₂ alta</td><td>Hipercápnicos, uso prolongado, domicílio</td></tr></tbody></table></div>
<p><b>Ramo único:</b> porta exalatória (nunca as duas fechadas), EPAP mínimo ~4 para lavar CO₂. <b>Circuito duplo:</b> máscara sem orifício, ativar compensação de VNI, ajustar alarmes. <b>Umidificação</b> aquecida no uso prolongado; <b>HME aumenta espaço morto: evitar no hipercápnico</b>.</p>
<h4>Interfaces</h4>
<div class="tblwrap"><table class="t"><thead><tr><th>Interface</th><th>Vantagens</th><th>Desvantagens</th></tr></thead><tbody>
<tr><td>Nasal</td><td>Menos claustrofobia e aspiração; fala, come, expectora; menor espaço morto</td><td>Vazamento oral; exige boca fechada. Uso crônico/estável</td></tr>
<tr><td><b>Oronasal</b></td><td><b>1ª escolha na IRpA</b> (dispneico respira pela boca); melhor correção gasométrica</td><td>Espaço morto, claustrofobia, aspiração, fala/alimentação</td></tr>
<tr><td>Facial total</td><td>Confortável no uso prolongado; alternativa com lesão no dorso nasal</td><td>Espaço morto, ressecamento ocular, claustrofobia</td></tr>
<tr><td>Helmet</td><td>Sem contato facial, pressões altas por longos períodos</td><td>Reinalação de CO₂ (fluxo alto), ruído, assincronia; pior descarga com PS</td></tr></tbody></table></div>
<h4>Adaptar e proteger</h4>
<ul><li>Tamanho: da ponte nasal ao sulco abaixo do lábio inferior.</li><li>Colocação gradual, segurando a máscara com a mão, pressões baixas.</li><li>Hidrocoloide/espuma no dorso nasal desde o início; inspecionar a cada 2–4 h.</li><li>Fixação: passar 1–2 dedos sob as tiras. <b>Apertar não resolve vazamento.</b></li><li>Rodízio de interfaces; combinar sinais com o paciente.</li></ul>` },

{ t: 'CPAP × bilevel e parâmetros iniciais', s: 'Como programar por cenário',
b: `<div class="minis"><div class="mini"><b>CPAP</b>Pressão única no ciclo todo. FR, VC e VM do paciente. ↑ CRF, recruta, ↓ pré e pós-carga. <u>Sem suporte inspiratório.</u> EAP, atelectasia pós-op, AOS, hipoxemia.</div><div class="mini"><b>Bilevel (BiPAP/PSV)</b>IPAP + EPAP (diferença = PS). Disparo e ciclagem pelo paciente; FR backup (S/T). Recruta + ventila: ↑ VC, ↓ PaCO₂. Hipercapnia, fadiga, EAP com hipercapnia, pós-extubação.</div></div>
<div class="tblwrap"><table class="t"><thead><tr><th>Passo / cenário</th><th>CPAP</th><th>Bilevel</th></tr></thead><tbody>
<tr><td>Pressões iniciais</td><td>5–10 cmH₂O</td><td>EPAP 4–8 e PS 6–10 (IPAP ~10–15)</td></tr>
<tr><td>Titulação</td><td>+1–2 a cada 5–10 min</td><td>IPAP/PS +2 a cada 5–10 min</td></tr>
<tr><td>FiO₂</td><td colspan="2">SpO₂ 92–96% (hipoxêmico) ou 88–92% (hipercápnico)</td></tr>
<tr><td>EAP cardiogênico</td><td>~10</td><td>EPAP 8–10 e PS 5–10 se fadiga/hipercapnia</td></tr>
<tr><td>DPOC / hipercápnico</td><td>Não é o modo de escolha</td><td>EPAP 4–5, IPAP 15 → 20 (até ~30), VC 6–8 mL/kg</td></tr>
<tr><td>Hipoxêmico de novo</td><td>8–10 (máscara ou helmet)</td><td>EPAP 8–10; PS mínima para VC ≤ 9,5 mL/kg</td></tr></tbody></table></div>` },

{ t: 'Monitorização: as primeiras horas', s: 'O sucesso se decide cedo',
b: `<div class="flow"><span><b>0–15 min</b> Adaptação: pressões baixas, máscara na mão, vazamento e sincronia</span><i>→</i><span><b>15–60 min</b> ↓ FR e acessórios, VC, SpO₂, FC, PA, conforto</span><i>→</i><span><b>1–2 h</b> Gasometria + HACOR (&gt; 5 = alto risco); sem melhora → IOT já</span><i>→</i><span><b>4–6 h</b> Nova gaso (hipercápnicos), pele, abdome, pausas</span><i>→</i><span><b>24 h+</b> Manutenção, falha tardia, desmame</span></div>
<div class="minis"><div class="mini"><b>Sucesso</b>↓ FR e dispneia · ↑ VC (hipercápnico) / VC adequado (hipoxêmico) · ↓ acessórios e paradoxo · melhor consciência · ↑ PaO₂ com FiO₂ igual/menor · ↓ PaCO₂ e ↑ pH em 1–2 h · sem distensão, confortável.</div>
<div class="mini" style="border-color:var(--bad)"><b style="color:var(--bad)">Falha</b>FR &gt; 30–35, esforço que não cede · pH caindo/PaCO₂ subindo em 1–2 h · P/F ≤ 200 após 1 h, FiO₂ crescente · <b style="display:inline;color:inherit">VC &gt; 9,5 mL/kg no hipoxêmico</b> · rebaixamento, agitação · não elimina secreção · instabilidade · HACOR &gt; 5 em 1 h → IOT.</div></div>
<h4>Tempo da falha</h4>
<div class="minis"><div class="mini"><b>Imediata (&lt; 1 h)</b>Tosse ineficaz, secreção, encefalopatia sem resposta, intolerância, assincronia, vazamento, interface/parâmetros errados. Muitas são evitáveis.</div><div class="mini"><b>Precoce (1–48 h)</b>Gravidade da doença (SDRA, pneumonia extensa), acidose persistente, SOFA/APACHE altos, choque.</div><div class="mini"><b>Tardia (&gt; 48 h)</b>Após melhora inicial: distúrbio do sono, limitação funcional, comorbidades, hiperglicemia, nova infecção.</div></div>` },

{ t: 'HACOR', s: 'Predição de falha no hipoxêmico, em 1 h',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Variável</th><th>Faixas → pontos</th></tr></thead><tbody>
<tr><td><b>H</b>eart rate (FC)</td><td>≤ 120 → 0 · ≥ 121 → 1</td></tr>
<tr><td><b>A</b>cidose (pH)</td><td>≥ 7,35 → 0 · 7,30–7,34 → 2 · 7,25–7,29 → 3 · &lt; 7,25 → 4</td></tr>
<tr><td><b>C</b>onsciência (Glasgow)</td><td>15 → 0 · 13–14 → 2 · 11–12 → 5 · ≤ 10 → 10</td></tr>
<tr><td><b>O</b>xigenação (P/F)</td><td>≥ 201 → 0 · 176–200 → 2 · 151–175 → 3 · 126–150 → 4 · 101–125 → 5 · ≤ 100 → 6</td></tr>
<tr><td><b>R</b>espiratory rate (FR)</td><td>≤ 30 → 0 · 31–35 → 1 · 36–40 → 2 · 41–45 → 3 · ≥ 46 → 4</td></tr></tbody></table></div>
<div class="formula">Exemplo da aula: FC 125 (1) + pH 7,31 (2) + GCS 15 (0) + P/F 140 (4) + FR 34 (1) = 8 → alto risco</div>
<p>Máximo 25. <b>&gt; 5 em 1 h = alto risco de falha.</b> Alto risco intubado precocemente (≤ 12 h) teve menor mortalidade.</p>` },

{ t: 'Ajuste fino, complicações e desmame', s: 'Vazamento, assincronias, pele, aerofagia',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Problema</th><th>Como aparece</th><th>O que fazer</th></tr></thead><tbody>
<tr><td>Vazamento excessivo</td><td>↓ VC, alarmes, ar nos olhos, autodisparo</td><td>Reposicionar/trocar máscara; ↓ pressões; não só apertar</td></tr>
<tr><td>Disparo ineficaz</td><td>Esforço sem ciclo (DPOC, auto-PEEP)</td><td>↑ EPAP, ajustar sensibilidade, ↓ PS se VC muito alto</td></tr>
<tr><td>Autodisparo</td><td>Ciclos sem esforço, FR "alta"</td><td>Corrigir vazamento, ↓ sensibilidade, checar condensado</td></tr>
<tr><td>Ciclagem tardia</td><td>Inspiração longa, "briga" para exalar</td><td>↑ % de ciclagem (40–50%), limitar Ti, corrigir vazamento</td></tr>
<tr><td>Duplo disparo</td><td>Dois ciclos em um esforço</td><td>↑ PS ou Ti, ciclagem mais tardia</td></tr>
<tr><td>Aerofagia</td><td>Abdome distendido, náusea</td><td>↓ IPAP (≤ 20–25), SNG em casos selecionados</td></tr></tbody></table></div>
<h4>Complicações</h4>
<p><b>Lesão por pressão facial</b> (a mais comum, dorso nasal) · ressecamento/epistaxe · irritação ocular · claustrofobia · distensão gástrica (IPAP ≤ 20–25) · hipotensão (hipovolêmicos) · aspiração (cabeceira 30–45°) · barotrauma (raro).</p>
<h4>Desmame da VNI</h4>
<p>Começar quando: causa em resolução, <b>FR &lt; 25</b>, pH normalizado, SpO₂ no alvo com FiO₂ baixa, confortável. Hipercápnicos: após ~24 h estáveis, reduzir uso diurno e manter à noite. Estratégias: ↓ pressões OU ↑ períodos fora (ambas aceitas). Piora ao retirar → voltar e reavaliar.</p>
<h4>Reabilitação e atuação</h4>
<p>VNI durante exercício reduz dispneia, ↑ tolerância (DPOC grave) e viabiliza mobilização precoce (↑ PS e FiO₂ no esforço). VNI é competência do fisioterapeuta intensivista (<b>Resolução COFFITO 402/2011</b>). Registrar: indicação, equipamento/interface, parâmetros, sinais e VC antes e após 30–60 min, gasometrias e HACOR, tempo de uso, tolerância, pele, intercorrências.</p>
<div class="pearl">A VNI é mais difícil de conduzir do que a invasiva. O maior risco para o paciente é o atraso de uma intubação necessária.</div>` }
];

{ t: 'Conceitos, indicações e objetivos', s: 'Suporte ventilatório: quando e para quê',
b: `<p>Método de suporte ventilatório para IRpA aguda ou crônica, por <b>pressão positiva</b> nas vias aéreas (invasiva por TOT/TQT; não invasiva por máscara) ou <b>pressão negativa</b> no tórax (pulmão de aço, poliomielite).</p>
<div class="minis"><div class="mini"><b>Ventilação → PaCO₂</b>Depende do volume-minuto (VC × FR) e do espaço morto. ↑ VM → ↓ PaCO₂.</div><div class="mini"><b>Oxigenação → PaO₂</b>Depende da FiO₂, PEEP e pressão média (área alveolar aberta).</div></div>
<div class="pearl">Hipercapnia se corrige na VENTILAÇÃO (FR, VC). Hipoxemia se corrige na OXIGENAÇÃO (FiO₂, PEEP, Ti).</div>
<h4>Indicações</h4>
<ul><li>IRpA aguda ou crônica agudizada</li><li>Proteção de vias aéreas · <b>Glasgow &lt; 8</b></li><li>Cirurgia com anestesia geral · controle da PIC · PCR · choque</li></ul>
<div class="minis"><div class="mini"><b>Sinais clínicos</b>Dispneia intensa, diaforese · FR &gt; 30–35 ou &lt; 8 · acessórios · paradoxo/fadiga · falha do não invasivo em 1–2 h (HACOR, ROX).</div><div class="mini"><b>Gasometria</b>pH &lt; 7,30 com PaCO₂ &gt; 50 · PaO₂ &lt; 60 e SaO₂ &lt; 90% em O₂. Sempre com clínica e tendência.</div></div>
<p>Peri-intubação: eventos graves em ~45% das IOT em UTI (instabilidade CV a mais frequente). Decisão é clínica.</p>
<h4>Objetivos</h4>
<p><b>Respiratórios:</b> aliviar desconforto, corrigir acidose e hipoxemia, ↓ trabalho e reverter fadiga, reverter/prevenir atelectasia, ↓ consumo de O₂ dos músculos. <b>Sistêmicos:</b> ↑ oferta de O₂ no choque, ↓ HIC no TCE, viabilizar cirurgia.</p>` },

{ t: 'Riscos da VM e quando começa o desmame', s: 'VILI, PAV, VIDD, hemodinâmica, delirium, fraqueza',
b: `<div class="minis"><div class="mini"><b>VILI</b>Barotrauma, volutrauma, atelectrauma (abre-fecha), biotrauma. Base da ventilação protetora.</div><div class="mini"><b>PAV</b>Cresce com os dias; bundles: cabeceira elevada, interrupção diária da sedação, circuito, cuff.</div><div class="mini"><b>VIDD</b>Repouso total atrofia o diafragma em dias; esforço excessivo também lesa: buscar esforço "moderado".</div><div class="mini"><b>Hemodinâmica</b>Pressão positiva ↓ retorno venoso → hipotensão (hipovolêmicos, PEEP/auto-PEEP altas).</div><div class="mini"><b>Sedação, assincronia, delirium</b>Prolongam a VM, pior desfecho.</div><div class="mini"><b>Fraqueza adquirida</b>Imobilidade + inflamação + VM prolongada.</div></div>
<div class="pearl">Mais importante do que manejar o ventilador é saber o momento de intubar e, principalmente, de iniciar o desmame. O desmame começa quando adaptamos o paciente ao ventilador.</div>
<p>Na prática: parâmetros protetores desde o início, sedação leve/alvo, reavaliar a causa diariamente e triagem diária para o TRE.</p>` },

{ t: 'O ventilador: componentes, filtros e teste', s: 'Ele só "enxerga" pressão e fluxo',
b: `<p>Gases (O₂ + ar, ~50 psi) → válvula de fluxo → ramo inspiratório → paciente → ramo expiratório → válvula de exalação. Transdutores informam a CPU, que comanda as válvulas.</p>
<ul><li><b>Válvula inspiratória:</b> libera o fluxo inspiratório. <b>Expiratória:</b> libera a expiração e mantém a PEEP. <b>Proporcionais:</b> mistura O₂/ar (FiO₂).</li><li>Circuito: ramo inspiratório, expiratório, peça em Y. <b>Não trocar por tempo</b>: só se sujo, danificado ou com mau funcionamento.</li></ul>
<h4>Filtros e umidificação</h4>
<div class="minis"><div class="mini"><b>HME</b>Umidificação passiva.</div><div class="mini"><b>HMEF</b>Filtro bacteriano/viral + umidificação.</div><div class="mini"><b>HEPA</b>Alta eficiência, sem umidificar.</div></div>
<p>Por que umidificar: o tubo "pula" o nariz → ressecamento, secreção espessa, obstrução do tubo. <b>Evitar HME</b> (preferir ativa) em secreção espessa/abundante/sanguinolenta, fístula broncopleural, hipotermia, VM alto. <b>Nunca HME + umidificador aquecido.</b> HME/HMEF acrescentam espaço morto e resistência (relevante em VC baixo e no desmame).</p>
<h4>Teste inicial (checklist de decolagem)</h4>
<ol><li>Rede elétrica, gases, bateria.</li><li>Montar circuito, filtros, sensor de fluxo.</li><li>Autoteste: vazamento, complacência do circuito, calibração.</li><li>Em standby: modo, parâmetros e alarmes antes de conectar.</li><li>Pulmão-teste; AMBU com O₂ e aspiração à beira-leito.</li></ol>` },

{ t: 'Equação do movimento e ciclo ventilatório', s: 'Inspiração → ciclagem → expiração → disparo',
b: `<div class="formula">Pva = VC/C + R × Fluxo + PEEP total</div>
<div class="minis"><div class="mini"><b>Elástico (VC/C)</b>Distender pulmão e caixa: reflete no <u>platô</u>.</div><div class="mini"><b>Resistivo (R × fluxo)</b>Atrito em vias e tubo: diferença <u>pico − platô</u>.</div><div class="mini"><b>Base</b>PEEP ajustada + auto-PEEP.</div></div>
<p>A pressão sobe se ↑ volume, ↓ complacência ou ↑ fluxo/resistência. Volume = fluxo × tempo (0,5 L/s × 1 s = 500 mL). 60 L/min = 1 L/s.</p>
<h4>As 4 fases</h4>
<div class="flow"><span>1 Inspiração (válvula inspiratória aberta)</span><i>→</i><span>2 Ciclagem</span><i>→</i><span>3 Expiração passiva até a PEEP</span><i>→</i><span>4 Disparo</span></div>
<h4>Disparo</h4>
<ul><li><b>Tempo:</b> janela = 60/FR (modo controlado).</li><li><b>Pressão:</b> esforço gera queda de pressão abaixo do limiar (−1 a −3 cmH₂O).</li><li><b>Fluxo:</b> esforço desvia o fluxo de base (2–3 L/min); em geral exige menos esforço.</li><li><b>Neural:</b> atividade elétrica do diafragma (NAVA).</li></ul>
<div class="tblwrap"><table class="t"><thead><tr><th>FR</th><th>Janela</th><th>Ti 1 s → Te</th><th>I:E</th></tr></thead><tbody><tr><td>12</td><td>5 s</td><td>4 s</td><td>1:4</td></tr><tr><td>15</td><td>4 s</td><td>3 s</td><td>1:3</td></tr><tr><td>20</td><td>3 s</td><td>2 s</td><td>1:2</td></tr><tr><td>30</td><td>2 s</td><td>1 s</td><td>1:1</td></tr></tbody></table></div>
<p>Sensibilidade: <b>quanto maior o valor, menos sensível</b>. Baixa demais → autodisparo; alta demais → esforços ineficazes.</p>
<h4>Ciclagem</h4>
<p>A volume, pressão, tempo, fluxo (% do pico) ou neural. Atuais: <b>VCV e PCV ciclam a tempo</b>; <b>PSV cicla a fluxo (~25% do pico)</b>; NAVA neural.</p>
<div class="warn">Se a expiração não termina antes do próximo disparo (fluxo não volta a zero) → auto-PEEP.</div>` },

{ t: 'Tipos de ciclo e variáveis controladas', s: 'Controlado · assistido · espontâneo',
b: `<p>Todo modo responde: <b>quem dispara?</b> <b>qual variável é controlada?</b> <b>o que cicla?</b></p>
<div class="tblwrap"><table class="t"><thead><tr><th></th><th>Controlado</th><th>Assistido</th><th>Espontâneo</th></tr></thead><tbody><tr><td>Quem dispara</td><td>Ventilador (tempo)</td><td>Paciente (pressão/fluxo)</td><td>Paciente</td></tr><tr><td>Quem controla fluxo/pressão</td><td>Ventilador</td><td>Ventilador</td><td>Paciente (com suporte)</td></tr><tr><td>Quem cicla</td><td>Ventilador</td><td>Ventilador</td><td>Paciente (fluxo)</td></tr><tr><td>Exemplo</td><td>VCV/PCV sem esforço</td><td>VCV/PCV com esforço (A/C)</td><td>PSV, CPAP</td></tr></tbody></table></div>
<p>O ventilador controla uma variável por vez: se controla volume/fluxo (VCV), a <b>pressão é consequência</b>; se controla pressão (PCV/PSV), <b>volume e fluxo são consequência</b>.</p>` },

{ t: 'Parâmetros iniciais', s: 'Os números da VM em uma página',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Parâmetro</th><th>Ajuste inicial</th><th>Efeito principal</th></tr></thead><tbody>
<tr><td>FiO₂</td><td>Menor para SpO₂ 92–96% (88–92% se hipercápnico); ≤ 0,6</td><td>Oxigenação</td></tr>
<tr><td>VC</td><td>6–8 mL/kg de peso <b>predito</b></td><td>Ventilação, risco de VILI</td></tr>
<tr><td>PEEP</td><td>5–8 cmH₂O</td><td>Oxigenação, recrutamento, hemodinâmica</td></tr>
<tr><td>FR</td><td>12–16 irpm</td><td>PaCO₂, auto-PEEP</td></tr>
<tr><td>Fluxo (VCV)</td><td>40–60 L/min</td><td>Ti, conforto, auto-PEEP</td></tr>
<tr><td>Ti</td><td>0,8–1,2 s</td><td>Oxigenação, I:E</td></tr>
<tr><td>I:E</td><td>1:2 a 1:3</td><td>Oxigenação × esvaziamento</td></tr>
<tr><td>Sensibilidade</td><td>Pressão −1 a −3 cmH₂O · fluxo 2–3 L/min</td><td>Sincronia</td></tr>
<tr><td>Rise time</td><td>Individualizar</td><td>Conforto</td></tr></tbody></table></div>
<h4>Logo após a IOT</h4>
<ol><li>PCV ou VCV em A/C.</li><li>VC 6–8 mL/kg predito.</li><li>FiO₂ alta se necessário e reduzir rapidamente.</li><li>FR 12–16.</li><li>PEEP 5 (5–8).</li><li>Alarmes e backup (pressão máx, VC/VE, FR alta, apneia).</li></ol>
<p>Também: Pplat ≤ 30 e ΔP ≤ 15.</p>
<h4>Primeiros 30 minutos</h4>
<p><b>RX</b> (TOT acima da carina, pneumotórax, intubação seletiva) · <b>ausculta</b> simétrica + capnografia · <b>gasometria após ~30 min</b> · cuff <b>20–30 cmH₂O</b>, fixação e marca do TOT, cabeceira 30–45°, sedação por metas.</p>` },

{ t: 'FiO₂, VC e peso predito', s: 'Peso ideal pela altura, não peso real',
b: `<p>FiO₂: 0,21–1,0; a menor para SpO₂ 92–96%. <b>&gt; 0,6</b>: toxicidade, atelectasia de absorção, piora da hipercapnia. Evitar SpO₂ persistentemente &gt; 96%.</p>
<h4>FiO₂ alta e difícil de reduzir</h4>
<p>↑ Ti · ↑ PEEP / titular a PEEP ideal (↓ shunt) · prona ≥ 16 h/dia se SDRA com <b>P/F &lt; 150</b>. Recrutamento prolongado de rotina <b>não</b> é recomendado. Mecanismo comum: ↑ pressão média → ↑ pulmão aerado → ↓ shunt.</p>
<h4>Meta de SpO₂ (fluxograma)</h4>
<p>Risco hipercápnico? <b>Sim</b>: &lt; 88% ↑ FiO₂ · 88–92% manter · ≥ 92% reduzir. <b>Não</b>: &lt; 92% ↑ FiO₂ · 92–96% manter · ≥ 96% reduzir.</p>
<h4>Volume corrente</h4>
<p>VC alto = volutrauma (sobretudo no "baby lung"). VC muito baixo = atelectasia e hipercapnia. Em VCV o VC é pré-determinado; em PCV varia com complacência, resistência e esforço.</p>
<div class="formula">Homem: 50 + 0,91 × (altura − 152,4)   ·   Mulher: 45,5 + 0,91 × (altura − 152,4)</div>
<p>Ex.: homem 1,80 m → 75 kg → VC 450 (6 mL/kg) a 600 mL (8), pese ele 70 ou 105 kg. O pulmão depende de altura e sexo.</p>
<div class="tblwrap"><table class="t"><thead><tr><th>Estudo</th><th>Mensagem</th></tr></thead><tbody><tr><td>ARDSNet (2000)</td><td>VC 6 + Pplat ≤ 30 vs 12 mL/kg: mortalidade 31,0% vs 39,8%. Marco da ventilação protetora.</td></tr><tr><td>PReVENT (2018)</td><td>Sem SDRA: VC 4–6 vs 8–10 sem diferença. Não reduzir abaixo de 6–8 de rotina.</td></tr><tr><td>ATS 2024 / ESICM 2023</td><td>SDRA: 4–8 mL/kg, alvo ~6, Pplat &lt; 30.</td></tr></tbody></table></div>` },

{ t: 'PEEP e auto-PEEP', s: 'Três domínios: troca, complacência, hemodinâmica',
b: `<p>PEEP mantém alvéolos abertos no fim da expiração: ↑ oxigenação, ↓ atelectasia e atelectrauma. Valores altos: ↓ retorno venoso, ↑ pós-carga do VD. Inicial: <b>5–8</b>.</p>
<div class="tblwrap"><table class="t"><thead><tr><th></th><th>Troca gasosa</th><th>Complacência</th><th>Hemodinâmica</th></tr></thead><tbody><tr><td>PEEP baixa</td><td>Colapso, ↓ P/F</td><td>↓ (colapso)</td><td>Vasoconstrição hipóxica, sobrecarga de VD</td></tr><tr><td>PEEP adequada</td><td>↑ P/F sem hipercapnia</td><td>↑ (aberto sem sobredistensão)</td><td>↓ hipoxemia, efeito ordenha, otimiza VE</td></tr><tr><td>PEEP alta</td><td>Sobredistensão, ↑ espaço morto e PaCO₂</td><td>↓ (sobredistensão)</td><td>↓ retorno venoso, ↑ sobrecarga de VD</td></tr></tbody></table></div>
<p>Escolha: tabela PEEP/FiO₂ (ARDSNet), melhor complacência / menor ΔP em titulação decremental, manometria esofágica, EIT. ATS 2024: PEEP mais alta sem recrutamento (moderada-grave); recrutamento prolongado <b>não</b> (forte). ART (2017): recrutamento máximo ↑ mortalidade.</p>
<h4>Auto-PEEP (PEEP intrínseca)</h4>
<p>Pressão alveolar positiva não intencional no fim da expiração: o próximo ciclo começa antes de o pulmão esvaziar (hiperinsuflação dinâmica).</p>
<div class="minis"><div class="mini"><b>Repercussões</b>↓ retorno venoso → hipotensão, ↓ DC · diafragma retificado, esforços ineficazes · barotrauma, Pplat alta · "esconde-se": só aparece na pausa expiratória.</div><div class="mini"><b>Identificar</b>Fluxo expiratório não volta a zero antes do disparo; loop fluxo-volume não fecha.</div><div class="mini"><b>Medir</b>Pausa expiratória (0,5–2 s, paciente passivo): PEEP total. <b style="display:inline;color:inherit;text-transform:none">Auto-PEEP = PEEP total − PEEP ajustada</b> (12 − 5 = 7).</div></div>
<p><b>Causas:</b> ↓ retração elástica, ↑ resistência, limitação ao fluxo, VC excessivo, Te curto (FR alta). <b>Manejo:</b> ↓ FR e ↓ VC (aceitar hipercapnia), ↑ fluxo / ↓ Ti para ↑ Te, tratar obstrução (broncodilatador, aspirar, checar tubo e filtro). DPOC com esforço ineficaz: PEEP externa até ~80% da auto-PEEP.</p>` },

{ t: 'FR, volume-minuto, fluxo, I:E, trigger e rise', s: 'Ajuste fino dos tempos',
b: `<p><b>FR:</b> 12–16; a menor para VM adequado. <b>&gt; 30 é muito prejudicial</b> (↑ potência mecânica). Na SDRA com VC baixo pode precisar FR maior (até 35) sem auto-PEEP. FR medida &gt; ajustada = paciente disparando.</p>
<div class="formula">VE = VC × FR   ·   FR nova = FR atual × PaCO₂ atual ÷ PaCO₂ desejada</div>
<p>Ex.: FR 14, PaCO₂ 56 → alvo 40: 14 × 56/40 ≈ 20. <b>Prefira ajustar a FR</b> mantendo VC protetor. Ventilação efetiva = (VC − espaço morto) × FR.</p>
<p><b>Fluxo (VCV):</b> 40–60 L/min. Fluxo insuficiente → <b>fome de fluxo</b>. Onda quadrada facilita medir mecânica; descendente distribui melhor e ↓ pico. Em PCV/PSV o fluxo é livre e desacelerado.</p>
<p><b>I:E:</b> normal 1:2; inicial 1:2–1:3. Ex.: FR 20 → ciclo 3 s; Ti 1 → Te 2 (1:2). FR 30 com mesmo Ti → 1:1. <b>Obstrutivos 1:3 ou 1:4</b>. <b>SDRA</b>: pode ir a 1:1 ou inversa (monitorar auto-PEEP e hemodinâmica).</p>
<p><b>Trigger:</b> o mais sensível possível sem autodisparo. Causas de autodisparo: vazamento (cuff, circuito, dreno com fístula), água no circuito, oscilação cardiogênica, sensibilidade excessiva → corrigir a causa antes de "endurecer" o trigger.</p>
<p><b>Rise time:</b> mais acelerado em obstrutivos (cuidado com overshoot), menos acelerado em restritivos. <b>Ciclagem PSV:</b> padrão ~25%; obstrutivo → ↑ % (40–50%); restritivo → ↓ %.</p>` },

{ t: 'Mecânica respiratória à beira-leito', s: 'Pico, platô, ΔP, Cest e Rva',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Medida</th><th>Fórmula / como</th><th>Alvo</th></tr></thead><tbody>
<tr><td>Ppico</td><td>Máxima no ciclo (inclui resistivo)</td><td>&lt; 35 cmH₂O</td></tr>
<tr><td>Pplat</td><td>Pausa inspiratória ≥ 0,5 s (0,5–2), VCV fluxo quadrado, paciente <b>passivo</b></td><td>≤ 30 cmH₂O</td></tr>
<tr><td>ΔP (driving)</td><td>Pplat − PEEP = VC/Cest</td><td>&lt; 15 cmH₂O</td></tr>
<tr><td>Cest</td><td>VC ÷ (Pplat − PEEP)</td><td>50–100 (SDRA &lt; 40)</td></tr>
<tr><td>Cdin</td><td>VC ÷ (Ppico − PEEP)</td><td>Inclui resistivo</td></tr>
<tr><td>Rva</td><td>(Ppico − Pplat) ÷ fluxo (L/s)</td><td>cmH₂O/L/s</td></tr></tbody></table></div>
<p>Amato (2015): a <b>ΔP</b> foi a variável mais associada à sobrevida na SDRA: "normaliza" o VC pelo pulmão funcional.</p>
<div class="formula">Ex.: VC 450, Pplat 25, PEEP 10 → ΔP 15 → Cest 30 (reduzida)</div>
<div class="formula">Ex.: Ppico 32, Pplat 24, fluxo 60 L/min (1 L/s) → Rva 8</div>
<p>↑ Rva: secreção, broncoespasmo, tubo fino/dobrado/mordido, filtro saturado, água no circuito.</p>
<h4>Pico subiu? Olhe o platô</h4>
<div class="minis"><div class="mini"><b>↑ Pico + platô normal = RESISTIVO</b>Secreção/rolha → aspirar · broncoespasmo → broncodilatador · tubo dobrado/mordido → Guedel · fluxo alto demais.</div><div class="mini"><b>↑ Pico + ↑ platô = ELÁSTICO</b>SDRA, edema, pneumonia, atelectasia · pneumotórax · intubação seletiva · distensão abdominal, derrame · auto-PEEP, VC excessivo.</div></div>
<h4>Avançado</h4>
<p><b>Potência mecânica</b>: energia por minuto (J/min); FR e ΔP altas ↑ energia. <b>P0.1</b>: &gt; 3,5–4 = drive alto; &lt; 1 = sobreassistência. <b>Pocc</b>: estima esforço. Objetivo: nem repouso total do diafragma, nem esforço excessivo (P-SILI).</p>` },

{ t: 'Modos: VCV, PCV, PSV e outros', s: 'O que ajusto e o que fica livre',
b: `<div class="minis"><div class="mini"><b>VCV</b>Fluxo constante; pressão livre. Ajusto VC, fluxo, FR, PEEP, FiO₂, sensibilidade, pausa. <u>Vigiar pressões.</u> Bom para paciente passivo e medir mecânica. Desvantagem: barotrauma se não monitorar; fome de fluxo com drive.</div>
<div class="mini"><b>PCV</b>Pressão constante durante o Ti; fluxo desacelerado; VC consequência. Ajusto Pinsp, Ti, FR, PEEP, FiO₂, rise. <u>Vigiar VC e VE</u> (alarmes). Compensa vazamento (fístula). Se a complacência cai, o VC cai sem alarme de pressão.</div>
<div class="mini"><b>PSV</b>Espontâneo: paciente dispara, define fluxo e Ti; cicla a fluxo (~25%). PS para VC 6–8 mL/kg e FR &lt; 30 sem acessórios. <u>Não garante VC nem FR</u>: exige drive; backup de apneia.</div></div>
<p>VCV e PCV têm desfechos semelhantes: ventilar protetor e monitorar a variável livre.</p>
<h4>Controlado × assistido-controlado (A/C)</h4>
<p>Controlado: disparo só a tempo. A/C: o paciente pode disparar antes (deflexão negativa); se não disparar, o ventilador garante a FR mínima.</p>
<h4>PSV no desmame</h4>
<p>Reduzir a PS gradualmente até <b>7–10 cmH₂O</b>. <b>TRE 30–120 min</b> em PSV baixa (5–8) ou tubo T. ATS/ACCP: 1º TRE com PSV em vez de tubo T/CPAP.</p>
<h4>Outros modos</h4>
<ul><li><b>PRVC/VCRP:</b> volume-alvo com controle a pressão, ajusta ciclo a ciclo.</li><li><b>SIMV:</b> mandatórios + espontâneos; <b>não recomendado para desmame</b>.</li><li><b>APRV:</b> dois níveis com liberações curtas; resgate na hipoxemia.</li><li><b>PAV+:</b> proporcional ao esforço. <b>NAVA:</b> guiado pela Edi. <b>ASV:</b> adaptativo.</li></ul>` },

{ t: 'Assincronias paciente-ventilador', s: 'Olhe as curvas em toda avaliação',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Assincronia</th><th>Sinal nas curvas</th><th>Conduta</th></tr></thead><tbody>
<tr><td>Esforço ineficaz</td><td>Deflexão na pressão e ↑ no fluxo expiratório sem novo ciclo</td><td>↑ sensibilidade; tratar auto-PEEP; ↓ sobreassistência</td></tr>
<tr><td>Autodisparo</td><td>FR acima da ajustada sem deflexão prévia</td><td>Corrigir vazamento/água; ↓ sensibilidade</td></tr>
<tr><td>Duplo disparo</td><td>Dois ciclos seguidos sem expiração completa</td><td>↑ Ti ou VC (protetor); avaliar sedação</td></tr>
<tr><td>Fluxo insuficiente</td><td>Pressão "côncava" (escavada) na VCV</td><td>↑ fluxo ou trocar para PCV/PSV</td></tr>
<tr><td>Ciclagem precoce</td><td>Esforço continua após ciclar; duplo disparo</td><td>↑ Ti (PCV) / ↓ % ciclagem (PSV)</td></tr>
<tr><td>Ciclagem tardia</td><td>Pico de pressão no fim da inspiração; expiração ativa</td><td>↓ Ti / ↑ % ciclagem (PSV); ↓ PS</td></tr></tbody></table></div>
<div class="warn">Índice de assincronia &gt; 10% associa-se a VM mais prolongada e pior desfecho.</div>
<h4>Monitorização a registrar sempre</h4>
<p>Ppico, Pplat, ΔP, PEEP total (auto-PEEP), Cest, Rva, VC expirado, VE, FR total × ajustada, pressão de cuff e a tendência. Além de gasometria, capnografia, curvas, ausculta, sinais vitais, RASS e CAM-ICU.</p>` },

<tr><td>PaCO₂ baixa + pH alto</td><td>Alcalose respiratória</td><td>↓ FR ajustada; avaliar dor, ansiedade, febre, acidose metabólica</td></tr>

{ t: 'Situações específicas', s: 'EAP, SDRA, obstrutivos, trauma, HIC, COVID',
b: `<h4>EAP cardiogênico</h4>
<p>Pressão positiva ↓ pré e pós-carga do VE; PEEP desloca líquido e reabre unidades. ↑ PEEP conforme tolerância (cuidado: hipotensão se dependente de pré-carga, falência de VD). <b>VNI é 1ª linha</b>; VMI se falha.</p>
<h4>SDRA: ventilação protetora</h4>
<div class="minis"><div class="mini"><b>VC</b>4–8 mL/kg predito (alvo ~6); ↓ até 4 se Pplat &gt; 30 ou ΔP &gt; 15.</div><div class="mini"><b>Pplat</b>&lt; 30.</div><div class="mini"><b>ΔP</b>&lt; 15.</div><div class="mini"><b>CO₂</b>Hipercapnia permissiva com pH ≥ 7,20.</div></div>
<p><b>Definição global (2024):</b> início ≤ 1 semana; opacidades bilaterais (RX, TC ou US) não explicadas por derrame, atelectasia ou nódulos; edema não explicado por IC/hipervolemia; P/F ≤ 300 ou S/F ≤ 315 (SpO₂ ≤ 97%), inclui CNAF ≥ 30 L/min ou VNI/CPAP ≥ 5. Intubados: leve 200–300 · moderada 100–200 · grave ≤ 100.</p>
<p>Prona ≥ 12–16 h/dia (moderada-grave) · PEEP mais alta sugerida (ATS) · recrutamento prolongado não · corticoide sugerido · BNM na grave precoce · ECMO VV na grave selecionada.</p>
<h4>Obstrutivos (asma e DPOC)</h4>
<p>Limitação ao fluxo expiratório → aprisionamento → auto-PEEP. <b>Prioridade: dar tempo para expirar.</b></p>
<div class="minis"><div class="mini"><b>VC</b>6–8 mL/kg.</div><div class="mini"><b>FR</b>Baixa (~8–12).</div><div class="mini"><b>I:E</b>1:3 ou 1:4.</div><div class="mini"><b>Fluxo</b>Alto (~60–100 L/min).</div><div class="mini"><b>PEEP externa</b>DPOC: até ~80% da auto-PEEP se esforço ineficaz.</div><div class="mini"><b>CO₂</b>Permissiva: corrigir o pH, não a PaCO₂ basal.</div></div>
<h4>Trauma</h4>
<p>Riscos: hipovolemia, contusão, distensão abdominal, HIC. TCE: evitar hipotensão, hipoxemia e hipercapnia. SpO₂ &gt; 93% e normocapnia (capnografia). PNX pode ficar hipertensivo com pressão positiva → drenar. Fístula broncopleural: PCV compensa vazamento.</p>
<h4>Hipertensão intracraniana</h4>
<p>CO₂ ↑ → vasodilatação → ↑ PIC: <b>evitar hipercapnia e acidose</b>. SpO₂ &gt; 93%, normocapnia. ESICM 2020: sem HIC, ventilação protetora também; com HIC, <b>PaCO₂ 35–45 e PaO₂ 80–120</b>, evitar hipercapnia permissiva. Hiperventilação só como resgate temporário na herniação.</p>
<h4>COVID-19</h4>
<p>Inicial: VCV ou PRVC, VC 6–8, FR 16–24, FiO₂ 100% e reduzir para SpO₂ 92–96%, PEEP 10 ou tabela; gaso ≥ 1 h após IOT. Hoje manejada como SDRA de outras causas (prona 12–16 h, sem recrutamento prolongado).</p>` }

  ['RVS', 'Resistência Vascular Sistêmica', 'aval', 'O quanto os vasos estão "apertados" (contraídos) ou "abertos" (dilatados).', 'RVS baixa = choque distributivo (sepse). RVS alta = vasos fechados compensando (hipovolêmico, cardiogênico).'],
  ['Pré-carga', '', 'aval', 'O quanto o coração "enche" de sangue antes de contrair (volume que chega).', 'Cai no choque hipovolêmico (perdeu volume).'],
  ['Pós-carga', '', 'aval', 'A resistência que o coração precisa vencer para ejetar o sangue.', 'Relacionada à RVS. PEEP alta reduz pós-carga do VE (ajuda no EAP cardiogênico).'],
  ['Choque', '', 'aval', 'Falta de oxigênio nos tecidos porque a circulação não está dando conta (perfusão inadequada).', 'Sinais: hipotensão, taquicardia, pele fria/moteada, lactato alto, pouca urina, confusão. 4 tipos: hipovolêmico, cardiogênico, distributivo, obstrutivo.'],
  ['Choque hipovolêmico', '', 'aval', 'Choque por perda de volume (sangue ou líquido): o "tanque" ficou vazio.', 'Hemorragia, desidratação, queimadura. DC baixo, RVS alta. Tratamento: repor volume.'],
  ['Choque cardiogênico', '', 'aval', 'Choque porque a bomba (coração) falhou.', 'IAM, ICC grave. DC baixo, RVS alta, congestão pulmonar. Droga: dobutamina.'],
  ['Choque distributivo', '', 'aval', 'Choque porque os vasos dilataram demais e o sangue "se espalhou".', 'Sepse (o mais comum), anafilaxia, neurogênico. RVS baixa, pele quente no início. Droga: noradrenalina.'],
  ['Choque obstrutivo', '', 'aval', 'Choque porque algo bloqueia a saída ou o enchimento do coração.', 'TEP maciço, pneumotórax hipertensivo, tamponamento cardíaco. Tratar a causa (desobstruir).'],
  ['Sepse', '', 'aval', 'Disfunção de órgão causada por resposta desregulada do corpo a uma infecção.', 'Choque séptico: precisa de vasopressor para PAM ≥ 65 e lactato > 2 mesmo com volume.'],
  ['SDMO', 'Síndrome de Disfunção de Múltiplos Órgãos', 'aval', 'Quando vários órgãos falham ao mesmo tempo (pulmão, rim, fígado, cérebro...).', 'Comum na sepse grave. Quanto mais órgãos, maior a mortalidade.'],
  ['SOFA', 'Sequential Organ Failure Assessment', 'aval', 'Escore que pontua a falência de 6 sistemas (respiratório, coagulação, fígado, cardiovascular, neuro, rim).', 'Aumento ≥ 2 pontos com infecção = sepse.'],
  ['APACHE', 'Acute Physiology and Chronic Health Evaluation', 'aval', 'Escore de gravidade que estima o risco de morte na UTI nas primeiras 24 h.', 'Quanto maior, mais grave.'],
  ['DVA', 'Drogas Vasoativas', 'aval', 'Remédios na veia que mexem na pressão e na força do coração (vasopressores e inotrópicos).', 'Dose alta ou subindo = cautela/contraindicação relativa para mobilizar fora do leito.'],
  ['Vasopressor', '', 'aval', 'Droga que contrai os vasos para subir a pressão.', 'Ex.: noradrenalina, vasopressina, adrenalina.'],
  ['Inotrópico', '', 'aval', 'Droga que aumenta a força de contração do coração.', 'Ex.: dobutamina. Usado no choque cardiogênico.'],
  ['NA', 'Noradrenalina', 'aval', 'Principal vasopressor: fecha os vasos e sobe a PA.', '1ª linha no choque séptico.'],
  ['Dobutamina', '', 'aval', 'Inotrópico: faz o coração bater mais forte.', 'Choque cardiogênico (bomba fraca).'],
  ['Vasopressina', '', 'aval', 'Vasopressor que se soma à noradrenalina quando ela sozinha não basta.', 'Associação no choque séptico refratário.'],
  ['Lactato', '', 'exames', 'Substância produzida quando a célula trabalha sem oxigênio suficiente.', 'Lactato > 2 mmol/L = hipoperfusão. Marcador de choque e de resposta ao tratamento.'],
  ['Perfusão', '', 'aval', 'Chegada de sangue (e oxigênio) aos tecidos.', 'Avalie: TEC (tempo de enchimento capilar), pele, diurese, consciência, lactato.'],
  ['TEC', 'Tempo de Enchimento Capilar', 'aval', 'Tempo para a cor voltar à unha/pele depois de apertar.', 'Normal < 3 s. Aumentado = má perfusão.'],
  ['Diurese', '', 'aval', 'Quantidade de urina produzida.', 'Oligúria (< 0,5 mL/kg/h) é sinal de má perfusão renal.'],
  ['GCS / Glasgow', 'Escala de Coma de Glasgow', 'aval', 'Escala de 3 a 15 que mede o nível de consciência: abertura ocular, resposta verbal e resposta motora.', 'Glasgow < 8 (ou ≤ 8) = indicação de IOT para proteger a via aérea. 15 = normal.'],
  ['RASS', 'Richmond Agitation-Sedation Scale', 'aval', 'Escala de sedação/agitação de −5 (não acorda) a +4 (combativo). 0 = alerta e calmo.', 'Alvo habitual: 0 a −2 (sedação leve). Base para decidir mobilizar e fazer o CAM-ICU.'],
  ['CAM-ICU', 'Confusion Assessment Method for the ICU', 'aval', 'Teste rápido à beira do leito para detectar delirium.', 'Só aplica se RASS ≥ −3. Delirium aumenta tempo de VM e mortalidade.'],
  ['Delirium', '', 'aval', 'Confusão mental aguda e flutuante, com desatenção.', 'Muito comum na UTI. Mobilização precoce ajuda a prevenir.'],
  ['Sedação', '', 'aval', 'Remédios para deixar o paciente calmo/dormindo (ex.: propofol, midazolam).', 'Sedação profunda atrapalha desmame e mobilização: preferir sedação leve.'],
  ['MRC', 'Medical Research Council (escala de força)', 'aval', 'Teste de força de 6 grupos musculares de cada lado, nota 0–5 cada, total 0–60.', 'MRC < 48 = fraqueza adquirida na UTI. Precisa de paciente acordado e colaborativo.'],
  ['FAUTI', 'Fraqueza Adquirida na UTI', 'aval', 'Fraqueza muscular generalizada que aparece durante a internação na UTI.', 'Diagnóstico: MRC < 48. Fatores: imobilidade, sepse, sedação, corticoide, bloqueador neuromuscular.'],
  ['IMS', 'ICU Mobility Scale', 'aval', 'Escala de 0 a 10 do maior nível de mobilidade que o paciente alcançou.', '0 = nada (deitado passivo) até 10 = marcha independente > 5 m. Registre o MAIOR nível do dia.'],
  ['Mobilização precoce', '', 'aval', 'Tirar o paciente do leito (sentar, ficar em pé, andar) o quanto antes, com segurança.', 'Reduz fraqueza, delirium e tempo de VM. Checar critérios cardiovasculares, respiratórios e neurológicos antes.'],
  ['Sedestação', '', 'aval', 'Colocar o paciente sentado (à beira do leito ou na poltrona).', 'Passo importante da mobilização. Observe resposta da PA e FC à mudança postural.'],
  ['Ortostatismo', '', 'aval', 'Ficar em pé.', 'Pode causar hipotensão postural: monitorar PA, FC e sintomas.'],
  ['CVC', 'Cateter Venoso Central', 'aval', 'Cateter grosso numa veia central (jugular, subclávia, femoral) para drogas e medidas.', 'Atenção ao mobilizar. Femoral não impede mobilização em geral, mas exige cuidado.'],
  ['PVC', 'Pressão Venosa Central', 'aval', 'Pressão no átrio direito, medida pelo CVC.', 'Estimativa grosseira de volume; pouco usada isoladamente hoje.'],
  ['PIC', 'Pressão Intracraniana', 'aval', 'Pressão dentro do crânio.', 'Normal < 15–20 mmHg. Alta = HIC.'],
  ['HIC', 'Hipertensão Intracraniana', 'vm', 'Pressão dentro do crânio aumentada (inchaço, sangramento, tumor).', 'Na VM: PaCO₂ 35–45 e PaO₂ 80–120. CO₂ alto dilata vasos cerebrais e piora a HIC: evitar hipercapnia permissiva.'],
  ['IAM', 'Infarto Agudo do Miocárdio', 'aval', 'Morte de parte do músculo do coração porque uma artéria coronária entupiu.', 'Pode causar choque cardiogênico e EAP. Contraindica mobilização na fase aguda/instável. Meta de SpO₂ sem hiperóxia.'],
  ['IC / ICC', 'Insuficiência Cardíaca (Congestiva)', 'aval', 'Coração fraco que não bombeia direito, fazendo líquido acumular (pulmão, pernas).', 'Descompensada pode dar EAP e derrame pleural. CPAP/VNI ajuda no EAP cardiogênico.'],
  ['AVC', 'Acidente Vascular Cerebral', 'aval', 'Parte do cérebro sofre por falta de sangue (isquêmico) ou por sangramento (hemorrágico).', 'Risco de rebaixamento (Glasgow) e broncoaspiração.'],
  ['TCE', 'Traumatismo Cranioencefálico', 'aval', 'Lesão no cérebro causada por trauma na cabeça.', 'Risco de HIC: controle de CO₂ e O₂ na VM.'],
  ['HAS', 'Hipertensão Arterial Sistêmica', 'aval', 'Pressão alta crônica.', 'Comorbidade comum.'],
  ['HDA', 'Hemorragia Digestiva Alta', 'vni', 'Sangramento no esôfago, estômago ou duodeno.', 'Contraindicação à VNI (risco de aspiração).'],
  ['RCP', 'Ressuscitação Cardiopulmonar', 'vni', 'Manobras de compressão torácica e ventilação na parada cardíaca.', 'PCR = indicação de IOT, contraindicação absoluta à VNI.'],
  ['PCR', 'Parada Cardiorrespiratória (ou Proteína C Reativa, no laboratório)', 'aval', 'Parada: coração e respiração param. No laboratório, PCR é um marcador de inflamação/infecção.', 'Leia pelo contexto: "PCR alta" no exame = inflamação; "PCR" na VNI = parada.'],
  ['Comorbidade', '', 'aval', 'Doença que o paciente já tinha antes (HAS, diabetes, DPOC...).', 'Pesa na gravidade e no prognóstico.'],

  /* ---------------- Exames complementares ---------------- */
  ['Gasometria arterial', '', 'exames', 'Exame de sangue da artéria que mostra pH, O₂, CO₂ e bicarbonato.', 'Leia em passos: pH → PaCO₂ → HCO₃⁻ → quem explica o pH → compensação → oxigenação.'],
  ['pH', 'Potencial hidrogeniônico', 'exames', 'Mede se o sangue está ácido ou alcalino.', 'Normal 7,35–7,45. < 7,35 = acidose; > 7,45 = alcalose.'],
  ['PaO₂', 'Pressão parcial arterial de O₂', 'exames', 'Quanto oxigênio está dissolvido no sangue arterial.', 'Normal 80–100 mmHg. < 60 = hipoxemia que define IRpA hipoxêmica.'],
  ['PaCO₂', 'Pressão parcial arterial de CO₂', 'exames', 'Quanto gás carbônico tem no sangue. É o lado RESPIRATÓRIO da gaso.', 'Normal 35–45 mmHg. Alto = hipoventilação (acidose respiratória). Baixo = hiperventilação.'],
  ['HCO₃⁻', 'Bicarbonato', 'exames', 'A "base" do sangue que neutraliza ácido. É o lado METABÓLICO da gaso.', 'Normal 22–26 mEq/L. Baixo = acidose metabólica; alto = alcalose metabólica (ou compensação de DPOC).'],
  ['BE', 'Base Excess (excesso de base)', 'exames', 'Quanto de base sobra ou falta no sangue (componente metabólico).', 'Normal −2 a +2. Negativo = acidose metabólica.'],
  ['SpO₂', 'Saturação periférica de O₂', 'o2', 'Porcentagem da hemoglobina carregando O₂, medida pelo oxímetro no dedo.', 'Alvo 92–96% na maioria; 88–92% no retentor de CO₂ (DPOC). > 96% = reduzir O₂.'],
  ['SaO₂', 'Saturação arterial de O₂', 'exames', 'A mesma ideia da SpO₂, mas medida na gasometria (sangue arterial).', 'É a medida "padrão-ouro" da saturação.'],
  ['Acidose respiratória', '', 'exames', 'pH baixo porque o CO₂ subiu (o paciente está ventilando pouco).', 'pH < 7,35 + PaCO₂ > 45. Ex.: DPOC exacerbado, sedação excessiva, fadiga. Trata-se aumentando a ventilação (VNI/VM).'],
  ['Alcalose respiratória', '', 'exames', 'pH alto porque o CO₂ caiu (o paciente está respirando demais).', 'pH > 7,45 + PaCO₂ < 35. Ex.: ansiedade, dor, hipoxemia, VM com FR/VC alto demais.'],
  ['Acidose metabólica', '', 'exames', 'pH baixo porque o bicarbonato caiu (sobrou ácido no corpo).', 'pH < 7,35 + HCO₃⁻ < 22. Ex.: choque/lactato, cetoacidose, insuficiência renal. O corpo compensa respirando rápido.'],
  ['Alcalose metabólica', '', 'exames', 'pH alto porque o bicarbonato subiu.', 'pH > 7,45 + HCO₃⁻ > 26. Ex.: vômitos, diuréticos.'],
  ['Compensação', '', 'exames', 'Quando o outro sistema tenta corrigir o pH (pulmão compensa o metabólico; rim compensa o respiratório).', 'Compensado: pH normal com PaCO₂ e HCO₃⁻ alterados no MESMO sentido. A compensação nunca passa do ponto.'],
  ['Distúrbio misto', '', 'exames', 'Dois distúrbios ao mesmo tempo (ex.: acidose respiratória + metabólica).', 'Pista: PaCO₂ e HCO₃⁻ alterados em sentidos opostos, empurrando o pH para o mesmo lado.'],
  ['RX', 'Radiografia (raio X) de tórax', 'exames', 'Imagem do tórax para ver pulmão, coração, pleura, tubos e cateteres.', 'Branco = denso (líquido, osso, consolidação). Preto = ar. Sempre compare com um RX normal.'],
  ['TC', 'Tomografia Computadorizada', 'exames', 'Exame de imagem em "fatias", muito mais detalhado que o RX.', 'Na SDRA mostra consolidações e vidro fosco em regiões dependentes (costas).'],
  ['Consolidação', '', 'exames', 'Área do pulmão em que o ar foi trocado por líquido/pus: fica branca no RX.', 'Típica de pneumonia bacteriana, com broncograma aéreo.'],
  ['Broncograma aéreo', '', 'exames', 'Brônquios cheios de ar aparecendo pretos dentro de uma área branca (consolidada).', 'Sinal clássico de consolidação/pneumonia.'],
  ['Vidro fosco', '', 'exames', 'Pulmão "acinzentado", meio opaco, mas ainda dá para ver os vasos.', 'Pneumonia viral, COVID, SDRA inicial.'],
  ['Hipertransparência', '', 'exames', 'Área mais preta que o normal no RX (excesso de ar).', 'Pneumotórax (sem trama vascular) ou DPOC/enfisema (hiperinsuflação).'],
  ['Hiperinsuflação', '', 'exames', 'Pulmão com ar preso demais, aumentado.', 'DPOC: cúpulas retificadas, espaços intercostais largos. Na VM, risco de auto-PEEP.'],
  ['Atelectasia', '', 'exames', 'Colabamento (fechamento) de uma parte do pulmão: os alvéolos murcham.', 'RX: opacidade que PUXA as estruturas para o mesmo lado. Causas: secreção, hipoventilação. Fisioterapia reexpande.'],
  ['Derrame pleural', '', 'exames', 'Líquido acumulado entre o pulmão e a parede do tórax (espaço pleural).', 'RX: base branca e seio costofrênico apagado (menisco). EMPURRA estruturas para o lado oposto se grande.'],
  ['Pneumotórax (PNX)', '', 'exames', 'Ar no espaço pleural, fazendo o pulmão colabar.', 'RX: área preta sem trama vascular + linha pleural. Hipertensivo = choque obstrutivo. PNX não drenado contraindica VNI.'],
  ['Pneumonia (PNM)', '', 'exames', 'Infecção do pulmão que enche os alvéolos de secreção.', 'Bacteriana: consolidação lobar. Viral: vidro fosco difuso. Aspirativa: bases, mais à direita.'],
  ['Pneumonia aspirativa', '', 'exames', 'Pneumonia causada por entrada de conteúdo da boca/estômago no pulmão (broncoaspiração).', 'Aparece nas regiões dependentes (bases, mais à direita). Risco: rebaixamento, disfagia.'],
  ['PAV', 'Pneumonia Associada à Ventilação mecânica', 'vm', 'Pneumonia que aparece depois de 48 h de intubação.', 'Prevenção: cabeceira 30–45°, cuff 20–30 cmH₂O, higiene oral, despertar diário, desmame precoce.'],
  ['EAP', 'Edema Agudo de Pulmão', 'exames', 'Pulmão "alagado" de líquido de repente, geralmente porque o coração falhou.', 'RX: "asa de borboleta" peri-hilar + cardiomegalia. Tratamento ventilatório: CPAP ~10 cmH₂O ou VNI.'],
  ['Cardiomegalia', '', 'exames', 'Coração aumentado no RX.', 'Índice cardiotorácico > 0,5. Sugere IC.'],
  ['TB', 'Tuberculose', 'exames', 'Infecção pulmonar pelo bacilo de Koch.', 'RX: opacidades e cavitações nos ápices (lobos superiores).'],
  ['TEP', 'Tromboembolismo Pulmonar', 'exames', 'Coágulo (trombo) que entope uma artéria do pulmão.', 'Causa espaço morto (ventila mas não perfunde) e pode dar choque obstrutivo. RX muitas vezes normal.'],
  ['Hb', 'Hemoglobina', 'exames', 'Proteína das hemácias que carrega o oxigênio.', 'Baixa (anemia) reduz a oferta de O₂ mesmo com SpO₂ boa. Hb < 7 costuma pedir cautela na mobilização.'],
  ['Leucócitos', '', 'exames', 'Células de defesa no sangue.', 'Altos (leucocitose) sugerem infecção/inflamação.'],
  ['Plaquetas', '', 'exames', 'Células que ajudam a coagular.', 'Muito baixas (plaquetopenia) = risco de sangramento: cuidado com técnicas agressivas.'],
  ['Eletrólitos', 'Na⁺, K⁺, Ca²⁺, Mg²⁺', 'exames', 'Sais minerais do sangue que controlam músculo, nervo e coração.', 'Potássio alterado pode dar arritmia; cuidado ao mobilizar.'],
  ['Ureia / Creatinina', '', 'exames', 'Exames que mostram como o rim está funcionando.', 'Subindo = lesão renal.'],
  ['Troponina', '', 'exames', 'Marcador de lesão do músculo cardíaco.', 'Elevada em IAM.'],

  /* ---------------- Oxigenioterapia ---------------- */
  ['Hipoxemia', '', 'o2', 'Pouco oxigênio NO SANGUE.', 'PaO₂ < 80 (leve 60–79, moderada 40–59, grave < 40) ou SpO₂ < 90%. É do sangue; hipóxia é do tecido.'],
  ['Hipóxia', '', 'o2', 'Pouco oxigênio NOS TECIDOS (nas células).', 'Pode existir sem hipoxemia (ex.: anemia, choque, intoxicação por CO).'],
  ['Hiperóxia', '', 'o2', 'Oxigênio demais no sangue.', 'PaO₂ > 120 (tóxico > 200–300). Faz mal: radicais livres, vasoconstrição, atelectasia de absorção. O₂ é remédio.'],
  ['Hipercapnia', '', 'o2', 'CO₂ alto no sangue.', 'PaCO₂ > 45. Causa: hipoventilação. Pode dar sonolência (carbonarcose).'],
  ['Hipocapnia', '', 'o2', 'CO₂ baixo no sangue.', 'PaCO₂ < 35. Causa: hiperventilação.'],
  ['Retentor de CO₂', '', 'o2', 'Paciente que acumula CO₂ cronicamente (ex.: DPOC grave).', 'Alvo de SpO₂ 88–92%. O₂ demais pode piorar a hipercapnia.'],
  ['FiO₂', 'Fração inspirada de O₂', 'o2', 'A porcentagem de oxigênio no ar que a pessoa respira.', 'Ar ambiente = 21% (0,21). Na VM: a menor possível, ≤ 0,6.'],
  ['P/F', 'Relação PaO₂ / FiO₂', 'o2', 'Mostra se o pulmão está oxigenando bem para o tanto de O₂ que recebe.', 'Normal > 400. SDRA: leve 201–300, moderada 101–200, grave ≤ 100. Use FiO₂ em decimal (0,5).'],
  ['S/F', 'Relação SpO₂ / FiO₂', 'o2', 'Alternativa à P/F usando o oxímetro, sem gasometria.', 'Só vale se SpO₂ ≤ 97%. Leve 236–315, moderada 149–235, grave ≤ 148.'],
  ['V/Q', 'Relação ventilação / perfusão', 'o2', 'O equilíbrio entre o ar que chega ao alvéolo (V) e o sangue que passa por ele (Q).', 'Alteração V/Q é a causa mais comum de hipoxemia e melhora com O₂.'],
  ['Shunt', '', 'o2', 'Sangue passa por alvéolos que NÃO ventilam (cheios de líquido ou colabados): V/Q = 0.', 'NÃO melhora só com O₂: precisa recrutar (PEEP, CPAP, prona). Ex.: pneumonia extensa, SDRA, atelectasia.'],
  ['Espaço morto', '', 'o2', 'Ar que chega a alvéolos SEM sangue passando: ventila mas não troca gás (V/Q alto).', 'Ex.: TEP. Aumenta o CO₂.'],
  ['Hipoventilação', '', 'o2', 'Ventilar pouco: entra e sai pouco ar por minuto.', 'Sobe o CO₂ (e cai o O₂). Ex.: sedação, doença neuromuscular, fadiga.'],
  ['DO₂', 'Oferta (delivery) de O₂', 'o2', 'Quanto oxigênio chega aos tecidos por minuto.', 'DO₂ = DC × CaO₂. Depende de coração, Hb e saturação.'],
  ['VO₂', 'Consumo de O₂', 'o2', 'Quanto oxigênio os tecidos usam por minuto.', 'Aumenta com febre, agitação, exercício.'],
  ['CaO₂', 'Conteúdo arterial de O₂', 'o2', 'Total de O₂ no sangue arterial (preso na Hb + dissolvido).', 'Depende principalmente da Hb e da SaO₂.'],
  ['PiO₂ / PAO₂', 'Pressão inspirada / alveolar de O₂', 'o2', 'Pressão de O₂ no ar inspirado e dentro do alvéolo.', 'Cai em altitude. Gradiente alvéolo-arterial alto = problema no pulmão.'],
  ['Oxigenioterapia', '', 'o2', 'Uso de O₂ suplementar como tratamento.', 'O₂ é fármaco: indicação, dose, alvo (SpO₂) e desmame. Prescreva meta, não litros. Reavaliar em 20–30 min.'],
  ['Baixo fluxo', '', 'o2', 'Dispositivo que fornece menos fluxo que o paciente puxa; ele completa com ar ambiente.', 'FiO₂ varia com a respiração do paciente. Ex.: cateter nasal, máscara simples.'],
  ['Alto fluxo', '', 'o2', 'Dispositivo que fornece todo (ou mais que) o fluxo que o paciente precisa.', 'FiO₂ fixa e precisa. Ex.: Venturi, CNAF.'],
  ['CN', 'Cateter Nasal', 'o2', 'Tubinho com pontas nas narinas que leva O₂.', '1–6 L/min, FiO₂ ~24–40%. Cada litro ≈ +4%.'],
  ['Máscara simples', '', 'o2', 'Máscara sobre nariz e boca, sem reservatório.', '5–10 L/min, FiO₂ ~35–50%. Nunca < 5 L/min (reinala CO₂).'],
  ['Venturi', 'Máscara de Venturi', 'o2', 'Máscara com válvulas coloridas que misturam O₂ e ar numa FiO₂ fixa.', 'FiO₂ 24–50% precisa. Ótima no DPOC (controle fino). Cada cor = um fluxo e uma FiO₂.'],
  ['Máscara com reservatório', 'Máscara não reinalante', 'o2', 'Máscara com bolsa que acumula O₂ puro.', '10–15 L/min, FiO₂ ~60–90%. A bolsa deve ficar cheia. Ponte para algo mais definitivo.'],
  ['CNAF', 'Cânula Nasal de Alto Fluxo', 'o2', 'Cânula nasal que manda muito fluxo de ar aquecido e umidificado, com FiO₂ controlada.', '30–60 L/min, FiO₂ 21–100%, 34–37 °C. Gera PEEP ~3–5 cmH₂O (boca fechada) e lava o espaço morto.'],
  ['ROX', 'Índice ROX', 'o2', 'Índice para prever se a CNAF vai dar certo: (SpO₂/FiO₂) / FR.', 'ROX ≥ 4,88 = boa chance de sucesso. Baixo = risco de IOT.'],
  ['Umidificação', '', 'o2', 'Acrescentar vapor de água ao gás inspirado.', 'Gás seco resseca a via aérea e espessa secreção. Necessária em fluxos altos.'],
  ['HME / HMEF', 'Heat and Moisture Exchanger (Filter)', 'vm', 'Filtro "nariz artificial" que aquece e umidifica o ar no circuito do ventilador.', 'Aumenta espaço morto e resistência. HMEF também filtra vírus/bactérias.'],
  ['Atelectasia de absorção', '', 'o2', 'Colabamento de alvéolos porque o O₂ alto é absorvido e o nitrogênio "de sustentação" some.', 'Um dos malefícios da FiO₂ alta.'],

  /* ---------------- VNI e IRpA ---------------- */
  ['IRpA', 'Insuficiência Respiratória Aguda', 'vni', 'Quando o sistema respiratório de repente não consegue oxigenar e/ou tirar CO₂ do sangue.', 'Tipo 1 (hipoxêmica): PaO₂ < 60. Tipo 2 (hipercápnica): PaCO₂ > 45 com pH < 7,35.'],
  ['IRpA hipoxêmica (tipo 1)', '', 'vni', 'Falha em OXIGENAR: falta O₂ no sangue.', 'PaO₂ < 60 em ar ambiente. Ex.: pneumonia, SDRA, EAP. Problema de troca (V/Q, shunt).'],
  ['IRpA hipercápnica (tipo 2)', '', 'vni', 'Falha em VENTILAR: o CO₂ acumula.', 'PaCO₂ > 45 e pH < 7,35. Ex.: DPOC exacerbado, doença neuromuscular, sedação. Problema de "bomba".'],
  ['VNI', 'Ventilação Não Invasiva', 'vni', 'Ventilação com pressão positiva por máscara, sem tubo na traqueia.', 'Melhor evidência: DPOC exacerbado e EAP cardiogênico. É ponte, nunca atraso para a IOT.'],

function buildNav() {
  $('#nav').innerHTML = PAGES.map(p => `<button class="navbtn" data-p="${p.id}" style="--c:${p.color}"><span class="dot"></span>${p.name}</button>`).join('');
  $('#bnav').innerHTML = PAGES.map(p => `<button class="bn" data-p="${p.id}" style="--c:${p.color}"><span class="bi">${ico(p.icon, 18)}</span>${p.short}</button>`).join('');
  $$('[data-p]').forEach(b => b.onclick = () => go(b.dataset.p));
}
function go(id, opts = {}) {
  if (!PAGE[id]) id = 'home';
  current = id;
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'pg-' + id));
  $$('[data-p]').forEach(b => b.classList.toggle('active', b.dataset.p === id));
  document.documentElement.style.setProperty('--mc', PAGE[id].color);
  const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = getComputedStyle(document.body).backgroundColor;
  if (id === 'home') renderHomeProgress();
  if (id === 'flash' && opts.mod !== undefined) { fcState.mod = opts.mod; fcRebuild(); }
  if (id === 'flash') fcRender();
  if (MOD[id] && opts.sub) setSub(id, opts.sub);
  if (!opts.keepScroll) window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  history.replaceState(null, '', '#' + id);
  const nb = $(`.navbtn[data-p="${id}"]`); if (nb) nb.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function moduleProgress(mid) {
  const tops = TOPICS[mid] || [];
  const done = tops.filter((_, i) => store.get(`done:${mid}:${i}`, false)).length;
  const fr = store.get('fr', {});
  const cards = FLASH.map((f, i) => ({ f, i })).filter(x => x.f.m === mid);
  const dom = cards.filter(x => fr[x.i] === 3).length;
  const pct = Math.round(((done / Math.max(1, tops.length)) * 0.5 + (dom / Math.max(1, cards.length)) * 0.5) * 100);
  return { done, total: tops.length, dom, cards: cards.length, pct };
}

function toolHead(box, t, d, badge, scoreHtml) {
  box.innerHTML = `<div class="tool-h"><div class="ti">${badge || '?'}</div><div><h3>${t}</h3><p>${d || ''}</p></div>${scoreHtml !== undefined ? `<div class="score">${scoreHtml}</div>` : ''}</div><div class="tool-b"></div>`;
  return $('.tool-b', box);

/* ================= generic drill ================= */
function renderDrill(box, dr) {
  let order = shuffle(dr.items.map((_, i) => i)), pos = 0, hit = 0, tot = 0;
  const best = () => store.get('drill:' + dr.id, null);
  const scoreTxt = () => `<b>${hit}/${tot}</b> nesta rodada${best() !== null ? `<br>melhor: ${best()}%` : ''}`;
  const body = toolHead(box, dr.t, dr.d, dr.badge || 'Q', scoreTxt());
  const draw = () => {
    if (pos >= order.length) {
      const pct = Math.round(hit / Math.max(1, tot) * 100);
      if (best() === null || pct > best()) store.set('drill:' + dr.id, pct);
      $('.score', box).innerHTML = scoreTxt();
      body.innerHTML = `<div class="dq" style="text-align:center">Rodada concluída: <b>${hit}/${tot}</b> (${pct}%)</div><div class="row"><button class="btn">Jogar de novo</button></div>`;
      $('.btn', body).onclick = () => { order = shuffle(order); pos = 0; hit = 0; tot = 0; $('.score', box).innerHTML = scoreTxt(); draw(); };
      return;
    }
    const it = dr.items[order[pos]];
    const opts = it.o || dr.opts;
    const media = it.img ? `<img src="${imgSrc(it.img)}" alt="">` : (it.wave ? waveSVG(it.wave) : '');
    const vals = it.vals ? `<div class="vals">${Object.entries(it.vals).map(([k, v]) => `<div><small>${k}</small>${v}</div>`).join('')}</div>` : '';
    body.innerHTML = `<div class="steps"><span class="cur">${pos + 1} / ${order.length}</span></div><div class="dq">${it.q}${vals}${media}</div><div class="opts ${dr.wide || it.wide ? 'wide' : ''}">${(it.shuf ? shuffle(opts) : opts).map(o => `<button class="ob" data-o="${String(o).replace(/"/g, '&quot;')}">${o}</button>`).join('')}</div><div class="fb"></div><div class="row" style="display:none"><button class="btn">Próximo</button></div>`;
    $$('.dq img', body).forEach(im => im.onclick = () => lightbox(im.src));
    $$('.ob', body).forEach(b => b.onclick = () => {
      const ans = Array.isArray(it.a) ? it.a : [it.a];
      const ok = ans.includes(b.dataset.o);
      tot++; if (ok) hit++;
      $$('.ob', body).forEach(x => { x.disabled = true; if (ans.includes(x.dataset.o)) x.classList.add('ok'); else if (x === b) x.classList.add('bad'); else x.classList.add('dimmed'); });
      const fb = $('.fb', body); fb.className = 'fb show ' + (ok ? 'ok' : 'bad');
      fb.innerHTML = `<div class="fbt">${ok ? 'Certo' : 'Resposta: ' + ans.join(' / ')}</div>${it.e || ''}`;
      $('.row', body).style.display = 'flex';
      $('.score', box).innerHTML = scoreTxt();
      $('.row .btn', body).focus({ preventScroll: true });
    });
    $('.row .btn', body).onclick = () => { pos++; draw(); };
  };
  draw();
}

/* ================= ventilator waveforms ================= */
function waveSVG(o) {
  const mode = o.mode || 'VCV', W = 600, Hh = 78, gap = 14, T = o.T || 8, N = 480;
  const fr = o.fr || 15, cyc = 60 / fr, Ti = o.ti || 1;
  const peep = o.peep ?? 5, Pins = o.pins || 15, Fset = o.flow || 0.9;
  const tauE = o.autopeep ? 0.9 : 0.35, tauI = 0.25;
  const P = [], F = [], V = [];
  let vol = 0, vres = 0, vEnd = 0, lastSi = -1, inInsp = false;
  const starts = [];
  if (mode === 'PSV') { let t = 0.4; while (t < T) { starts.push(t); t += cyc * (0.85 + Math.random() * 0.35); } }
  else { for (let t = 0.4; t < T; t += (o.autopeep ? cyc * 0.62 : cyc)) starts.push(t); }
  for (let k = 0; k <= N; k++) {
    const t = k / N * T;
    let si = -1; for (let j = 0; j < starts.length; j++) if (t >= starts[j]) si = j;
    let p = peep, f = 0;
    if (si < 0) { f = 0; p = peep; vol = 0; }
    else {
      const tt = t - starts[si];
      if (si !== lastSi) { vres = vol; lastSi = si; }
      const tiReal = mode === 'PSV' ? 0.75 + (si % 3) * 0.12 : Ti;
      if (tt < tiReal) {
        inInsp = true;
        if (mode === 'VCV') {
          f = Fset; vol = vres + Fset * tt;
          p = peep + 6 + (tt / Ti) * (Pins - 6);
          if (o.hunger) p -= Math.sin(Math.PI * tt / Ti) * 5;
        } else {
          const rise = Math.min(1, tt / 0.12);
          p = peep + rise * (Pins - peep);
          f = (mode === 'PSV' ? 1.3 : 1.25) * Math.exp(-tt / (mode === 'PSV' ? 0.32 : tauI)) * rise;
          vol += f * (T / N);
        }
      } else {
        const te = tt - tiReal;
        if (inInsp) { vEnd = mode === 'VCV' ? vres + Fset * Ti : vol; inInsp = false; }
        const v0 = vEnd;
        f = -(v0 / tauE) * Math.exp(-te / tauE) * 0.9;
        p = peep;
        vol = Math.max(0, v0 * Math.exp(-te / tauE));
      }
      const nextS = starts[si + 1];
      if ((o.effort || mode === 'PSV') && nextS !== undefined && nextS - t < 0.15 && nextS - t > 0) p -= 2.2 * Math.sin(Math.PI * (0.15 - (nextS - t)) / 0.15);
    }
    P.push([t, p]); F.push([t, f]); V.push([t, vol]);
  }
  const panel = (pts, y0, lo, hi, col, lbl) => {
    const sx = t => 34 + t / T * (W - 44), sy = v => y0 + Hh - (v - lo) / (hi - lo) * Hh;
    const d = pts.map((q, i) => (i ? 'L' : 'M') + sx(q[0]).toFixed(1) + ' ' + sy(q[1]).toFixed(1)).join(' ');
    const zero = lo < 0 ? `<line x1="34" x2="${W - 10}" y1="${sy(0)}" y2="${sy(0)}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 3"/>` : `<line x1="34" x2="${W - 10}" y1="${y0 + Hh}" y2="${y0 + Hh}" stroke="currentColor" stroke-opacity=".25"/>`;
    return `<text x="0" y="${y0 + 12}" font-size="11" font-weight="800" fill="currentColor" opacity=".6">${lbl}</text>${zero}<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>`;
  };
  const vmax = Math.max(...V.map(v => v[1])) * 1.15 || 1, fmax = Math.max(...F.map(v => Math.abs(v[1]))) * 1.15;
  const svg = `<svg viewBox="0 0 ${W} ${Hh * 3 + gap * 3}" style="color:var(--text)">${panel(P, 4, 0, Pins + 8, '#fbbf24', 'P')}${panel(F, Hh + gap + 4, -fmax, fmax, '#60a5fa', 'Fluxo')}${panel(V, (Hh + gap) * 2 + 4, 0, vmax, '#34d399', 'Vol')}</svg>`;
  return `<div class="wave">${svg}</div>`;
}

/* ---- Gasometria guiada ---- */
const GASO_FIXED = [
  { lbl: 'Caso da aula de Exames (HIV, pós-IOT)', pH: 7.16, PaCO2: 60, HCO3: 23, BE: -1, PaO2: 58, ans: ['Acidemia', 'Acidose respiratória', 'Não compensado', 'Hipoxemia moderada (40–59)'] },
