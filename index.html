];
const HH = (hco3, pco2) => 6.1 + Math.log10(hco3 / (0.03 * pco2));
const solveP = (hco3, pH) => hco3 / (0.03 * Math.pow(10, pH - 6.1));
const solveH = (pco2, pH) => 0.03 * pco2 * Math.pow(10, pH - 6.1);
function genGaso() {
  const types = ['ar', 'ar', 'al', 'am', 'am', 'alm', 'mixA', 'mixB', 'nl'];
  for (let tries = 0; tries < 200; tries++) {
    const ty = types[Math.floor(Math.random() * types.length)];
    const comp = ['n', 'p', 't'][Math.floor(Math.random() * 3)];
    let pH, P, H;
    if (ty === 'ar') { if (comp === 'n') { H = rnd(22, 26); P = rnd(52, 75); } else if (comp === 'p') { H = rnd(28, 33); pH = rnd(7.24, 7.33); P = solveP(H, pH); } else { H = rnd(29, 35); pH = rnd(7.35, 7.39); P = solveP(H, pH); } }
    if (ty === 'al') { if (comp === 'n') { H = rnd(22, 26); pH = rnd(7.48, 7.58); P = solveP(H, pH); } else if (comp === 'p') { H = rnd(17, 21); pH = rnd(7.47, 7.53); P = solveP(H, pH); } else { H = rnd(16, 21); pH = rnd(7.41, 7.45); P = solveP(H, pH); } }
    if (ty === 'am') { if (comp === 'n') { P = rnd(36, 44); pH = rnd(7.15, 7.32); H = solveH(P, pH); } else if (comp === 'p') { P = rnd(24, 33); pH = rnd(7.2, 7.33); H = solveH(P, pH); } else { P = rnd(25, 33); pH = rnd(7.35, 7.39); H = solveH(P, pH); } }
    if (ty === 'alm') { if (comp === 'n') { P = rnd(36, 44); pH = rnd(7.48, 7.56); H = solveH(P, pH); } else if (comp === 'p') { P = rnd(47, 55); pH = rnd(7.47, 7.52); H = solveH(P, pH); } else { P = rnd(46, 52); pH = rnd(7.41, 7.45); H = solveH(P, pH); } }
    if (ty === 'mixA') { P = rnd(50, 65); H = rnd(15, 20); }
    if (ty === 'mixB') { P = rnd(25, 32); H = rnd(29, 35); }
    if (ty === 'nl') { P = rnd(36, 44); H = rnd(23, 25.5); }
    P = Math.round(P); H = Math.round(H); pH = r2(HH(H, P));
    // validate
    const acid = pH < 7.35, alk = pH > 7.45;
    const Pab = P > 45 ? 'hi' : P < 35 ? 'lo' : 'n', Hab = H > 26 ? 'hi' : H < 22 ? 'lo' : 'n';
    let prim, cp;
    if (ty === 'nl') { if (acid || alk || Pab !== 'n' || Hab !== 'n') continue; prim = 'Sem distúrbio'; cp = 'Não se aplica'; }
    else if (ty === 'mixA') { if (!acid || Pab !== 'hi' || Hab !== 'lo') continue; prim = 'Distúrbio misto'; cp = 'Não se aplica'; }
    else if (ty === 'mixB') { if (!alk || Pab !== 'lo' || Hab !== 'hi') continue; prim = 'Distúrbio misto'; cp = 'Não se aplica'; }
    else {
      const want = { ar: ['acid', 'hi', null], al: ['alk', 'lo', null], am: ['acid', null, 'lo'], alm: ['alk', null, 'hi'] }[ty];
      if (comp === 't') { if (acid || alk) continue; if (ty === 'ar' || ty === 'am') { if (pH >= 7.40) continue; } else if (pH <= 7.40) continue; }
      else { if (want[0] === 'acid' && !acid) continue; if (want[0] === 'alk' && !alk) continue; }
      if (want[1] && Pab !== want[1]) continue; if (want[2] && Hab !== want[2]) continue;
      if (ty === 'ar' || ty === 'al') { const exp = ty === 'ar' ? 'hi' : 'lo'; if (comp === 'n' && Hab !== 'n') continue; if (comp !== 'n' && Hab !== exp) continue; }
      if (ty === 'am' || ty === 'alm') { const exp = ty === 'am' ? 'lo' : 'hi'; if (comp === 'n' && Pab !== 'n') continue; if (comp !== 'n' && Pab !== exp) continue; }
      prim = { ar: 'Acidose respiratória', al: 'Alcalose respiratória', am: 'Acidose metabólica', alm: 'Alcalose metabólica' }[ty];
      cp = { n: 'Não compensado', p: 'Parcialmente compensado', t: 'Totalmente compensado' }[comp];
    }
    const oxs = [['Normal (80–100)', rnd(82, 99)], ['Hipoxemia leve (60–79)', rnd(60, 79)], ['Hipoxemia moderada (40–59)', rnd(42, 59)], ['Hipoxemia grave (< 40)', rnd(30, 39)], ['Hiperóxia (> 120)', rnd(140, 280)]];
    const ox = oxs[Math.floor(Math.random() * oxs.length)];
    const BE = Math.round(0.93 * (H - 24.4 + 14.8 * (pH - 7.4)));
    const ph1 = pH < 7.35 ? 'Acidemia' : pH > 7.45 ? 'Alcalemia' : 'pH normal';
    return { lbl: 'Caso gerado', pH, PaCO2: P, HCO3: H, BE, PaO2: Math.round(ox[1]), ans: [ph1, prim, cp, ox[0]] };
  }
  return GASO_FIXED[0];
}
TOOLS.gaso = box => {
  let c, step, hit = 0, tot = 0, fixedIdx = 0;
  const body = toolHead(box, 'Trainer de gasometria guiado', 'Quatro passos, como a professora ensina: pH, distúrbio primário, compensação e oxigenação. Casos infinitos gerados com valores fisiológicos coerentes.', 'pH', `<b>0/0</b>`);
  const STEPS = [
    { n: 'pH', q: 'Passo 1 · Como está o pH?', o: ['Acidemia', 'pH normal', 'Alcalemia'] },
    { n: 'Primário', q: 'Passo 2 · Qual o distúrbio primário? (olhe PaCO₂ e HCO₃⁻)', o: ['Acidose respiratória', 'Alcalose respiratória', 'Acidose metabólica', 'Alcalose metabólica', 'Distúrbio misto', 'Sem distúrbio'] },
    { n: 'Compensação', q: 'Passo 3 · Há compensação?', o: ['Não compensado', 'Parcialmente compensado', 'Totalmente compensado', 'Não se aplica'] },
    { n: 'Oxigenação', q: 'Passo 4 · Como está a oxigenação (PaO₂, classificação da aula em ar ambiente)?', o: ['Normal (80–100)', 'Hipoxemia leve (60–79)', 'Hipoxemia moderada (40–59)', 'Hipoxemia grave (< 40)', 'Hiperóxia (> 120)'] }
  ];
  const why = (i) => {
    const pH = c.pH, P = c.PaCO2, H = c.HCO3;
    if (i === 0) return `pH ${pH.toFixed(2)}: referência 7,35–7,45. ${pH < 7.35 ? 'Abaixo → acidemia.' : pH > 7.45 ? 'Acima → alcalemia.' : 'Dentro da faixa: pode ser normal OU compensado. Olhe PaCO₂ e HCO₃⁻.'}`;
    if (i === 1) return `PaCO₂ ${P} (35–45) ${P > 45 ? '↑ acidifica' : P < 35 ? '↓ alcaliniza' : 'normal'} · HCO₃⁻ ${H} (22–26) ${H > 26 ? '↑ alcaliniza' : H < 22 ? '↓ acidifica' : 'normal'}. ${c.ans[1] === 'Distúrbio misto' ? 'Os dois componentes empurram o pH para o MESMO lado: distúrbio misto.' : c.ans[1] === 'Sem distúrbio' ? 'Tudo na faixa.' : 'O primário é o componente que explica o lado para onde o pH foi (ou está pendendo).'}`;
    if (i === 2) return c.ans[2] === 'Não compensado' ? 'O outro sistema ainda está normal: sem compensação.' : c.ans[2] === 'Parcialmente compensado' ? 'O sistema oposto já se moveu no sentido contrário, mas o pH continua alterado: compensação parcial.' : c.ans[2] === 'Totalmente compensado' ? 'pH voltou à faixa normal com PaCO₂ e HCO₃⁻ alterados: compensação total.' : 'Distúrbio misto ou normal: não se fala em compensação.';
    return `PaO₂ ${c.PaO2} mmHg. Leve 60–79, moderada 40–59, grave < 40 (em FiO₂ 21%). Hiperóxia > 120; > 200–300 pode ser tóxica.`;
  };
  const newCase = fixed => { c = fixed ? GASO_FIXED[fixedIdx++ % GASO_FIXED.length] : genGaso(); step = 0; draw(); };
  const draw = () => {
    const vals = { pH: c.pH.toFixed(2).replace('.', ','), 'PaCO₂': c.PaCO2, 'HCO₃⁻': c.HCO3, BE: (c.BE > 0 ? '+' : '') + c.BE, 'PaO₂': c.PaO2 };
    if (step >= 4) {
      body.innerHTML = `<div class="dq">${c.lbl}<div class="vals">${Object.entries(vals).map(([k, v]) => `<div><small>${k}</small>${v}</div>`).join('')}</div></div><div class="interp"><b>Laudo:</b> ${c.ans[1] === 'Sem distúrbio' ? 'gasometria sem distúrbio ácido-básico' : c.ans[1] + (c.ans[2] !== 'Não se aplica' ? ', ' + c.ans[2].toLowerCase() : '')}, com ${c.ans[3].split(' (')[0].toLowerCase()}.</div><div class="row"><button class="btn" data-n>Novo caso</button><button class="btn sec" data-f>Caso da aula</button></div>`;
      $('[data-n]', body).onclick = () => newCase(); $('[data-f]', body).onclick = () => newCase(true);
      return;
    }
    const S = STEPS[step];
    body.innerHTML = `<div class="steps">${STEPS.map((s, i) => `<span class="${i < step ? 'done' : i === step ? 'cur' : ''}">${i + 1}. ${s.n}</span>`).join('')}</div>
      <div class="dq">${c.lbl}<div class="vals">${Object.entries(vals).map(([k, v]) => `<div><small>${k}</small>${v}</div>`).join('')}</div></div>
      <div class="ask" style="font-weight:700;margin-bottom:8px">${S.q}</div>
      <div class="opts">${S.o.map(o => `<button class="ob" data-o="${o}">${o}</button>`).join('')}</div><div class="fb"></div>
      <div class="row" style="display:none"><button class="btn">Próximo passo</button></div>
      <div class="row"><button class="btn sm sec" data-n>Pular para novo caso</button><button class="btn sm sec" data-f>Casos da aula</button></div>`;
    $('[data-n]', body).onclick = () => newCase(); $('[data-f]', body).onclick = () => newCase(true);
    $$('.ob', body).forEach(b => b.onclick = () => {
      const ok = b.dataset.o === c.ans[step]; tot++; if (ok) hit++;
      $$('.ob', body).forEach(x => { x.disabled = true; if (x.dataset.o === c.ans[step]) x.classList.add('ok'); else if (x === b) x.classList.add('bad'); else x.classList.add('dimmed'); });
      const fb = $('.fb', body); fb.className = 'fb show ' + (ok ? 'ok' : 'bad'); fb.innerHTML = `<div class="fbt">${ok ? 'Certo' : 'Resposta: ' + c.ans[step]}</div>${why(step)}`;
      $('.score', box).innerHTML = `<b>${hit}/${tot}</b> passos`;
      const nx = $$('.row', body)[0]; nx.style.display = 'flex'; $('.btn', nx).onclick = () => { step++; draw(); };
    });
  };
  newCase(true);
};

TOOLS.gasoAn = box => {

  b.innerHTML = `<div class="fields">

  const run = () => {
    const pH = +$('#ga_ph', b).value, P = +$('#ga_p', b).value, H = +$('#ga_h', b).value, O = +$('#ga_o', b).value, Fi = (+$('#ga_f', b).value || 21) / 100;
    if (!pH || !P || !H) return;
    const ph = pH < 7.35 ? 'Acidemia' : pH > 7.45 ? 'Alcalemia' : 'Normal';
    const Pd = P > 45 ? 'acid' : P < 35 ? 'alk' : 'n', Hd = H < 22 ? 'acid' : H > 26 ? 'alk' : 'n';
    let prim = '', comp = '';
    if (Pd === 'n' && Hd === 'n') { prim = ph === 'Normal' ? 'Sem distúrbio ácido-básico' : 'Valores limítrofes, confira'; }
    else if (Pd !== 'n' && Pd === Hd) { prim = `Distúrbio misto (${Pd === 'acid' ? 'acidose respiratória + metabólica' : 'alcalose respiratória + metabólica'})`; }
    else {
      const side = ph === 'Acidemia' ? 'acid' : ph === 'Alcalemia' ? 'alk' : (pH < 7.40 ? 'acid' : 'alk');
      if (Pd === side) { prim = side === 'acid' ? 'Acidose respiratória' : 'Alcalose respiratória'; comp = Hd === 'n' ? 'não compensada' : (ph === 'Normal' ? 'totalmente compensada' : 'parcialmente compensada'); }
      else if (Hd === side) { prim = side === 'acid' ? 'Acidose metabólica' : 'Alcalose metabólica'; comp = Pd === 'n' ? 'não compensada' : (ph === 'Normal' ? 'totalmente compensada' : 'parcialmente compensada'); }
      else prim = 'Padrão incoerente: revise os valores';
    }
    const pf = O / Fi;
    const oxc = Fi <= 0.21 ? (O > 120 ? ['bad', 'Hiperóxia'] : O >= 80 ? ['ok', 'Normal'] : O >= 60 ? ['warn', 'Hipoxemia leve'] : O >= 40 ? ['bad', 'Hipoxemia moderada'] : ['bad', 'Hipoxemia grave']) : (O > 120 ? ['bad', 'Hiperóxia: reduzir FiO₂'] : pf > 300 ? ['ok', 'P/F > 300'] : pf > 200 ? ['warn', 'P/F 201–300 (leve)'] : pf > 100 ? ['bad', 'P/F 101–200 (moderada)'] : ['bad', 'P/F ≤ 100 (grave)']);
    $('#ga_r', b).innerHTML = `<div class="res ${ph === 'Normal' ? 'ok' : 'bad'}"><small>pH</small><b>${pH.toFixed(2)}</b><em>${ph}</em></div><div class="res ${Pd === 'n' ? 'ok' : 'warn'}"><small>PaCO₂</small><b>${P}</b><em>${Pd === 'n' ? 'normal' : P > 45 ? 'alta: retenção' : 'baixa: hiperventilação'}</em></div><div class="res ${Hd === 'n' ? 'ok' : 'warn'}"><small>HCO₃⁻</small><b>${H}</b><em>${Hd === 'n' ? 'normal' : H > 26 ? 'alto: excesso de base' : 'baixo: perda de base'}</em></div><div class="res ${oxc[0]}"><small>P/F</small><b>${Math.round(pf)}</b><em>${oxc[1]}</em></div>`;
    $('#ga_i', b).innerHTML = `<b>Conclusão:</b> ${prim}${comp ? ', ' + comp : ''}. ${Fi <= 0.21 ? 'Oxigenação em ar ambiente: ' + oxc[1].toLowerCase() + '.' : `Em FiO₂ ${Math.round(Fi * 100)}%, use a relação P/F: ${Math.round(pf)}.`}${P > 45 && pH < 7.35 ? ' <br><b>Leitura clínica:</b> falha de ventilação (bomba): o paciente precisa de ventilação (PS/IPAP, ↑ volume-minuto), não só de O₂.' : ''}`;
  };
  $$('input', b).forEach(i => i.oninput = run); run();
};

  b.innerHTML = `<div class="fields"><div class="fld"><label>Sexo</label><select id="pb_s"><option value="m">Masculino</option><option value="f">Feminino</option></select></div><div class="fld"><label>Altura (cm)</label><input type="number" id="pb_h" value="170"></div><div class="fld"><label>Peso real (kg)</label><input type="number" id="pb_r" value="95"></div><div class="fld"><label>VC atual (mL)</label><input type="number" id="pb_v" value="450"></div></div><div class="formula" id="pb_f"></div><div class="result" id="pb_o"></div>`;
  const run = () => {
    const m = $('#pb_s', b).value === 'm', H = +$('#pb_h', b).value, R = +$('#pb_r', b).value, V = +$('#pb_v', b).value;
    const pbw = (m ? 50 : 45.5) + 0.91 * (H - 152.4);
    $('#pb_f', b).textContent = `${m ? '50' : '45,5'} + 0,91 × (${H} − 152,4) = ${r1(pbw)} kg`;
    const mlkg = V / pbw;
    const c = mlkg < 6 ? ['warn', 'Abaixo de 6 mL/kg'] : mlkg <= 8 ? ['ok', 'Dentro de 6–8 mL/kg'] : ['bad', 'Acima de 8: risco de volutrauma'];
    $('#pb_o', b).innerHTML = `<div class="res"><small>Peso predito</small><b>${r1(pbw)} kg</b><em style="color:var(--muted)">peso real ${R} kg não entra</em></div><div class="res"><small>VC 6 mL/kg</small><b>${Math.round(pbw * 6)} mL</b></div><div class="res"><small>VC 8 mL/kg</small><b>${Math.round(pbw * 8)} mL</b></div>${V ? `<div class="res ${c[0]}"><small>VC atual</small><b>${r1(mlkg)} mL/kg</b><em>${c[1]}</em></div>` : ''}`;
  };
  $$('input,select', b).forEach(i => i.oninput = run); run();
};

/* ---- mecânica ---- */
TOOLS.mech = box => {
  const b = toolHead(box, 'Calculadora de mecânica respiratória', 'VCV, fluxo quadrado, pausa inspiratória e paciente passivo. "Pico subiu? Olhe o platô."', 'ΔP');
  b.innerHTML = `<div class="fields"><div class="fld"><label>VC (mL)</label><input type="number" id="me_v" value="450"></div><div class="fld"><label>P pico</label><input type="number" id="me_pk" value="32"></div><div class="fld"><label>P platô</label><input type="number" id="me_pl" value="24"></div><div class="fld"><label>PEEP ajustada</label><input type="number" id="me_pe" value="10"></div><div class="fld"><label>Fluxo (L/min)</label><input type="number" id="me_f" value="60"></div><div class="fld"><label>PEEP total (pausa exp.)</label><input type="number" id="me_pt" value="10"></div></div><div class="result" id="me_r"></div><div class="interp" id="me_i"></div><div class="row"><button class="btn sm sec" id="me_ex">Caso integrador da aula</button><button class="btn sm sec" id="me_res">Exemplo resistivo</button><button class="btn sm sec" id="me_el">Exemplo elástico</button></div>`;
  const run = () => {
    const V = +$('#me_v', b).value, Pk = +$('#me_pk', b).value, Pl = +$('#me_pl', b).value, PE = +$('#me_pe', b).value, Fl = +$('#me_f', b).value / 60, PT = +$('#me_pt', b).value || PE;
    const dp = Pl - PE, cst = V / dp, cdy = V / (Pk - PE), rva = (Pk - Pl) / Fl, ap = PT - PE;
    const R = [
      ['Driving pressure (ΔP)', dp + ' cmH₂O', dp < 15 ? 'ok' : 'bad', dp < 15 ? '< 15 ✓' : '≥ 15: lesivo'],
      ['Pressão de platô', Pl + ' cmH₂O', Pl <= 30 ? 'ok' : 'bad', Pl <= 30 ? '≤ 30 ✓' : '> 30: risco de VILI'],
      ['Pressão de pico', Pk + ' cmH₂O', Pk < 35 ? 'ok' : 'warn', Pk < 35 ? '< 35 ✓' : '≥ 35: investigar'],
      ['Complacência estática', r1(cst) + ' mL/cmH₂O', cst >= 50 ? 'ok' : cst >= 40 ? 'warn' : 'bad', cst >= 50 ? 'normal (50–100)' : 'reduzida'],
      ['Resistência (Rva)', r1(rva) + ' cmH₂O/L/s', rva <= 10 ? 'ok' : 'warn', rva <= 10 ? 'componente resistivo pequeno' : 'resistivo aumentado'],
      ['Auto-PEEP', ap + ' cmH₂O', ap <= 0 ? 'ok' : 'bad', ap <= 0 ? 'ausente' : 'aprisionamento aéreo']
    ];
    $('#me_r', b).innerHTML = R.map(r => `<div class="res ${r[2]}"><small>${r[0]}</small><b>${r[1]}</b><em>${r[3]}</em></div>`).join('');
    const grad = Pk - Pl;
    const prob = grad > 10 && Pl <= 30 && dp < 15 ? 'Problema <b>RESISTIVO</b> (pico alto com platô normal): secreção/rolha → aspirar · broncoespasmo → broncodilatador · tubo dobrado/mordido · fluxo alto demais.' : (Pl > 30 || dp >= 15 || cst < 40) ? `Problema predominante <b>ELÁSTICO</b> (${Pl > 30 || dp >= 15 ? 'platô/ΔP altos' : 'complacência reduzida'}, gradiente pico-platô pequeno): SDRA, edema, pneumonia, atelectasia, pneumotórax, intubação seletiva, distensão abdominal, derrame, auto-PEEP, VC excessivo → ausculta, RX, rever VC/PEEP.` : 'Mecânica dentro dos limites protetores.';
    $('#me_i', b).innerHTML = `<div class="formula" style="margin-top:0">ΔP = ${Pl} − ${PE} = ${dp} · Cest = ${V}/${dp} = ${r1(cst)} · Rva = (${Pk} − ${Pl}) / ${r2(Fl)} L/s = ${r1(rva)} · Cdin = ${V}/(${Pk} − ${PE}) = ${r1(cdy)}</div>${prob}`;
  };
  const set = a => { ['me_v', 'me_pk', 'me_pl', 'me_pe', 'me_f', 'me_pt'].forEach((k, i) => $('#' + k, b).value = a[i]); run(); };
  $$('input', b).forEach(i => i.oninput = run);
  $('#me_ex', b).onclick = () => set([450, 32, 24, 10, 60, 10]);
  $('#me_res', b).onclick = () => set([450, 42, 22, 8, 60, 8]);
  $('#me_el', b).onclick = () => set([420, 38, 34, 10, 60, 10]);
  run();
};

/* ================= FLASHCARDS ================= */
const fcState = { mod: 'all', onlyHard: false, order: [], pos: 0, flipped: false };
function fcRebuild() {
  const fr = store.get('fr', {});
  let idx = FLASH.map((f, i) => i).filter(i => fcState.mod === 'all' || FLASH[i].m === fcState.mod);
  if (fcState.onlyHard) idx = idx.filter(i => fr[i] !== 3);
  fcState.order = shuffle(idx); fcState.pos = 0; fcState.flipped = false;
}
function renderFlashPage() {
  const pg = h('section', { class: 'page', id: 'pg-flash' });
  pg.innerHTML = `<div class="hero" style="--mc:#0891b2"><div class="kicker">Revisão ativa</div><h1>Flashcards</h1><p>Leia a pergunta, responda de cabeça e vire o card. Seja honesto na nota: os "não sei" voltam no filtro de difíceis. Atalhos: espaço vira, 1/2/3 dá a nota, setas navegam.</p><div class="hstats" id="fcStats"></div></div>
  <div style="height:16px"></div><div class="fc-bar" id="fcChips"></div>
  <div class="fc-bar"><button class="chip" id="fcHard">Só os que não domino</button><button class="chip" id="fcShuf">Embaralhar</button><button class="chip" id="fcReset">Zerar notas</button></div>
  <div class="fc-stage"><div class="fc" id="fc"><div class="fc-face fc-front"><div class="fk"></div><div class="fq"></div><div class="hintflip">toque para virar</div></div><div class="fc-face fc-back"><div class="fk"></div><div class="fa"></div></div></div></div>
  <div class="fc-rate"><button class="r1" data-r="1">Não sei</button><button class="r2" data-r="2">Quase</button><button class="r3" data-r="3">Sei</button></div>
  <div class="fc-nav"><button class="btn sm sec" id="fcPrev">Anterior</button><span id="fcPos"></span><button class="btn sm sec" id="fcNext">Próximo</button></div>`;
  $('#main').appendChild(pg);
  const chips = [['all', 'Todos', '#0891b2'], ...MODULES.map(m => [m.id, m.short, m.color])];
  $('#fcChips', pg).innerHTML = chips.map(c => `<button class="chip" data-m="${c[0]}" style="--c:${c[2]}">${c[1]}</button>`).join('');
  $$('#fcChips .chip', pg).forEach(c => c.onclick = () => { fcState.mod = c.dataset.m; fcRebuild(); fcRender(); });
  $('#fcHard', pg).onclick = () => { fcState.onlyHard = !fcState.onlyHard; fcRebuild(); fcRender(); };
  $('#fcShuf', pg).onclick = () => { fcRebuild(); fcRender(); toast('Embaralhado'); };
  $('#fcReset', pg).onclick = () => { if (confirm('Zerar todas as notas dos flashcards?')) { store.set('fr', {}); fcRebuild(); fcRender(); } };
  $('#fc', pg).onclick = () => { fcState.flipped = !fcState.flipped; $('#fc').classList.toggle('flip', fcState.flipped); };
  $$('.fc-rate button', pg).forEach(b => b.onclick = () => fcRate(+b.dataset.r));
  $('#fcPrev', pg).onclick = () => fcMove(-1); $('#fcNext', pg).onclick = () => fcMove(1);
  fcRebuild();
}
function fcRender() {
  const pg = $('#pg-flash'); if (!pg) return;
  const fr = store.get('fr', {});
  $$('#fcChips .chip', pg).forEach(c => c.classList.toggle('on', c.dataset.m === fcState.mod));
  $('#fcHard', pg).classList.toggle('on', fcState.onlyHard);
  const pool = FLASH.map((f, i) => i).filter(i => fcState.mod === 'all' || FLASH[i].m === fcState.mod);
  const cnt = r => pool.filter(i => fr[i] === r).length;
  $('#fcStats', pg).innerHTML = `<div class="hstat"><b>${pool.length}</b>cards</div><div class="hstat"><b>${cnt(3)}</b>sei</div><div class="hstat"><b>${cnt(2)}</b>quase</div><div class="hstat"><b>${cnt(1)}</b>não sei</div><div class="hstat"><b>${pool.length - cnt(1) - cnt(2) - cnt(3)}</b>sem nota</div>`;
  const fc = $('#fc', pg);
  if (!fcState.order.length) { $('.fq', fc).innerHTML = fcState.onlyHard ? 'Nenhum card pendente neste filtro. Você dominou tudo!' : 'Sem cards.'; $('.fa', fc).innerHTML = ''; $('#fcPos', pg).textContent = '0/0'; fc.classList.remove('flip'); return; }
  const i = fcState.order[fcState.pos], f = FLASH[i], m = MOD[f.m];
  fc.style.setProperty('--c', m.color);
  $$('.fk', fc).forEach(k => k.textContent = m.name);
  $('.fq', fc).innerHTML = f.q; $('.fa', fc).innerHTML = f.a;
  fc.classList.toggle('flip', fcState.flipped);
  $$('.fc-rate button', pg).forEach(b => b.classList.toggle('on', fr[i] === +b.dataset.r));
  $('#fcPos', pg).textContent = `${fcState.pos + 1} / ${fcState.order.length}`;
}
function fcMove(d) { if (!fcState.order.length) return; fcState.pos = (fcState.pos + d + fcState.order.length) % fcState.order.length; fcState.flipped = false; fcRender(); }
function fcRate(r) { if (!fcState.order.length) return; const fr = store.get('fr', {}); fr[fcState.order[fcState.pos]] = r; store.set('fr', fr); fcMove(1); }
document.addEventListener('keydown', e => {
  if (current !== 'flash' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === ' ') { e.preventDefault(); $('#fc').click(); }
  else if (e.key === 'ArrowRight') fcMove(1); else if (e.key === 'ArrowLeft') fcMove(-1);
  else if (['1', '2', '3'].includes(e.key)) fcRate(+e.key);
});

/* ================= SIMULADO ================= */
const simSetup = { mods: MODULES.map(m => m.id), n: 20, mode: 'prova' };
let sim = null, simTimer = null;
function renderSimPage() {
  const pg = h('section', { class: 'page', id: 'pg-sim' });
  pg.innerHTML = `<div class="hero" style="--mc:#ea580c"><div class="kicker">Treino de prova</div><h1>Simulado</h1><p>Questões objetivas no estilo da prova, sorteadas dos módulos que você escolher. "Prova" corrige no final; "Treino" mostra a resposta na hora.</p></div><div style="height:16px"></div><div id="simBox"></div>`;
  $('#main').appendChild(pg);
  simRenderSetup();
}
function simRenderSetup() {
  clearInterval(simTimer); sim = null;
  const box = $('#simBox'); if (!box) return;
  const hist = store.get('simh', []);
  const avail = QUEST.filter(q => simSetup.mods.includes(q.m)).length;
  box.innerHTML = `<div class="card"><h3 style="margin-bottom:10px">Montar simulado</h3>
  <div class="fld"><label>Módulos</label></div><div class="fc-bar" id="smods">${MODULES.map(m => `<button class="chip ${simSetup.mods.includes(m.id) ? 'on' : ''}" data-m="${m.id}" style="--c:${m.color}">${m.short} (${QUEST.filter(q => q.m === m.id).length})</button>`).join('')}</div>
  <div class="row" style="margin-top:4px"><div class="fld"><label>Questões</label><div class="seg" id="sn">${[10, 20, 30, 0].map(n => `<button data-n="${n}" class="${simSetup.n === n ? 'on' : ''}">${n || 'Todas'}</button>`).join('')}</div></div>
  <div class="fld"><label>Modo</label><div class="seg" id="smode"><button data-v="prova" class="${simSetup.mode === 'prova' ? 'on' : ''}">Prova</button><button data-v="treino" class="${simSetup.mode === 'treino' ? 'on' : ''}">Treino</button></div></div></div>
  <div class="row"><button class="btn" id="sgo" ${avail ? '' : 'disabled'}>Começar (${simSetup.n ? Math.min(simSetup.n, avail) : avail} questões)</button></div></div>
  ${hist.length ? `<h2 class="sec">Histórico</h2><div class="card">${hist.slice(-8).reverse().map(x => `<div class="lrow"><span>${x.d} · ${x.mods}</span><b style="color:${x.p >= 70 ? 'var(--ok)' : x.p >= 50 ? 'var(--warn)' : 'var(--bad)'}">${x.h}/${x.n} (${x.p}%)</b></div>`).join('')}</div>` : ''}`;
  $$('#smods .chip', box).forEach(c => c.onclick = () => { const id = c.dataset.m; simSetup.mods = simSetup.mods.includes(id) ? simSetup.mods.filter(x => x !== id) : [...simSetup.mods, id]; simRenderSetup(); });
  $$('#sn button', box).forEach(b => b.onclick = () => { simSetup.n = +b.dataset.n; simRenderSetup(); });
  $$('#smode button', box).forEach(b => b.onclick = () => { simSetup.mode = b.dataset.v; simRenderSetup(); });
  $('#sgo', box).onclick = simStart;
}
function simStart() {
  let qs = shuffle(QUEST.map((q, i) => i).filter(i => simSetup.mods.includes(QUEST[i].m)));
  if (simSetup.n) qs = qs.slice(0, simSetup.n);
  sim = { qs, ans: {}, pos: 0, t0: Date.now(), mode: simSetup.mode, perm: Object.fromEntries(qs.map(i => [i, shuffle(QUEST[i].o.map((_, k) => k))])) };
  clearInterval(simTimer); simTimer = setInterval(() => { const el = $('#stimer'); if (el && sim) { const s = Math.floor((Date.now() - sim.t0) / 1000); el.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; } }, 1000);
  simDraw();
}
function simDraw() {
  const box = $('#simBox'); const qi = sim.qs[sim.pos], q = QUEST[qi], m = MOD[q.m];
  const answered = sim.ans[qi] !== undefined, showKey = sim.mode === 'treino' && answered;
  const nAns = Object.keys(sim.ans).length;
  box.innerHTML = `<div class="simtop"><span class="timer" id="stimer">00:00</span><div class="pbar"><i style="width:${nAns / sim.qs.length * 100}%;background:var(--mc)"></i></div><span style="font-size:.8rem;font-weight:700;color:var(--muted)">${nAns}/${sim.qs.length}</span></div>
  <div class="simq"><div class="qk" style="color:${m.color}">Questão ${sim.pos + 1} · ${m.name}</div><div class="qt">${q.q}</div>
  <div class="opts wide">${sim.perm[qi].map((k, j) => `<button class="ob ${showKey ? (k === q.a ? 'ok' : (sim.ans[qi] === k ? 'bad' : 'dimmed')) : (sim.ans[qi] === k ? 'ok' : '')}" data-k="${k}" ${showKey ? 'disabled' : ''} style="${!showKey && sim.ans[qi] === k ? 'border-color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,var(--card2))' : ''}"><b>${'ABCDE'[j]})</b> ${q.o[k]}</button>`).join('')}</div>
  ${showKey ? `<div class="fb show ${sim.ans[qi] === q.a ? 'ok' : 'bad'}"><div class="fbt">${sim.ans[qi] === q.a ? 'Certo' : 'Errado'}</div>${q.e}</div>` : ''}
  <div class="row"><button class="btn sec" id="sprev">Anterior</button><button class="btn sec" id="snext">Próxima</button><span style="flex:1"></span><button class="btn" id="send">Finalizar e corrigir</button></div>
  <div class="qdots">${sim.qs.map((x, i) => `<button class="${sim.ans[x] !== undefined ? (sim.mode === 'treino' ? (sim.ans[x] === QUEST[x].a ? 'ok' : 'bad') : 'ans') : ''} ${i === sim.pos ? 'cur' : ''}" data-i="${i}">${i + 1}</button>`).join('')}</div></div>`;
  $$('.ob', box).forEach(b => b.onclick = () => { sim.ans[qi] = +b.dataset.k; if (sim.mode === 'prova' && sim.pos < sim.qs.length - 1) { simDraw(); setTimeout(() => { sim.pos++; simDraw(); }, 180); } else simDraw(); });
  $('#sprev', box).onclick = () => { if (sim.pos > 0) { sim.pos--; simDraw(); } };
  $('#snext', box).onclick = () => { if (sim.pos < sim.qs.length - 1) { sim.pos++; simDraw(); } };
  $('#send', box).onclick = () => { const left = sim.qs.length - Object.keys(sim.ans).length; if (left && !confirm(`Ainda faltam ${left} questões. Finalizar mesmo assim?`)) return; simEnd(); };
  $$('.qdots button', box).forEach(b => b.onclick = () => { sim.pos = +b.dataset.i; simDraw(); });
  const s = Math.floor((Date.now() - sim.t0) / 1000); $('#stimer').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function simEnd() {
  clearInterval(simTimer);
  const box = $('#simBox');
  const hit = sim.qs.filter(i => sim.ans[i] === QUEST[i].a).length, n = sim.qs.length, p = Math.round(hit / n * 100);
  const secs = Math.floor((Date.now() - sim.t0) / 1000);
  const hist = store.get('simh', []); hist.push({ d: new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }), mods: simSetup.mods.length === MODULES.length ? 'Todos' : simSetup.mods.map(x => MOD[x].short).join(', '), h: hit, n, p }); store.set('simh', hist);
  const byMod = MODULES.map(m => { const q = sim.qs.filter(i => QUEST[i].m === m.id); return q.length ? `<div class="res ${q.filter(i => sim.ans[i] === QUEST[i].a).length / q.length >= .7 ? 'ok' : 'warn'}"><small>${m.short}</small><b>${q.filter(i => sim.ans[i] === QUEST[i].a).length}/${q.length}</b></div>` : ''; }).join('');
  box.innerHTML = `<div class="scorebig"><b>${p}%</b>${hit} de ${n} · ${Math.floor(secs / 60)} min ${secs % 60} s<div style="margin-top:8px;opacity:.9">${p >= 80 ? 'Excelente. Revise só os erros abaixo.' : p >= 60 ? 'Bom. Volte nos tópicos dos erros e refaça.' : 'Vale reler os resumos dos módulos com mais erros e refazer.'}</div></div>
  <div class="result">${byMod}</div>
  <div class="row"><button class="btn" id="sagain">Novo simulado</button><button class="btn sec" id="serr">Mostrar só erros</button></div><div id="srev"></div>`;
  const rev = onlyErr => { $('#srev').innerHTML = sim.qs.filter(i => !onlyErr || sim.ans[i] !== QUEST[i].a).map((i, k) => { const q = QUEST[i], ok = sim.ans[i] === q.a; return `<div class="rev-item ${ok ? 'ok' : 'bad'}"><div style="font-size:.7rem;font-weight:900;color:${MOD[q.m].color};text-transform:uppercase">${MOD[q.m].short} · ${ok ? 'acertou' : 'errou'}</div><div style="font-weight:650;margin-top:4px">${q.q}</div><div class="ra">${sim.ans[i] !== undefined ? `Sua resposta: ${q.o[sim.ans[i]]}` : '<i>Sem resposta</i>'}${ok ? '' : `<br><b style="color:var(--ok)">Correta: ${q.o[q.a]}</b>`}</div><div class="rx2">${q.e}</div></div>`; }).join(''); };
  rev(false);
  $('#sagain').onclick = simRenderSetup;
  $('#serr').onclick = () => rev(true);
  window.scrollTo({ top: 0 });
}

/* ================= DICIONÁRIO ================= */
const dictState = { q: '', mod: 'all', memo: false };
DICT.sort((a, b) => a.t.localeCompare(b.t, 'pt', { sensitivity: 'base' }));
DICT.forEach((d, i) => { d.i = i; d.L = (norm(d.t).match(/[a-z]/) || ['#'])[0].toUpperCase(); d.n = norm(`${d.t} ${d.ext} ${d.d} ${d.p}`); });
function renderDictPage() {
  const pg = h('section', { class: 'page', id: 'pg-dict' });
  pg.innerHTML = `<div class="hero" style="--mc:#65a30d"><div class="kicker">Siglas e termos</div><h1>Dicionário da UTI</h1><p>Cada termo em linguagem simples: o que é e o que importa na prova. Use o "Modo decorar" para esconder as definições e testar se você lembra.</p><div class="hstats"><div class="hstat"><b>${DICT.length}</b>termos</div></div></div>
  <div class="dict-tools">
    <input id="dq" class="dq" type="search" placeholder="Buscar termo ou sigla (ex.: hipoxemia, SDRA, PEEP)" autocomplete="off">
    <div class="fc-bar" id="dChips"></div>
    <div class="az" id="dAZ"></div>
  </div>
  <div id="dList"></div>`;
  $('#main').appendChild(pg);
  const chips = [['all', 'Todos', '#65a30d'], ...MODULES.map(m => [m.id, m.short, m.color])];
  $('#dChips', pg).innerHTML = chips.map(c => `<button class="chip" data-m="${c[0]}" style="--c:${c[2]}">${c[1]}</button>`).join('') + '<button class="chip" id="dMemo" style="--c:#65a30d">Modo decorar</button>';
  $$('#dChips [data-m]', pg).forEach(c => c.onclick = () => { dictState.mod = c.dataset.m; dictRender(); });
  $('#dMemo', pg).onclick = () => { dictState.memo = !dictState.memo; dictRender(); };
  $('#dq', pg).addEventListener('input', e => { dictState.q = e.target.value; dictRender(); });
  $('#dAZ', pg).addEventListener('click', e => {
    const b = e.target.closest('button[data-l]'); if (!b || b.disabled) return;
    const el = $('#dl-' + b.dataset.l); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - dictOffset(), behavior: 'smooth' });
  });
  $('#dList', pg).addEventListener('click', e => { const c = e.target.closest('.dcard'); if (c && dictState.memo) c.classList.toggle('rev'); });
  dictRender();
}
function dictRender() {
  const pg = $('#pg-dict'); if (!pg) return;
  const terms = norm(dictState.q).split(' ').filter(Boolean);
  const list = DICT.filter(d => (dictState.mod === 'all' || d.m === dictState.mod) && terms.every(t => d.n.includes(t)));
  $$('#dChips [data-m]', pg).forEach(c => c.classList.toggle('on', c.dataset.m === dictState.mod));
  $('#dMemo', pg).classList.toggle('on', dictState.memo);
  const letters = [...new Set(list.map(d => d.L))];
  $('#dAZ', pg).innerHTML = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(l => `<button data-l="${l}" ${letters.includes(l) ? '' : 'disabled'}>${l}</button>`).join('');
  const box = $('#dList', pg);
  box.classList.toggle('memo', dictState.memo);
  if (!list.length) { box.innerHTML = '<div class="sr-empty">Nenhum termo encontrado. Tente outra palavra ou mude o filtro.</div>'; return; }
  box.innerHTML = letters.map(l => `<h3 class="dl-letter" id="dl-${l}">${l}</h3><div class="dgrid">${list.filter(d => d.L === l).map(d => { const m = MOD[d.m]; return `<div class="dcard" id="d-${d.i}" style="--c:${m.color}"><div class="dhead"><b>${d.t}</b><span class="dtag">${m.short}</span></div>${d.ext ? `<div class="dext">${d.ext}</div>` : ''}<div class="dbody"><p class="dd">${d.d}</p>${d.p ? `<p class="dp"><span>Na prova</span>${d.p}</p>` : ''}</div><div class="dhint">toque para ver</div></div>`; }).join('')}</div>`).join('');
}
function openDict(i) {
  dictState.q = ''; dictState.mod = 'all'; dictState.memo = false;
  go('dict'); $('#dq').value = ''; dictRender();
  const c = $('#d-' + i); if (!c) return;
  c.classList.remove('flash-hl'); void c.offsetWidth; c.classList.add('flash-hl');
  setTimeout(() => window.scrollTo({ top: c.getBoundingClientRect().top + window.scrollY - dictOffset(), behavior: 'smooth' }), 60);
}
function dictOffset() { const t = $('.dict-tools'); return parseFloat(getComputedStyle(t).top) + t.offsetHeight + 10; }

/* ================= SEARCH ================= */
let SIDX = [];
function buildIndex() {
  DICT.forEach(d => SIDX.push({ k: 'Dicionário', m: d.m, t: d.t + (d.ext ? ' · ' + d.ext : ''), s: d.d, n: d.n, go: () => openDict(d.i) }));
  MODULES.forEach(m => {
    (TOPICS[m.id] || []).forEach((t, i) => SIDX.push({ k: 'Tópico', m: m.id, t: t.t, s: strip(t.b), n: norm(t.t + ' ' + t.s + ' ' + t.b), go: () => openTopic(m.id, i) }));
    (COMPARE[m.id] || []).forEach(c => SIDX.push({ k: 'Comparação', m: m.id, t: c.t, s: strip(c.rows.map(r => r.join(' · ')).join(' | ')), n: norm(c.t + ' ' + c.head.join(' ') + ' ' + c.rows.flat().join(' ')), go: () => go(m.id, { sub: 'comp' }) }));
  });
  FLASH.forEach((f, i) => SIDX.push({ k: 'Flashcard', m: f.m, t: strip(f.q), s: strip(f.a), n: norm(f.q + ' ' + f.a), go: () => { go('flash'); fcState.mod = 'all'; fcState.onlyHard = false; fcRebuild(); fcState.pos = fcState.order.indexOf(i); fcState.flipped = true; fcRender(); } }));
  CASES.forEach(c => SIDX.push({ k: 'Caso', m: c.mod, t: c.t, s: strip(c.vig), n: norm(c.t + ' ' + c.vig + ' ' + c.qs.map(q => q.q + ' ' + q.a).join(' ')), go: () => go(c.mod, { sub: 'casos' }) }));
  DRILLS.forEach(d => SIDX.push({ k: 'Treino', m: d.mod, t: d.t, s: d.d || '', n: norm(d.t + ' ' + (d.d || '') + ' ' + d.items.map(x => x.q).join(' ')), go: () => go(d.mod, { sub: 'treino' }) }));
}
function openTopic(mid, i) {
  go(mid, { sub: 'resumo' });
  const t = $(`#t-${mid}-${i}`); if (!t) return;
  t.classList.add('open'); t.classList.remove('flash-hl'); void t.offsetWidth; t.classList.add('flash-hl');
  setTimeout(() => window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 130, behavior: 'smooth' }), 60);
}
function doSearch(qs) {
  const box = $('#qres');
  const q = norm(qs); if (q.length < 2) { box.classList.remove('show'); return; }
  const terms = q.split(' ').filter(Boolean);
  const res = SIDX.map(x => { let sc = 0; for (const t of terms) { if (!x.n.includes(t)) return null; sc += norm(x.t).includes(t) ? 5 : 1; } if (x.k === 'Tópico') sc += 2; if (x.k === 'Dicionário') sc += 3; return { x, sc }; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 14);
  const hl = s => { let out = s; terms.forEach(t => { const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); out = out.replace(re, '<mark>$1</mark>'); }); return out; };
  const snip = s => { const i = norm(s).indexOf(terms[0]); const a = Math.max(0, i - 50); return (a ? '…' : '') + s.slice(a, a + 140) + '…'; };
  box.innerHTML = res.length ? res.map((r, i) => `<div class="sr-item" data-i="${i}"><div class="sr-k" style="color:${MOD[r.x.m].color}">${r.x.k} · ${MOD[r.x.m].short}</div><div class="sr-t">${hl(r.x.t)}</div><div class="sr-s">${hl(snip(r.x.s))}</div></div>`).join('') : '<div class="sr-empty">Nada encontrado. Tente outro termo (ex.: "auto-PEEP", "Venturi", "noradrenalina").</div>';
  box.classList.add('show');
  $$('.sr-item', box).forEach(el => el.onclick = () => { res[+el.dataset.i].x.go(); box.classList.remove('show'); $('#q').blur(); });
}
$('#q').addEventListener('input', e => doSearch(e.target.value));
$('#q').addEventListener('focus', e => doSearch(e.target.value));
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('#qres .sr-item'); if (f) f.click(); } if (e.key === 'Escape') { $('#qres').classList.remove('show'); e.target.blur(); } });
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) $('#qres').classList.remove('show'); });

/* ================= boot ================= */
applyTheme(store.get('theme', 'dark'));
buildNav();
renderHome();
MODULES.forEach(renderModule);
renderFlashPage();
renderDictPage();
renderSimPage();
buildIndex();
go((location.hash || '#home').slice(1), { keepScroll: true });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== current) go(id); });

</script>
