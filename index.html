<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<meta name="description" content="Atlas de estudo de Fisioterapia em UTI: avaliação do doente crítico, exames, oxigenioterapia, VNI e ventilação mecânica invasiva.">
<title>UTI · Atlas de Prova</title>
<style>
:root{
  --bg:#0b0e15; --bg2:#10141d; --card:#151a25; --card2:#1b2130; --line:#262d3e; --line2:#323a4f;
  --text:#e8ebf4; --muted:#98a0b8; --dim:#6b7390;
  --ok:#34d399; --bad:#f87171; --warn:#fbbf24; --info:#60a5fa;
  --mc:#f472b6;
  --r:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --font: -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}
[data-theme="light"]{
  --bg:#f3f5fa; --bg2:#e9edf6; --card:#ffffff; --card2:#f5f7fc; --line:#dde2ee; --line2:#cfd6e6;
  --text:#161a26; --muted:#5a6380; --dim:#8a93ad;
  --ok:#059669; --bad:#dc2626; --warn:#b7791f; --info:#2563eb;
  --shadow:0 10px 30px rgba(40,50,90,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55;min-height:100vh;
  background-image:radial-gradient(1200px 600px at 100% -10%, color-mix(in srgb,var(--mc) 10%,transparent), transparent 60%),
  radial-gradient(900px 500px at -10% 10%, color-mix(in srgb,#60a5fa 7%,transparent), transparent 60%);
  background-attachment:fixed;padding-bottom:90px;transition:background-color .3s}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
a{color:var(--mc)}
b,strong{font-weight:700}
sub,sup{font-size:.7em}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb-row{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;cursor:pointer}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mc),color-mix(in srgb,var(--mc) 50%,#1e293b));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--mc) 40%,transparent)}
.brand small{display:block;font-size:.66rem;color:var(--muted);font-weight:600;letter-spacing:.3px}
.search-wrap{flex:1;position:relative;max-width:520px;margin-left:auto}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px 9px 36px;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--mc)}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex-shrink:0}
.iconbtn:hover{border-color:var(--mc)}
.search-res{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);max-height:65vh;overflow:auto;display:none;z-index:60}
.search-res.show{display:block}
.sr-item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sr-item:hover{background:var(--card2)}
.sr-item .sr-k{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.sr-item .sr-t{font-weight:700;font-size:.9rem}
.sr-item .sr-s{font-size:.8rem;color:var(--muted)}
.sr-empty{padding:16px;color:var(--muted);font-size:.85rem}
mark{background:color-mix(in srgb,var(--warn) 40%,transparent);color:inherit;border-radius:3px;padding:0 2px}

.nav{display:flex;gap:6px;padding:0 16px 10px;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.navbtn{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.83rem;font-weight:650;color:var(--muted);white-space:nowrap;transition:all .2s}
.navbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.navbtn:hover{color:var(--text);border-color:var(--line2)}
.navbtn.active{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}
.navbtn.active .dot{background:#fff}

.bottomnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .brand small{display:none}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));justify-content:space-around}
  .bn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-size:.6rem;font-weight:700;color:var(--dim);padding:4px 0;border-radius:10px}
  .bn .bi{width:28px;height:24px;border-radius:8px;display:grid;place-items:center}
  .bn.active{color:var(--c)}
  .bn.active .bi{background:color-mix(in srgb,var(--c) 18%,transparent)}
}

/* ---------- layout ---------- */
main{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:1.15rem;letter-spacing:-.2px;margin:26px 0 4px;display:flex;align-items:center;gap:10px}
h2.sec::before{content:"";width:4px;height:18px;border-radius:4px;background:var(--mc)}
.hint{color:var(--muted);font-size:.84rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 24px;background:linear-gradient(135deg,color-mix(in srgb,var(--mc) 90%,#000),color-mix(in srgb,var(--mc) 45%,#0b0e15));color:#fff;box-shadow:0 18px 40px color-mix(in srgb,var(--mc) 25%,transparent)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;right:60px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .kicker{font-size:.72rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.85}
.hero h1{font-size:clamp(1.5rem,4vw,2.2rem);letter-spacing:-.6px;line-height:1.15;margin:6px 0 8px}
.hero p{opacity:.92;max-width:640px;font-size:.95rem}
.hero .hstats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.hstat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;font-size:.78rem}
.hstat b{font-size:1.15rem;display:block;line-height:1.1}
.hero .hbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.hbtn{background:#fff;color:#111;border:none;border-radius:11px;padding:9px 14px;font-weight:750;font-size:.84rem}
.hbtn.ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}

/* ---------- module tiles (home) ---------- */
.mtile{position:relative;border-radius:18px;padding:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .15s,border-color .2s;overflow:hidden}
.mtile:hover{transform:translateY(-3px);border-color:var(--c)}
.mtile::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.mtile .mi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);margin-bottom:10px}
.mtile h3{font-size:1rem}
.mtile p{font-size:.8rem;color:var(--muted);margin:4px 0 12px}
.pbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--c,var(--mc));border-radius:6px;transition:width .5s}
.mtile .pl{display:flex;justify-content:space-between;font-size:.7rem;color:var(--dim);margin-top:6px}

/* ---------- subtabs ---------- */
.subtabs{display:flex;gap:6px;margin:18px 0 6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;position:sticky;top:104px;z-index:20;overflow-x:auto;scrollbar-width:none}
@media (max-width:760px){.subtabs{top:62px}}
.subtabs::-webkit-scrollbar{display:none}
.stab{flex:1;min-width:max-content;border:none;background:transparent;padding:9px 14px;border-radius:10px;font-weight:700;font-size:.84rem;color:var(--muted)}
.stab.active{background:var(--mc);color:#fff}
.stab .n{font-size:.68rem;opacity:.8;margin-left:5px}
.subpage{display:none}
.subpage.active{display:block;animation:fade .2s}

/* ---------- topic cards ---------- */
.topic{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:border-color .2s}
.topic.open{border-color:color-mix(in srgb,var(--mc) 55%,var(--line))}
.topic.flash-hl{animation:hl 1.6s ease}
@keyframes hl{0%,40%{box-shadow:0 0 0 3px var(--warn)}100%{box-shadow:none}}
.th{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.th .num{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:color-mix(in srgb,var(--mc) 15%,transparent);color:var(--mc);flex-shrink:0}
.th .tt{flex:1;min-width:0}
.th .tt b{display:block;font-size:.97rem}
.th .tt span{font-size:.75rem;color:var(--muted)}
.th .seen{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;flex-shrink:0;font-size:.75rem;color:transparent}
.topic.done .th .seen{background:var(--ok);border-color:var(--ok);color:#fff}
.th .chev{color:var(--dim);transition:transform .25s}
.topic.open .chev{transform:rotate(180deg)}
.tb{display:none;padding:0 18px 18px 18px;font-size:.9rem}
.topic.open .tb{display:block;animation:fade .2s}
.tb p{margin:8px 0}
.tb ul,.tb ol{margin:8px 0 8px 20px}
.tb li{margin:4px 0}
.tb h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.6px;color:var(--mc);margin:14px 0 4px}
.tb .done-btn{margin-top:14px}
.pearl{border-left:4px solid var(--mc);background:color-mix(in srgb,var(--mc) 9%,transparent);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0;font-weight:600}
.warn{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent);padding:10px 14px;border-radius:12px;margin:12px 0}
.warn::before{content:"ATENÇÃO  ";font-size:.68rem;font-weight:900;letter-spacing:.8px;color:var(--bad)}
.tip{border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent);padding:10px 14px;border-radius:12px;margin:12px 0}
.tip::before{content:"NA PRÁTICA  ";font-size:.68rem;font-weight:900;letter-spacing:.8px;color:var(--ok)}
.formula{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;background:var(--bg2);border:1px dashed var(--line2);padding:10px 14px;border-radius:12px;margin:10px 0;font-size:.92rem;font-weight:600;overflow-x:auto}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.mini{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.84rem}
.mini b{display:block;color:var(--mc);font-size:.8rem;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.flow span{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.82rem;font-weight:650}
.flow i{color:var(--dim);font-style:normal}
.up{color:var(--bad);font-weight:800}.dn{color:var(--info);font-weight:800}
.rxrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.rxrow figure{margin:0;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rxrow img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.rxrow figcaption{background:var(--card2);font-size:.75rem;font-weight:650;padding:6px 8px;color:var(--text)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--mc) 15%,transparent);color:var(--mc);margin-right:4px;vertical-align:middle}
.tag.g{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.r{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.y{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin:10px 0;-webkit-overflow-scrolling:touch;background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:.84rem;min-width:520px}
table.t th{text-align:left;background:var(--card2);color:var(--mc);font-size:.74rem;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:2px solid var(--line)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t td:first-child{font-weight:700;background:var(--card2);position:sticky;left:0}
table.t tr:hover td{background:color-mix(in srgb,var(--mc) 5%,var(--card))}
table.t tr:hover td:first-child{background:color-mix(in srgb,var(--mc) 8%,var(--card2))}
.cmp-card{margin-bottom:18px}
.cmp-card h3{font-size:.98rem;margin-bottom:2px}
.cmp-card .hint{margin-bottom:6px}

/* ---------- drills / tools ---------- */
.tool{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.tool-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.tool-h .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc) 15%,transparent);color:var(--mc);flex-shrink:0;font-weight:900}
.tool-h h3{font-size:1rem}
.tool-h p{font-size:.8rem;color:var(--muted)}
.tool-h .score{margin-left:auto;font-size:.78rem;font-weight:800;color:var(--muted);white-space:nowrap;text-align:right}
.tool-h .score b{color:var(--ok);font-size:1rem}
.dq{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.93rem;font-weight:600;margin-bottom:12px}
.dq img{display:block;max-width:100%;max-height:320px;margin:10px auto 0;border-radius:10px}
.dq .vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:10px}
.dq .vals div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:.9rem}
.dq .vals small{display:block;color:var(--muted);font-size:.66rem;text-transform:uppercase;font-weight:800;letter-spacing:.4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opts.wide{grid-template-columns:1fr}
.ob{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:.86rem;font-weight:650;text-align:left;transition:all .15s;line-height:1.35}
.ob:hover:not(:disabled){border-color:var(--mc);transform:translateY(-1px)}
.ob:disabled{cursor:default}
.ob.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card2))}
.ob.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card2))}
.ob.dimmed{opacity:.5}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.87rem;display:none;border:1px solid var(--line)}
.fb.show{display:block;animation:fade .2s}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.fb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.fb .fbt{font-weight:900;font-size:.75rem;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px}
.fb.ok .fbt{color:var(--ok)}.fb.bad .fbt{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{border:none;border-radius:11px;padding:10px 16px;font-weight:750;font-size:.85rem;background:var(--mc);color:#fff;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.78rem}
.steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.steps span{font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.steps span.cur{background:var(--mc);border-color:var(--mc);color:#fff}
.steps span.done{border-color:var(--ok);color:var(--ok)}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fld label{display:block;font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.fld input,.fld select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--mc)}
.result{margin-top:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.res{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}
.res small{display:block;font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.res b{font-size:1.35rem;letter-spacing:-.3px}
.res em{display:block;font-style:normal;font-size:.78rem;font-weight:700;margin-top:2px}
.res.ok{border-color:var(--ok)}.res.ok em{color:var(--ok)}
.res.bad{border-color:var(--bad)}.res.bad em{color:var(--bad)}
.res.warn{border-color:var(--warn)}.res.warn em{color:var(--warn)}
.interp{margin-top:12px;font-size:.88rem;background:var(--bg2);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 12px;border-radius:8px;font-weight:700;font-size:.8rem;color:var(--muted)}
.seg button.on{background:var(--mc);color:#fff}

/* ---------- waves ---------- */
.wave{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-top:10px}
.wave svg{width:100%;height:auto;display:block}
.wave .wl{font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ---------- IMS ladder ---------- */
.ladder{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;margin:12px 0}
.ladder div{border-radius:8px;background:var(--card2);border:1px solid var(--line);padding:8px 2px;text-align:center;font-size:.62rem;font-weight:700;cursor:pointer;min-height:84px;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;transition:all .15s;overflow-wrap:anywhere;hyphens:auto}
.ladder div b{font-size:1rem}
.ladder div.on{background:var(--mc);color:#fff;border-color:var(--mc)}
@media (max-width:600px){.ladder{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* ---------- RX gallery ---------- */
.rxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.rx{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s}
.rx:hover{transform:translateY(-2px);border-color:var(--mc)}
.rx img{width:100%;height:170px;object-fit:cover;display:block;background:#000}
.rx .rxc{padding:10px 12px;font-size:.82rem}
.rx .rxc b{display:block}
.rx .rxc span{color:var(--muted);font-size:.76rem}
.rx.hidden-ans .rxc b,.rx.hidden-ans .rxc span{filter:blur(6px)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:12px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:78vh;border-radius:12px}
.lightbox p{color:#fff;max-width:640px;text-align:center;font-size:.9rem}

/* ---------- cases ---------- */
.case{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.case-h{padding:16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--mc) 16%,transparent),transparent);border-bottom:1px solid var(--line)}
.case-h .k{font-size:.68rem;font-weight:900;letter-spacing:.8px;color:var(--mc);text-transform:uppercase}
.case-h h3{font-size:1.02rem}
.case-b{padding:16px 18px}
.vig{display:grid;grid-template-columns:1fr;gap:12px}
.vig.wimg{grid-template-columns:1.2fr 1fr}
@media (max-width:700px){.vig.wimg{grid-template-columns:1fr}}
.vig img{width:100%;border-radius:12px;cursor:zoom-in;background:#000}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.chips span.r{border-color:color-mix(in srgb,var(--bad) 60%,transparent);color:var(--bad)}
.chips span.g{border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok)}
.cq{border-top:1px dashed var(--line2);padding-top:12px;margin-top:12px}
.cq .q{font-weight:700;font-size:.9rem}
.cq .a{display:none;margin-top:8px;font-size:.88rem;background:color-mix(in srgb,var(--ok) 8%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:12px;padding:10px 12px}
.cq.rev .a{display:block;animation:fade .2s}
.cq textarea{width:100%;margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:48px;resize:vertical;font-size:.88rem}

/* ---------- flashcards ---------- */
.fc-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.78rem;font-weight:700;color:var(--muted)}
.chip.on{background:var(--c,var(--mc));border-color:var(--c,var(--mc));color:#fff}
/* ---------- dicionário ---------- */
.dict-tools{position:sticky;top:104px;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 0 8px;margin-top:8px}
@media (max-width:760px){.dict-tools{top:62px}}
.dq{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;font-size:.92rem;color:var(--text);outline:none;margin-bottom:10px}
.dq:focus{border-color:var(--mc)}
.dict-tools .fc-bar{margin-bottom:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.dict-tools .chip{flex:none}
.az{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.az button{flex:1 0 24px;min-width:24px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:.74rem;font-weight:800;cursor:pointer}
.az button:hover:not(:disabled){background:var(--mc);border-color:var(--mc);color:#fff}
.az button:disabled{opacity:.25;cursor:default}
@media (max-width:760px){.az{flex-wrap:wrap}.az button{flex:1 0 calc(100% / 13 - 3px);min-width:0;height:26px}}
.dl-letter{font-size:1.4rem;font-weight:900;color:var(--mc);margin:22px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media (max-width:400px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:14px 16px;min-width:0;overflow-wrap:anywhere}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dhead b{font-size:1.08rem;line-height:1.25}
.dtag{flex:none;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.dext{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:3px}
.dbody .dd{margin:10px 0 0;font-size:.93rem;line-height:1.5}
.dbody .dp{margin:8px 0 0;font-size:.84rem;line-height:1.5;color:var(--muted);background:var(--card2);border-radius:10px;padding:8px 10px}
.dbody .dp span{display:block;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--c);margin-bottom:2px}
.dhint{display:none;margin-top:10px;font-size:.75rem;font-weight:700;color:var(--dim)}
#dList.memo .dcard{cursor:pointer}
#dList.memo .dcard:not(.rev) .dbody{display:none}
#dList.memo .dcard:not(.rev) .dhint{display:block}
.dcard.flash-hl{animation:hl 1.6s ease}
.fc-stage{perspective:1400px;max-width:720px;margin:0 auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);overflow:auto}
.fc-face .fk{position:absolute;top:16px;left:20px;font-size:.68rem;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--c)}
.fc-face .fq{font-size:1.25rem;font-weight:750;letter-spacing:-.2px;text-align:center}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card))}
.fc-back .fa{font-size:1.02rem;text-align:center}
.fc-face .hintflip{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--dim)}
.fc-rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:720px;margin:14px auto 0}
.fc-rate button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px;font-weight:800;font-size:.84rem}
.fc-rate .r1:hover,.fc-rate .r1.on{border-color:var(--bad);color:var(--bad)}
.fc-rate .r2:hover,.fc-rate .r2.on{border-color:var(--warn);color:var(--warn)}
.fc-rate .r3:hover,.fc-rate .r3.on{border-color:var(--ok);color:var(--ok)}
.fc-nav{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:12px auto 0;font-size:.8rem;color:var(--muted)}
@media (max-width:600px){.fc{height:340px}.fc-face .fq{font-size:1.08rem}}

/* ---------- simulado ---------- */
.simq{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.simq .qk{font-size:.7rem;font-weight:900;letter-spacing:.7px;text-transform:uppercase}
.simq .qt{font-size:1rem;font-weight:650;margin:8px 0 14px}
.simtop{display:flex;align-items:center;gap:12px;margin-bottom:12px;position:sticky;top:104px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
@media (max-width:760px){.simtop{top:62px}}
.simtop .timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--mc)}
.simtop .pbar{flex:1}
.qdots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.qdots button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-size:.72rem;font-weight:800;color:var(--muted)}
.qdots button.ans{background:color-mix(in srgb,var(--mc) 25%,var(--card2));color:var(--text)}
.qdots button.cur{border-color:var(--mc);border-width:2px}
.qdots button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.qdots button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.scorebig{text-align:center;padding:26px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--mc),color-mix(in srgb,var(--mc) 40%,#0b0e15))}
.scorebig b{font-size:3rem;display:block;line-height:1}
.rev-item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;font-size:.86rem}
.rev-item.ok{border-left-color:var(--ok)}.rev-item.bad{border-left-color:var(--bad)}
.rev-item .ra{margin-top:6px}
.rev-item .rx2{margin-top:8px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}

/* ---------- lousa ---------- */
.lousa{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lgrp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;border-top:4px solid var(--c)}
.lgrp h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.6px;color:var(--c);margin-bottom:8px}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.84rem}
.lrow:last-child{border-bottom:none}
.lrow span{color:var(--muted)}
.lrow b{text-align:right;font-variant-numeric:tabular-nums}
.lousa.quiz .lrow b{filter:blur(7px);cursor:pointer;transition:filter .2s;user-select:none}
.lousa.quiz .lrow b.rev{filter:none}
.plan li{margin:8px 0;list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.plan input{width:18px;height:18px;margin-top:2px;accent-color:var(--mc);flex-shrink:0}
.plan a{cursor:pointer;font-weight:700;text-decoration:none}
footer{text-align:center;color:var(--dim);font-size:.74rem;padding:30px 16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:700;font-size:.84rem;opacity:0;transition:all .25s;z-index:120;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>

TOPICS.aval = [
{ t: 'O que torna um paciente "crítico"', s: 'Gravidade é trajetória, não diagnóstico',
b: `<div class="pearl">Gravidade não é um diagnóstico. É uma condição dinâmica de risco, disfunção orgânica e necessidade de suporte.</div>
<div class="minis"><div class="mini"><b>Instabilidade</b>Real ou potencial, com risco de deterioração rápida.</div><div class="mini"><b>Disfunção orgânica</b>Um ou mais sistemas comprometidos, frequentemente interdependentes.</div><div class="mini"><b>Suporte avançado</b>O₂, ventilação, vasopressor, terapia renal e outros.</div><div class="mini"><b>Monitorização contínua</b>Detectar a mudança antes que vire evento irreversível.</div></div>
<p>Gravidade é melhor entendida pela <b>trajetória clínica</b> do que por um único valor isolado.</p>
<h4>Fisiopatologia: sinais da SDMO</h4>
<div class="flow"><span>Agressão inicial (sepse, trauma, grande cirurgia)</span><i>→</i><span>Disfunção microcirculatória (perfusão comprometida mesmo com sinais vitais "estáveis")</span><i>→</i><span>Disfunção orgânica múltipla</span></div>
<p>A sepse é o paradigma mais estudado dessa cascata, mas o mesmo caminho vale para grandes traumas e cirurgias de alto risco.</p>
<h4>Reserva fisiológica reduzida</h4>
<div class="minis"><div class="mini"><b>Paciente estável</b>Reserva preservada. Um banho no leito ou mudança de decúbito passam despercebidos. Há margem entre o basal e o limite.</div><div class="mini"><b>Paciente crítico</b>Reserva já consumida, opera perto do limite. O mesmo estímulo gera dessaturação, hipotensão ou taquicardia. <b style="display:inline;color:inherit;text-transform:none">Toda manipulação exige avaliação prévia.</b></div></div>
<h4>Crítico ≠ intubado</h4>
<div class="minis"><div class="mini"><b>Aparentemente estável</b>Intubado e sedado · FiO₂ 30% · PEEP 5 · PAM 78 · sem vasopressor · estável há 8 h.</div><div class="mini"><b>Em deterioração</b>Ventilação espontânea · SpO₂ 92% em O₂ 4 L/min · PAM 62 · noradrenalina em escalada · confusão nova.</div></div>
<div class="tip">Quem está mais instável agora é o paciente em ventilação espontânea: tendência de piora, vasopressor subindo e alteração aguda de consciência. O tubo não define gravidade.</div>` },

{ t: 'Antes de tocar: os 5 passos', s: 'Paciente → Monitor → Suporte → Dispositivos → Tendência',
b: `<div class="minis"><div class="mini"><b>1 · Paciente</b>Conforto, consciência, esforço, posição.</div><div class="mini"><b>2 · Monitor</b>FC, PA/PAM, FR, SpO₂, ritmo.</div><div class="mini"><b>3 · Suporte</b>O₂, VM, VNI, vasopressor, sedação.</div><div class="mini"><b>4 · Dispositivos</b>TOT/TQT, CVC, drenos, PAI, sondas.</div><div class="mini"><b>5 · Tendência</b>O que mudou? Melhor ou pior?</div></div>
<h4>Contexto clínico antes do exame físico (prontuário)</h4>
<ul><li>Motivo da internação e diagnóstico atual</li><li>Tempo de UTI e últimas 24 h</li><li>Comorbidades e funcionalidade prévia</li><li>Intercorrências e procedimentos recentes</li></ul>
<h4>Dados que mudam a conduta</h4>
<ul><li>Laboratório relevante · imagem e gasometria</li><li>Balanço hídrico / diurese</li><li>Metas e restrições assistenciais</li></ul>
<div class="pearl">A avaliação à beira-leito começa antes de entrar no box.</div>
<h4>Objetivos da avaliação</h4>
<p><b>Reconhecer</b> o que caracteriza o crítico e sua trajetória · <b>Mapear</b> dispositivos e suportes · <b>Avaliar</b> domínios neurológico, hemodinâmico, respiratório e funcional · <b>Integrar</b> monitor, exame físico, suporte e tendência.</p>` },

{ t: 'Neurológico: Glasgow, RASS, CAM-ICU', s: 'Consciência, sedação, delirium e dor moldam a participação',
b: `<div class="pearl">O estado neurológico determina o que o paciente consegue fazer e o que é seguro propor.</div>
<div class="minis"><div class="mini"><b>Glasgow</b>Paciente <u>sem sedação</u>, principalmente neurocrítico. Padrão-ouro para nível de consciência e indicação de suporte invasivo. <b style="display:inline;color:var(--bad)">GCS < 8 = indicação de IOT.</b></div><div class="mini"><b>RASS</b>Paciente <u>sedado</u>. Agitação/sedação de +4 a −5.</div><div class="mini"><b>CAM-ICU</b>Avalia <u>delirium</u>. Instrumento validado e com treinamento.</div></div>
<h4>Glasgow (3–15)</h4>
<div class="tblwrap"><table class="t"><thead><tr><th>Componente</th><th>Pontos</th></tr></thead><tbody><tr><td>Abertura ocular</td><td>4 espontânea · 3 à voz · 2 à pressão/dor · 1 ausente</td></tr><tr><td>Resposta verbal</td><td>5 orientado · 4 confuso · 3 palavras · 2 sons · 1 ausente</td></tr><tr><td>Resposta motora</td><td>6 obedece · 5 localiza · 4 flexão normal · 3 flexão anormal · 2 extensão · 1 ausente</td></tr></tbody></table></div>
<h4>RASS</h4>
<div class="tblwrap"><table class="t"><thead><tr><th>Escore</th><th>Descrição</th></tr></thead><tbody><tr><td>+4</td><td>Combativo</td></tr><tr><td>+3</td><td>Muito agitado (puxa tubos)</td></tr><tr><td>+2</td><td>Agitado</td></tr><tr><td>+1</td><td>Inquieto</td></tr><tr><td>0</td><td>Alerta e calmo</td></tr><tr><td>−1</td><td>Sonolento (desperta à voz > 10 s)</td></tr><tr><td>−2</td><td>Sedação leve (< 10 s)</td></tr><tr><td>−3</td><td>Sedação moderada (movimento à voz, sem contato visual)</td></tr><tr><td>−4</td><td>Sedação profunda (só responde a estímulo físico)</td></tr><tr><td>−5</td><td>Não desperta</td></tr></tbody></table></div>
<h4>O que o fisioterapeuta precisa saber</h4>
<ul><li><b>Consciência:</b> acordado? sonolento? responde ao chamado? obedece comandos?</li><li><b>Sedação × agitação:</b> qual profundidade? está mudando? interfere no drive e na mobilidade?</li><li><b>Delirium:</b> alteração aguda de atenção ou cognição? <b>Hipoativo também é delirium.</b></li><li><b>Motor e dor:</b> déficit focal? assimetria? a dor limita movimento ou ventilação?</li></ul>
<h4>Delirium: o paciente "quieto" também pode estar delirando</h4>
<p>Sinais: mudança aguda ou flutuante · desatenção · pensamento desorganizado · alteração do nível de consciência.</p>
<p>Por que importa: segurança e comandos · risco de retirada de dispositivos · impacto na mobilização e no sono · necessidade de reorientação.</p>` },

{ t: 'Hemodinâmica: comece pelo básico', s: 'PA é só parte da história. O objetivo é perfusão',
b: `<div class="pearl">Pressão arterial é só uma parte da história. O objetivo é entender perfusão, tendência e necessidade de suporte.</div>
<div class="minis"><div class="mini"><b>FC</b>Frequência + ritmo + tendência.</div><div class="mini"><b>PA / PAM</b>Nível + estabilidade + contexto.</div><div class="mini"><b>Perfusão</b>Pele + enchimento capilar + diurese.</div><div class="mini"><b>Suporte</b>Fluido + vasopressor + inotrópico + dose e tendência.</div></div>
<h4>Choque: definição fisiológica</h4>
<p>Estado de falência circulatória aguda em que a <b>oferta de O₂ aos tecidos fica insuficiente para a demanda metabólica</b>. Mecanismos: perda de volume, falha da bomba, vasodilatação importante ou obstrução ao fluxo.</p>
<div class="flow"><span>Oferta de O₂ insuficiente</span><i>→</i><span>Hipoperfusão</span><i>→</i><span>Hipóxia tecidual, metabolismo anaeróbio, ↑ lactato</span><i>→</i><span>Disfunção orgânica</span></div>
<div class="warn">Choque ≠ apenas hipotensão. É um estado de HIPOPERFUSÃO TECIDUAL. Alvo usual: PAM > 65 mmHg.</div>
<h4>Como reconhecer hipoperfusão à beira-leito</h4>
<div class="minis"><div class="mini"><b>Cérebro</b>Alteração aguda do nível de consciência.</div><div class="mini"><b>Pele</b>Enchimento capilar, temperatura, moteamento.</div><div class="mini"><b>Rim</b>Diurese e tendência.</div><div class="mini"><b>Hemodinâmica</b>PAM, FC, necessidade de suporte.</div><div class="mini"><b>Metabólico</b>Lactato no contexto clínico.</div><div class="mini"><b>Tempo</b>O que mudou nas últimas horas?</div></div>
<p>Nenhum marcador isolado substitui a avaliação global da perfusão. Procure um conjunto de sinais e, principalmente, a tendência.</p>` },

{ t: 'Débito cardíaco, pré-carga e pós-carga', s: 'DC = VS × FC · PAM ≈ DC × RVS',
b: `<div class="formula">DC = VS × FC  ·  PAM ≈ DC × RVS</div>
<div class="minis"><div class="mini"><b>Débito cardíaco</b>Sangue bombeado para a aorta por minuto. É a soma do fluxo para todos os tecidos: <b style="display:inline;color:inherit;text-transform:none">principal determinante da oferta de O₂ aos músculos no esforço.</b></div>
<div class="mini"><b>Pré-carga</b>Estiramento da fibra no fim da diástole (volume diastólico final). Relacionada ao <u>retorno venoso</u>.<br><span class="up">↑</span> hipervolemia, ICC, regurgitação valvar<br><span class="dn">↓</span> hipovolemia, vasodilatação (choque séptico), tamponamento, <b style="display:inline;color:inherit;text-transform:none">PEEP em VM</b></div>
<div class="mini"><b>Pós-carga</b>Resistência que o ventrículo vence para ejetar. Depende do tônus vascular e da PA.<br><span class="up">↑</span> HAS, estenose aórtica, vasoconstrição intensa<br><span class="dn">↓</span> vasodilatadores, choque séptico, hipotensão, anemia grave</div></div>
<h4>Para o tecido receber O₂, duas coisas precisam funcionar</h4>
<div class="flow"><span>FLUXO (DC, perfusão, pressão)</span><i>+</i><span>CONTEÚDO de O₂ (oxigenação, Hb, troca gasosa)</span><i>→</i><span>OFERTA de O₂</span></div>
<p>Choque compromete o fluxo. Insuficiência respiratória compromete oxigenação e/ou ventilação.</p>` },

{ t: 'Os quatro mecanismos de choque', s: 'Hipovolêmico · cardiogênico · distributivo · obstrutivo',
b: `<div class="pearl">O nome importa menos do que entender qual parte da circulação falhou. Trate o mecanismo.</div>
<div class="minis">
<div class="mini"><b>Hipovolêmico</b>Falta volume → ↓ pré-carga → ↓ DC. Ex.: hemorragia, perdas. Pistas: sangramento, taquicardia, extremidades frias, oligúria. <i>A pressão pode cair tardiamente: o paciente compensa antes de hipotensar.</i><br><b style="display:inline;color:inherit;text-transform:none">Há volume para encher a bomba?</b></div>
<div class="mini"><b>Cardiogênico</b>Falha da bomba → ↓ contratilidade → ↓ VS → ↓ DC. Ex.: IAM extenso, IC aguda grave. Pistas: hipotensão + hipoperfusão, congestão pulmonar pode coexistir.<br><b style="display:inline;color:inherit;text-transform:none">A bomba consegue gerar débito?</b></div>
<div class="mini"><b>Distributivo</b>Perda de tônus → ↓↓ RVS → má distribuição do fluxo. Ex.: <u>sepse</u>, anafilaxia, neurogênico. O DC pode estar preservado ou alto no início.<br><b style="display:inline;color:inherit;text-transform:none">O vaso mantém tônus?</b></div>
<div class="mini"><b>Obstrutivo</b>Barreira mecânica ao enchimento/ejeção. TEP maciço (↑ pós-carga do VD), tamponamento (impede enchimento), PNX hipertensivo (↑ pressão intratorácica, ↓ retorno venoso).<br><b style="display:inline;color:inherit;text-transform:none">Existe obstrução?</b></div></div>
<h4>O mecanismo ajuda a entender o suporte</h4>
<ul><li><b>Volume:</b> quando falta enchimento → fluido ou sangue.</li><li><b>Tônus:</b> RVS inadequadamente baixa → vasopressor.</li><li><b>Bomba:</b> baixo débito por disfunção miocárdica → inotrópico.</li><li><b>Obstrução:</b> barreira mecânica → corrigir a causa.</li></ul>
<div class="pearl">A droga vasoativa só faz sentido quando você entende o problema que ela está tentando corrigir.</div>` },

{ t: 'Drogas vasoativas e bombas de infusão', s: 'Noradrenalina, vasopressina, dobutamina, nitroprussiato, tridil, amiodarona',
b: `<h4>O que procurar nas bombas</h4>
<ul><li>Quais bombas estão ativas, em que via e a que velocidade</li><li>Droga vasoativa em curso (noradrenalina, dobutamina)</li><li><b>Velocidade de infusão:</b> indício indireto da necessidade de suporte. Se a velocidade aumenta, a instabilidade aumenta.</li><li><b>Trocas recentes de dose:</b> sinalizam instabilidade em curso</li></ul>
<div class="warn">A presença de noradrenalina ou outro vasopressor já sinaliza instabilidade hemodinâmica significativa e muda a decisão de mobilizar, antes mesmo de tocar no paciente.</div>
<div class="formula">PAM ≈ DC (volume ejetado × FC) × RVS (tônus vascular)</div>
<div class="minis"><div class="mini"><b>Atuam no DC: inotrópicos</b>↑ contratilidade. Ex.: dobutamina. Problema é a bomba: DC baixo com RVS preservada (choque cardiogênico).</div><div class="mini"><b>Atuam na RVS: vasopressores</b>Vasoconstrição, ↑ tônus. Ex.: noradrenalina. Problema é o tônus: RVS baixa com DC preservado ou alto (séptico/distributivo).</div></div>
<p><b>PAM < 65:</b> perde-se a autorregulação renal, a perfusão passa a depender diretamente da pressão. <b>PAM excessivamente alta:</b> aumenta o trabalho cardíaco sem ganho de perfusão.</p>
<h4>Fármacos</h4>
<ul><li><b>Noradrenalina</b> (vasopressor): forte α1 → vasoconstrição intensa; leve β1. <b>1ª escolha no choque séptico</b> e hipotensão refratária a volume. Cuidados: isquemia periférica, exige cateter central (necrose se extravasar), monitorar PAM, FC, perfusão e lactato.</li><li><b>Vasopressina</b>: vasopressor <b>adjuvante</b>, adicionada quando a necessidade de noradrenalina aumenta.</li><li><b>Dobutamina</b> (inotrópico): ↑ força de contração, ↑ DC; IC aguda / disfunção cardíaca com hipoperfusão persistente.</li><li><b>Nitroprussiato (Nipride) e Nitroglicerina (Tridil)</b> (anti-hipertensivos): controlam crises hipertensivas agudas, ↓ RVS.</li><li><b>Amiodarona</b> (antiarrítmico): controle e reversão de arritmias.</li></ul>` },

{ t: 'Antes de mobilizar: leitura hemodinâmica', s: 'Droga → dose → tendência → perfusão → resposta',
b: `<div class="minis"><div class="mini"><b>1 · Qual droga?</b>Vasopressor ou inotrópico?</div><div class="mini"><b>2 · Qual dose?</b>Qual a necessidade atual de suporte?</div><div class="mini"><b>3 · Qual tendência?</b>Estável, reduzindo ou escalando?</div><div class="mini"><b>4 · Perfusão?</b>Consciência, pele, diurese, lactato no contexto.</div><div class="mini"><b>5 · Resposta à manipulação?</b>Mudança postural gera hipotensão, taquicardia ou sintomas?</div></div>
<div class="pearl">Presença de vasopressor, isoladamente, não responde "pode ou não pode mobilizar".</div>
<h4>Pensar em camadas (a conduta nasce da avaliação)</h4>
<ol><li><b>Segurança:</b> ameaças imediatas? dispositivos? restrições?</li><li><b>Reserva:</b> consciência, perfusão, oxigenação, ventilação.</li><li><b>Objetivo:</b> secreção? expansão? função? mobilidade?</li><li><b>Dose:</b> qual intensidade e progressão são toleráveis?</li><li><b>Reavaliação:</b> o que muda durante e depois?</li></ol>` },

{ t: 'Avaliação respiratória à beira-leito', s: 'Respirar é mais do que a saturação',
b: `<div class="pearl">A pergunta não é só "qual a SpO₂?". É "quanto esforço ele faz para manter essa SpO₂?".</div>
<h4>Antes do estetoscópio: olhe</h4>
<div class="minis"><div class="mini"><b>FR</b>Frequência e tendência: um dos primeiros sinais de descompensação.</div><div class="mini"><b>Padrão</b>Ritmo, profundidade, simetria.</div><div class="mini"><b>Esforço</b>Musculatura acessória, tiragem, batimento de asa de nariz.</div><div class="mini"><b>Tórax</b>Expansão e <u>assincronia toracoabdominal</u> (movimento paradoxal = fadiga).</div><div class="mini"><b>Fala</b>Consegue falar frases completas?</div><div class="mini"><b>Consciência</b>Alerta, agitado, sonolento?</div></div>
<h4>Ausculta: interpretação para condutas</h4>
<ul><li><b>SP reduzido/abolido:</b> menor entrada de ar: atelectasia, derrame pleural, obstrução, hipoventilação.</li><li><b>Sibilos:</b> fluxo turbulento em via aérea estreitada (broncoespasmo).</li><li><b>Roncos:</b> secreção em vias aéreas maiores; muda após tosse e aspiração.</li><li><b>Crepitações:</b> abertura de alvéolos com líquido, secreção fina.</li></ul>
<p><b>Palpação:</b> expansibilidade (simetria e amplitude), frêmito toracovocal, enfisema subcutâneo. O achado precisa conversar com clínica, imagem e ventilação.</p>
<h4>Secreção, tosse e via aérea</h4>
<p>Secreção: quantidade, aspecto, viscosidade, localização. Tosse: presente/ausente, voluntária/reflexa, eficaz/ineficaz, causa dor ou fadiga? Via aérea artificial (TOT/TQT): fixação, permeabilidade, cuff, umidificação. <b>Aspiração deve ter indicação clínica</b>, com avaliação da resposta respiratória e hemodinâmica.</p>
<h4>Em VM: o ventilador também é exame físico</h4>
<p>Modo (como o suporte é entregue) · pressões (pico, platô, suporte) · curvas e alarmes (assincronia, obstrução, escape) · paciente + circuito (posição do TOT, cuff, umidificação).</p>` },

{ t: 'Trabalho respiratório e os três domínios', s: 'Oxigenação × ventilação × bomba',
b: `<h4>Descompensação → exaustão → falência</h4>
<div class="flow"><span><b>Compensando</b>: FR ↑, maior esforço, alerta</span><i>→</i><span><b>Reserva se esgotando</b>: acessórios, tiragem, fala entrecortada, assincronia</span><i>→</i><span><b>Falência iminente</b>: respiração superficial, ↓ drive, alteração de consciência, hipercapnia progressiva</span></div>
<div class="warn">A queda da FR pode representar melhora OU incapacidade de sustentar o esforço.</div>
<div class="minis"><div class="mini"><b>Oxigenação</b>O sangue recebe O₂? Olhe SpO₂, PaO₂, FiO₂, P/F. Problema típico: hipoxemia.</div><div class="mini"><b>Ventilação</b>Elimina CO₂? Olhe PaCO₂, pH, ventilação alveolar. Problema: hipercapnia.</div><div class="mini"><b>Bomba respiratória</b>Consegue sustentar o trabalho? FR, esforço, consciência, fadiga. Problema: exaustão.</div></div>
<h4>SpO₂ só faz sentido junto da FiO₂ e do suporte</h4>
<p>Paciente 1: SpO₂ 95% em ar ambiente, FR 16, sem esforço. Paciente 2: SpO₂ 95% em FiO₂ 80%, FR 30, acessórios. <b>Mesma saturação não é mesma gravidade.</b></p>
<div class="minis"><div class="mini"><b>IRpA hipoxêmica</b>Problema de oxigenação: ↓ PaO₂ / FiO₂ crescente. Mecanismos: V/Q, shunt, comprometimento alveolar, difusão. Ex.: pneumonia, edema, SDRA, atelectasia extensa.</div><div class="mini"><b>IRpA hipercápnica</b>Ventilação alveolar insuficiente: ↑ PaCO₂ ± ↓ pH. Mecanismos: ↓ drive, fadiga, obstrução grave, neuromuscular. Ex.: DPOC exacerbada, depressão do SNC. <b style="display:inline;color:var(--bad);text-transform:none">SpO₂ aceitável não exclui insuficiência ventilatória.</b></div></div>
<h4>Gasometria na avaliação (6 passos)</h4>
<div class="flow"><span>1 pH</span><i>→</i><span>2 PaCO₂</span><i>→</i><span>3 HCO₃⁻</span><i>→</i><span>4 Compensação</span><i>→</i><span>5 Oxigenação (P/F)</span><i>→</i><span>6 Lactato (perfusão)</span></div>` },

{ t: 'Avaliação funcional: MRC e IMS', s: 'Na UTI, sobreviver não basta',
b: `<div class="pearl">Força, mobilidade e capacidade de participar do cuidado também são desfechos e guiam a fisioterapia.</div>
<div class="minis"><div class="mini"><b>Prévio</b>Quadro funcional antes da internação.</div><div class="mini"><b>Força</b>MRC quando o paciente segue comandos.</div><div class="mini"><b>Mobilidade</b>Rolar, sentar, transferir, ortostatismo, marcha.</div><div class="mini"><b>Barreiras</b>Sedação, dispositivos, dor, hemodinâmica, reserva respiratória.</div></div>
<h4>MRC</h4>
<p>6 grupos bilaterais (abdução de ombro, flexão de cotovelo, extensão de punho, flexão de quadril, extensão de joelho, dorsiflexão), 0–5 cada: total <b>0–60</b>. <b>&lt; 48 = fraqueza muscular adquirida na UTI</b> (&lt; 36 = grave). Exige paciente colaborativo (RASS próximo de 0).</p>
<h4>ICU Mobility Scale (IMS)</h4>
<p>0 nada · 1 exercício no leito · 2 mobilização passiva à beira do leito · 3 sentado à beira do leito · 4 em pé · 5 transferência para cadeira · 6 marcha no lugar · 7 marcha assistida · 8 marcha com 1 apoio · 9 marcha independente · 10 marcha &gt; 5 m.</p>
<div class="tip">Registrar o MAIOR nível de mobilidade alcançado em todo atendimento.</div>` }
];

FLASH.push(
{ m: 'aval', q: 'Gravidade é um diagnóstico?', a: 'Não. É condição <b>dinâmica</b> de risco, disfunção orgânica e necessidade de suporte, entendida pela <b>trajetória</b>.' },
{ m: 'aval', q: 'Quais os 4 elementos que tornam um paciente "crítico"?', a: 'Instabilidade (real ou potencial) · disfunção orgânica · suporte avançado · monitorização contínua.' },
{ m: 'aval', q: 'Cascata da SDMO?', a: 'Agressão inicial (sepse, trauma, grande cirurgia) → disfunção microcirculatória → disfunção orgânica múltipla.' },
{ m: 'aval', q: 'Por que toda manipulação do crítico exige avaliação prévia?', a: 'A reserva fisiológica já está consumida: o mesmo estímulo (banho, decúbito) pode gerar dessaturação, hipotensão ou taquicardia.' },
{ m: 'aval', q: 'Os 5 passos antes de tocar?', a: 'Paciente → Monitor → Suporte → Dispositivos → Tendência.' },
{ m: 'aval', q: 'Glasgow: para quem e qual o valor de IOT?', a: 'Paciente <b>sem sedação</b> (neurocrítico). <b>GCS < 8</b> = indicação de IOT.' },
{ m: 'aval', q: 'RASS serve para?', a: 'Paciente <b>sedado</b>: profundidade de sedação/agitação (+4 a −5).' },
{ m: 'aval', q: 'CAM-ICU serve para?', a: 'Avaliar <b>delirium</b>, inclusive o hipoativo ("quieto").' },
{ m: 'aval', q: 'Sinais de alerta de delirium?', a: 'Mudança aguda/flutuante, desatenção, pensamento desorganizado, alteração do nível de consciência.' },
{ m: 'aval', q: 'Choque é sinônimo de hipotensão?', a: 'Não. Choque = <b>hipoperfusão tecidual</b> (oferta de O₂ < demanda). Pode haver hipoperfusão antes da hipotensão.' },
{ m: 'aval', q: 'Sinais de hipoperfusão à beira-leito?', a: 'Consciência alterada, pele (enchimento capilar lento, fria, moteamento), diurese ↓, PAM/FC/necessidade de suporte, lactato, e a tendência.' },
{ m: 'aval', q: 'PAM alvo usual no choque?', a: '<b>> 65 mmHg</b>. Abaixo disso a perfusão renal passa a depender diretamente da pressão.' },
{ m: 'aval', q: 'Defina pré-carga.', a: 'Estiramento da fibra no fim da diástole (volume diastólico final), relacionado ao retorno venoso.' },
{ m: 'aval', q: 'A PEEP aumenta ou reduz a pré-carga?', a: '<b>Reduz</b> (↑ pressão intratorácica → ↓ retorno venoso).' },
{ m: 'aval', q: 'Defina pós-carga e o que a aumenta.', a: 'Resistência que o ventrículo vence para ejetar. ↑ em HAS, estenose aórtica, vasoconstrição intensa.' },
{ m: 'aval', q: 'DC = ? e PAM ≈ ?', a: 'DC = VS × FC · PAM ≈ DC × RVS.' },
{ m: 'aval', q: 'Choque hipovolêmico: pré-carga, DC e RVS?', a: 'Pré-carga ↓↓ · DC ↓ · RVS ↑. Ex.: hemorragia.' },
{ m: 'aval', q: 'Choque cardiogênico: pré-carga, DC e RVS?', a: 'Pré-carga ↑/variável · DC ↓ · RVS ↑. Ex.: IAM, IC grave.' },
{ m: 'aval', q: 'Choque distributivo: pré-carga, DC e RVS?', a: 'Pré-carga ↓ · DC ↔/↑/↓ · RVS ↓↓. Ex.: sepse, anafilaxia.' },
{ m: 'aval', q: 'Choque obstrutivo: exemplos?', a: 'TEP maciço, tamponamento cardíaco, pneumotórax hipertensivo.' },
{ m: 'aval', q: '1ª droga no choque séptico?', a: '<b>Noradrenalina</b> (vasopressor, α1 → ↑ RVS).' },
{ m: 'aval', q: 'Quando entra a vasopressina?', a: 'Como vasopressor <b>adjuvante</b> quando a necessidade de noradrenalina aumenta.' },
{ m: 'aval', q: 'Dobutamina age em qual termo da PAM?', a: 'No <b>DC</b>: inotrópico, ↑ contratilidade.' },
{ m: 'aval', q: 'Nitroprussiato / Tridil: classe e efeito?', a: 'Anti-hipertensivos vasodilatadores: ↓ RVS, para crise hipertensiva.' },
{ m: 'aval', q: 'O que a velocidade da bomba de vasoativo indica?', a: 'Necessidade de suporte: se a velocidade aumenta, a instabilidade aumenta. Trocas recentes de dose = instabilidade em curso.' },
{ m: 'aval', q: 'As 5 perguntas antes de mobilizar com vasoativo?', a: 'Qual droga? Qual dose? Qual tendência? Como está a perfusão? Como responde à manipulação?' },
{ m: 'aval', q: 'Vasopressor em curso proíbe mobilizar?', a: 'Não isoladamente. Sinaliza instabilidade e exige a leitura droga-dose-tendência-perfusão-resposta.' },
{ m: 'aval', q: 'Assincronia toracoabdominal (movimento paradoxal) indica?', a: '<b>Fadiga</b> da musculatura respiratória.' },
{ m: 'aval', q: 'Roncos × crepitações?', a: 'Roncos: secreção em vias maiores (mudam após tosse/aspiração). Crepitações: abertura de alvéolos com líquido/secreção fina.' },
{ m: 'aval', q: 'Estágios do trabalho respiratório?', a: 'Compensando (FR ↑, alerta) → reserva se esgotando (acessórios, tiragem, fala entrecortada) → falência iminente (superficial, ↓ drive, sonolência, hipercapnia).' },
{ m: 'aval', q: 'A queda da FR sempre é melhora?', a: 'Não. Pode ser incapacidade de sustentar o esforço (falência).' },
{ m: 'aval', q: 'Os 3 domínios respiratórios que se confundem?', a: 'Oxigenação (SpO₂, PaO₂, P/F) · ventilação (PaCO₂, pH) · bomba (FR, esforço, consciência).' },
{ m: 'aval', q: 'SpO₂ 95% em ar ambiente vs 95% em FiO₂ 80%: mesma gravidade?', a: 'Não. SpO₂ só faz sentido junto da FiO₂ e do suporte.' },
{ m: 'aval', q: 'MRC: total e ponto de corte?', a: '6 grupos bilaterais, 0–5: total 0–60. <b>< 48</b> = fraqueza adquirida na UTI.' },
{ m: 'aval', q: 'IMS: extremos e o que registrar?', a: '0 = nada · 10 = marcha > 5 m. Registrar o <b>maior</b> nível alcançado no atendimento.' },
{ m: 'aval', q: 'As 5 camadas da conduta?', a: '1 Segurança · 2 Reserva · 3 Objetivo · 4 Dose · 5 Reavaliação.' }

<tr><td>Plaquetas</td><td>Distúrbios de coagulação</td><td>Risco de sangramento espontâneo: atenção ao exercício e manobras</td></tr>

{ t: 'Equilíbrio ácido-base', s: 'pH 7,35–7,45 e os três sistemas de regulação',
b: `<p>O equilíbrio ácido-base mantém o pH do sangue numa faixa estreita, <b>7,35–7,45</b>, essencial para células, enzimas e metabolismo. <b>pH &lt; 7,35 = acidose</b> (excesso de ácidos) · <b>pH &gt; 7,45 = alcalose</b> (excesso de bases).</p>
<div class="minis"><div class="mini"><b>1 · Tampões · segundos</b>Sistema bicarbonato-carbonato neutraliza ácidos ou bases livres.</div><div class="mini"><b>2 · Pulmões · minutos</b>Controlam o CO₂ (ácido volátil) pela respiração.</div><div class="mini"><b>3 · Rins · horas a dias</b>Eliminam ou retêm H⁺ e HCO₃⁻.</div></div>
<h4>Exemplos de distúrbios (aula)</h4>
<div class="tblwrap"><table class="t"><thead><tr><th>Distúrbio</th><th>Exemplos</th></tr></thead><tbody><tr><td>Acidose metabólica</td><td>Cetoacidose diabética, insuficiência renal (e acidose lática no choque)</td></tr><tr><td>Alcalose metabólica</td><td>Vômitos intensos, uso excessivo de diuréticos</td></tr><tr><td>Acidose respiratória</td><td>DPOC (exacerbação ou retenção crônica), asma em crise</td></tr><tr><td>Alcalose respiratória</td><td>Hiperventilação por ansiedade</td></tr></tbody></table></div>
<h4>Valores de referência</h4>
<div class="tblwrap"><table class="t"><thead><tr><th>Parâmetro</th><th>Componente</th><th>Normal</th></tr></thead><tbody><tr><td>pH</td><td>Distúrbio ácido-base</td><td>7,35–7,45</td></tr><tr><td>PaCO₂</td><td>Ventilação (respiratório)</td><td>35–45 mmHg</td></tr><tr><td>PaO₂</td><td>Oxigenação</td><td>80–100 mmHg</td></tr><tr><td>HCO₃⁻</td><td>Metabólico</td><td>22–26 mEq/L</td></tr><tr><td>BE</td><td>Estado metabólico</td><td>−2 a +2</td></tr><tr><td>SatO₂</td><td>Saturação arterial</td><td>conforme SpO₂ alvo</td></tr></tbody></table></div>` },

{ t: 'Gasometria passo a passo', s: 'pH → PaCO₂ e HCO₃⁻ → compensação → oxigenação',
b: `<div class="flow"><span><b>1</b> pH</span><i>→</i><span><b>2</b> PaCO₂ e HCO₃⁻</span><i>→</i><span><b>3</b> Compensação</span><i>→</i><span><b>4</b> Hipoxemia / hiperóxia</span></div>
<h4>Passo 1 · pH</h4><p>&lt; 7,35 acidose · &gt; 7,45 alcalose · 7,35–7,45 pode estar normal <b>ou compensado</b>.</p>
<h4>Passo 2 · PaCO₂ (respiratório) e HCO₃⁻ (metabólico)</h4>
<div class="minis"><div class="mini"><b>PaCO₂ alto</b>Retenção de CO₂ = acidose respiratória.</div><div class="mini"><b>PaCO₂ baixo</b>Eliminação excessiva = alcalose respiratória.</div><div class="mini"><b>HCO₃⁻ baixo</b>Perda de base = acidose metabólica.</div><div class="mini"><b>HCO₃⁻ alto</b>Excesso de base = alcalose metabólica.</div></div>
<p>O distúrbio <b>primário</b> é o que explica o lado para onde o pH foi.</p>
<h4>Passo 3 · Compensação (pelo sistema oposto)</h4>
<p>Metabólico → o pulmão compensa ajustando o CO₂. Respiratório → os rins ajustam o HCO₃⁻ (mais demorado).</p>
<div class="minis"><div class="mini"><b>Não compensado</b>O outro componente ainda está normal.</div><div class="mini"><b>Parcial</b>O outro componente se moveu, mas o pH continua alterado.</div><div class="mini"><b>Total</b>pH voltou ao normal com PaCO₂ e HCO₃⁻ alterados.</div></div>
<div class="tip">Os dois componentes empurrando o pH para o mesmo lado (ex.: PaCO₂ ↑ e HCO₃⁻ ↓) = distúrbio misto.</div>
<h4>Passo 4 · Oxigenação</h4>
<p><b>Hipoxemia</b> (PaO₂ &lt; 80), classificação em FiO₂ 21%: <b>leve 60–79 · moderada 40–59 · grave &lt; 40</b>. Danos: hipóxia celular, disfunção orgânica (cérebro e coração), acidose lática, arritmias e falência respiratória.</p>
<p><b>Hiperóxia</b>: PaO₂ &gt; 120, tóxica &gt; 200–300. Danos: toxicidade pulmonar (atelectasia por reabsorção, inflamação alveolar), vasoconstrição coronariana e cerebral, radicais livres (lesão oxidativa).</p>
<div class="formula">Exemplo: pH 7,28 · PaCO₂ 64 · HCO₃⁻ 29 → acidose respiratória parcialmente compensada</div>` }

{ m: 'exames', q: 'Tipos de pneumonia da aula?', a: 'Aspirativa, comunitária, nosocomial e associada à VM (PAV).' },

{ m: 'exames', q: 'Transudato × exsudato?', a: 'Transudato: claro (ICC, cirrose). Exsudato: denso, rico em proteína (pneumonia, câncer, reumatológicas, TB).' },
{ m: 'exames', q: 'Tipos de pneumotórax?', a: 'Espontâneo (DPOC, fibrose, asma, TB) · traumático · iatrogênico (punção, toracocentese, biópsia, pressão alta na VM) · hipertensivo (emergência).' },
{ m: 'exames', q: 'Por que o pneumotórax hipertensivo mata?', a: 'O ar entra e não sai → ↑ pressão intratorácica → desvio de mediastino, ↓ retorno venoso, colapso cardiovascular.' },
{ m: 'exames', q: 'Edema cardiogênico × não cardiogênico: causas?', a: 'Cardiogênico: ICC, IAM, valvopatia, HAS. Não cardiogênico: SDRA, trauma, PNM grave, afogamento.' },
{ m: 'exames', q: 'Hb, leucócitos, plaquetas: o que cada um sinaliza?', a: 'Hb: sangramento/transfusão · leucócitos: infecção, sepse, PAV · plaquetas: coagulação, risco de sangramento no exercício.' },
{ m: 'exames', q: 'Lactato sinaliza?', a: '↑ gasto metabólico / hipoperfusão, sepse; marcador de mortalidade.' },
{ m: 'exames', q: 'Balanço hídrico em ICC e VM?', a: 'Quanto mais positivo, pior o desfecho da VM.' },

{ m: 'exames', q: 'Quem compensa um distúrbio respiratório e quanto demora?', a: 'O rim, ajustando HCO₃⁻: horas a dias.' },

TOPICS.o2 = [
{ t: 'O₂ é fármaco', s: 'Indicação, dose, alvo e reavaliação',
b: `<div class="pearl">Oxigênio não é "quantos litros, fisio?". É uma terapia <b>titulada por objetivo</b>.</div>
<h4>As 4 decisões</h4>
<div class="flow"><span>1 Precisa de O₂?</span><i>→</i><span>2 Qual meta de SpO₂?</span><i>→</i><span>3 Qual dispositivo?</span><i>→</i><span>4 Quando reduzir, retirar ou escalar?</span></div>
<div class="minis"><div class="mini"><b>Indicação</b>Hipoxemia documentada ou fortemente suspeita.</div><div class="mini"><b>Dose</b>FiO₂ / fluxo necessários para atingir a meta, não "o máximo possível".</div><div class="mini"><b>Alvo</b>SpO₂ prescrita pelo perfil clínico e risco de retenção de CO₂.</div><div class="mini"><b>Reavaliação</b>Sinais vitais, esforço, gasometria e resposta após cada ajuste.</div></div>
<div class="warn">O₂ trata hipoxemia. NÃO substitui ventilação, PEEP, recrutamento, reperfusão ou tratamento da causa.</div>
<h4>Antes de responder "qual meta? qual dispositivo?", pergunte</h4>
<ul><li>Por que ele está hipoxêmico?</li><li>O oxigênio corrige esse mecanismo?</li><li>Quanto O₂ é suficiente, sem excesso?</li><li>O trabalho respiratório está melhorando ou piorando?</li></ul>` },

{ t: 'Hipoxemia × hipóxia, cascata e oferta', s: 'Problema arterial × problema tecidual',
b: `<div class="minis"><div class="mini"><b>Hipoxemia (arterial)</b>↓ oxigenação arterial (PaO₂, SaO₂/SpO₂). Pode existir sem hipóxia tecidual se DC e Hb compensam.</div><div class="mini"><b>Hipóxia (tecidual)</b>O₂ insuficiente no tecido para a demanda. Pode ocorrer com SpO₂ NORMAL: anemia grave, choque, intoxicação por CO.</div></div>
<h4>Cascata do O₂</h4>
<div class="flow"><span>Atmosfera PiO₂</span><i>→</i><span>Alvéolo PAO₂</span><i>→</i><span>Artéria PaO₂/SaO₂</span><i>→</i><span>Conteúdo CaO₂</span><i>→</i><span>Oferta DO₂</span><i>→</i><span>Mitocôndria VO₂</span></div>
<p>A FiO₂ aumenta o degrau alveolar/arterial, mas <b>não corrige</b> anemia, baixo débito ou incapacidade tecidual de usar O₂. Na mitocôndria, o O₂ é o receptor final de elétrons (fosforilação oxidativa, ATP).</p>
<div class="minis"><div class="mini"><b>Exemplo 1</b>Hb 5 g/dL + SpO₂ 98% = oferta baixa.</div><div class="mini"><b>Exemplo 2</b>Choque + SpO₂ 99% ≠ perfusão adequada.</div></div>
<h4>Oferta = conteúdo × fluxo</h4>
<div class="minis"><div class="mini"><b>Hemoglobina</b>Carrega quase todo o O₂. Anemia derruba CaO₂ mesmo com SpO₂ 100%.</div><div class="mini"><b>PaO₂ dissolvida</b>Contribuição pequena: subir PaO₂ de 100 para 300 acrescenta pouco.</div><div class="mini"><b>Débito cardíaco</b>Sem fluxo, não há entrega. A SpO₂ não diagnostica choque.</div></div>` },

{ t: 'Mecanismos de hipoxemia', s: 'Baixa PiO₂ · hipoventilação · V/Q · shunt · difusão',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Mecanismo</th><th>Exemplos</th></tr></thead><tbody><tr><td>Baixa PiO₂</td><td>Altitude, falha de fornecimento</td></tr><tr><td>Hipoventilação</td><td>Opioide, sedação, neuromuscular</td></tr><tr><td>Baixa V/Q</td><td>DPOC, asma, secreção, pneumonia</td></tr><tr><td>Shunt</td><td>Atelectasia, SDRA, edema alveolar</td></tr><tr><td>Difusão</td><td>Doença intersticial, exercício</td></tr></tbody></table></div>
<p>Alterações da relação V/Q são a <b>causa mais comum</b> de hipoxemia.</p>
<h4>Espaço morto anatômico × alveolar</h4>
<p><b>Anatômico:</b> ar das vias de condução (nariz até bronquíolos terminais), não troca. <b>Alveolar:</b> alvéolos ventilados sem perfusão efetiva (TEP, hipotensão grave, hiperdistensão alveolar).</p>
<h4>Shunt × espaço morto</h4>
<div class="minis"><div class="mini"><b>Shunt (V/Q → 0)</b>Perfusão sem ventilação. Hipoxemia mesmo quando leve; hipercapnia só nos graves. Pneumonia, SDRA, EAP, atelectasia. <b style="display:inline;color:var(--bad);text-transform:none">Responde mal ao O₂ → precisa de pressão/PEEP (recrutar).</b></div><div class="mini"><b>Espaço morto (V/Q → ∞)</b>Ventilado sem perfusão. Hipoxemia menos intensa, mas hipercapnia precoce. TEP, obstrutivas. Resposta ao O₂ geralmente melhor. <b style="display:inline;color:inherit;text-transform:none">Pense em perfusão.</b></div></div>
<div class="tip">Sangue não encontra alvéolo ventilado → recrutamento. Ar não encontra sangue → perfusão.</div>
<h4>Hipoventilação: o problema é CO₂, não o pulmão</h4>
<p>PaCO₂ ↑ e PaO₂ ↓. Causas: sedação, opioides, lesão neuromuscular, SHO, fadiga.</p>
<div class="warn">Armadilha: O₂ pode normalizar a SpO₂ enquanto a PaCO₂ continua subindo. O oxímetro "melhora", mas o paciente ventila pior. SpO₂ NÃO mede ventilação. Tratamento: corrigir a ventilação alveolar (suporte ventilatório, reverter sedativos, tratar fadiga e causa).</div>` },

{ t: 'O corpo compensa, mas paga por isso', s: 'Sinais à beira-leito; cianose é tardia',
b: `<div class="minis"><div class="mini"><b>Pulmão</b>↑ drive, taquipneia, ↑ trabalho respiratório.</div><div class="mini"><b>Coração</b>Taquicardia, ↑ DC.</div><div class="mini"><b>Vasos pulmonares</b>Vasoconstrição hipóxica: redireciona a perfusão.</div><div class="mini"><b>Metabolismo</b>Oferta crítica: anaerobiose, ↑ lactato.</div></div>
<p>Taquipneia e taquicardia podem surgir <b>antes</b> de uma queda importante da SpO₂.</p>
<h4>Hipoxemia persistente</h4>
<p>Cérebro (confusão, agitação, sonolência) · miocárdio (isquemia, arritmia) · pulmão/VD (hipertensão pulmonar, sobrecarga de VD) · músculo (fadiga) · rim/tecidos (disfunção orgânica).</p>
<h4>Como aparece à beira-leito</h4>
<div class="minis"><div class="mini"><b>Respiratório</b>Taquipneia, acessórios, assincronia toracoabdominal, fala entrecortada. <b style="display:inline;color:var(--bad);text-transform:none">Cianose é tardia.</b></div><div class="mini"><b>Neurológico</b>Ansiedade, agitação, confusão, sonolência.</div><div class="mini"><b>Cardiovascular</b>Taquicardia, hipertensão inicial, arritmias, hipotensão na falência.</div></div>` },

{ t: 'Graduar a oxigenação: P/F e S/F', s: 'Leve · moderada · grave',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Métrica</th><th>Leve</th><th>Moderada</th><th>Grave</th></tr></thead><tbody><tr><td>PaO₂ (ar ambiente)</td><td>60–79</td><td>40–59</td><td>&lt; 40</td></tr><tr><td>PaO₂/FiO₂</td><td>201–300</td><td>101–200</td><td>≤ 100</td></tr><tr><td>SpO₂/FiO₂</td><td>236–315</td><td>149–235</td><td>≤ 148</td></tr></tbody></table></div>
<div class="formula">P/F = PaO₂ ÷ FiO₂ (em fração)   ex.: 72 ÷ 0,6 = 120</div>
<p><b>Definição global de SDRA:</b> aceita S/F ≤ 315 (com SpO₂ ≤ 97%) e inclui pacientes em CNAF ≥ 30 L/min, além de VNI/CPAP em cenários definidos.</p>
<div class="tip">S/F só vale com SpO₂ ≤ 97%: acima disso a curva da Hb está no platô e não diferencia nada.</div>` },

{ t: 'Hiperóxia e DPOC', s: 'O excesso também é lesão',
b: `<h4>Quando pensar em hiperóxia</h4><ul><li>SpO₂ persistentemente &gt; 96% recebendo O₂</li><li>PaO₂ muito elevada</li><li>FiO₂ alta mantida sem indicação</li><li>"100%" tratado como objetivo, e não como sinal de excesso</li></ul>
<div class="pearl">Escolher a MENOR FiO₂ eficaz para manter a meta de SpO₂.</div>
<h4>Como causa dano</h4>
<div class="minis"><div class="mini"><b>Estresse oxidativo</b>Espécies reativas de O₂: dano de membrana e proteína.</div><div class="mini"><b>Atelectasia de absorção</b>O₂ absorvido rápido em unidades pouco ventiladas.</div><div class="mini"><b>Vasoconstrição</b>Coronariana e cerebral.</div><div class="mini"><b>Pulmão</b>FiO₂ alta prolongada: inflamação e lesão alveolar.</div><div class="mini"><b>Neonatal</b>Retinopatia da prematuridade, displasia broncopulmonar.</div></div>
<h4>DPOC e O₂: por que a PaCO₂ sobe?</h4>
<ol><li>↑ FiO₂ reduz a <b>vasoconstrição hipóxica</b>: mais perfusão em unidades mal ventiladas → V/Q piora.</li><li><b>Efeito Haldane</b>: Hb oxigenada carrega menos CO₂ → mais CO₂ liberado no plasma.</li><li><b>Drive</b> pode cair discretamente.</li><li>Resultado: PaCO₂ sobe e a acidose pode piorar se a ventilação estiver limitada.</li></ol>
<div class="formula">Retentor de CO₂: meta 88–92%</div>
<h4>Como evoluiu o uso do O₂</h4>
<div class="tblwrap"><table class="t"><thead><tr><th>Ano</th><th>Estudo</th><th>Mensagem</th></tr></thead><tbody><tr><td>2018</td><td>IOTA</td><td>O₂ liberal associou-se a maior mortalidade em agudos</td></tr><tr><td>2021</td><td>HOT-ICU</td><td>PaO₂ alvo 60 vs 90: mortalidade semelhante</td></tr><tr><td>2022</td><td>BOX</td><td>Pós-PCR: metas de PaO₂ diferentes sem diferença no desfecho</td></tr><tr><td>2025</td><td>UK-ROX</td><td>SpO₂ 88–92% reduziu exposição ao O₂, sem reduzir mortalidade</td></tr><tr><td>2026</td><td>LOGICAL</td><td>Pós-PCR comatosos: estratégia conservadora não melhorou função em 180 dias</td></tr></tbody></table></div>
<p>Mensagem: evitar hipoxemia e hiperóxia; o alvo exato depende do fenótipo.</p>` },

{ t: 'Prescreva meta de SpO₂, não fluxo', s: 'Metas e titulação em 5 passos',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>SpO₂</th><th>Leitura</th></tr></thead><tbody><tr><td>&lt; 88%</td><td>Hipoxemia</td></tr><tr><td>88–92%</td><td>Retentores de CO₂ (DPOC, SHO, neuromuscular, deformidade torácica) até a gasometria</td></tr><tr><td>92–96%</td><td>Maioria dos agudos: margem de segurança</td></tr><tr><td>&gt; 96%</td><td>Reduzir O₂</td></tr></tbody></table></div>
<p><b>IAM / AVC sem hipoxemia:</b> não oferecer O₂ rotineiramente quando a SpO₂ já é adequada.</p>
<h4>Titulação em 5 passos</h4>
<div class="flow"><span>1 Avaliar (SpO₂, FR, esforço, consciência, perfusão)</span><i>→</i><span>2 Definir meta (88–92 ou 92–96)</span><i>→</i><span>3 Menor suporte capaz de atingir</span><i>→</i><span>4 Reavaliar em minutos (+ gaso)</span><i>→</i><span>5 Subir, manter ou desmamar</span></div>
<h4>Oxímetro: armadilhas</h4>
<ul><li><b>Perfusão ruim</b> (vasopressor, hipotermia, extremidade fria): sinal fraco.</li><li><b>Movimento / tremor</b>: leitura falsa.</li><li><b>Pigmentação</b>: maior risco de hipoxemia oculta em pele mais escura.</li><li><b>Intoxicação por CO</b>: SpO₂ pode parecer normal.</li><li><b>Platô</b>: SpO₂ &gt; 97% não detecta hiperóxia.</li><li><b>Sensor</b>: curva pletismográfica, local, esmalte.</li></ul>
<p>Na dúvida clínica: gasometria arterial.</p>` },

{ t: 'Dispositivos de oxigenoterapia', s: 'Do cateter à CNAF',
b: `<div class="tblwrap"><table class="t"><thead><tr><th>Dispositivo</th><th>Fluxo</th><th>FiO₂</th><th>Uso</th></tr></thead><tbody><tr><td>Cateter nasal</td><td>1–6 L/min</td><td>~24–40% (variável)</td><td>Leve, estável</td></tr><tr><td>Máscara simples</td><td>5–10 L/min</td><td>~35–50%</td><td>Leve/moderada</td></tr><tr><td>Venturi</td><td>2–12 L/min (conforme válvula)</td><td>24–50% <b>controlada</b></td><td>Precisa de FiO₂ fixa (DPOC)</td></tr><tr><td>Reservatório</td><td>10–15 L/min</td><td>~60–90%</td><td>Ponte para o grave</td></tr><tr><td>CNAF</td><td>30–60 L/min</td><td>21–100%</td><td>IRpA hipoxêmica</td></tr></tbody></table></div>
<div class="minis">
<div class="mini"><b>Cateter nasal</b>FiO₂ varia com FR, VC, boca aberta, padrão e demanda. &gt; ~4 L/min resseca mais. Umidificação de rotina em baixo fluxo curto: sem benefício claro.</div>
<div class="mini"><b>Máscara simples</b>Nunca fluxo baixo: <b style="display:inline;color:var(--bad);text-transform:none">≥ 5 L/min</b> para evitar reinalação de CO₂. FiO₂ variável, atrapalha fala e alimentação, claustrofobia.</div>
<div class="mini"><b>Venturi</b>O₂ em alta velocidade arrasta ar ambiente (efeito Venturi): fluxo total alto, FiO₂ fixa. Leia a válvula (cor varia entre fabricantes). Janelas livres.</div>
<div class="mini"><b>Reservatório</b>Bolsa deve ficar inflada; se esvazia na inspiração, falta fluxo. FiO₂ raramente 100%. Não reduz muito o trabalho respiratório. Precisar dela = reavaliar em minutos e preparar escalada.</div></div>` },

{ t: 'CNAF: cateter nasal de alto fluxo', s: 'Mecanismos, onde usar, como titular',
b: `<div class="minis"><div class="mini"><b>Fluxo ≥ demanda</b>FiO₂ estável, menos diluição.</div><div class="mini"><b>Lavagem de espaço morto</b>Menos reinalação de CO₂ em vias superiores.</div><div class="mini"><b>Pressão positiva baixa</b>Efeito variável, maior com boca fechada.</div><div class="mini"><b>Aquecimento + umidificação</b>Tolerância e transporte mucociliar.</div><div class="mini"><b>Menor trabalho respiratório</b>FR e esforço caem quando há resposta.</div></div>
<h4>Onde a CNAF tem lugar</h4>
<div class="tblwrap"><table class="t"><thead><tr><th>Situação</th><th>Conduta</th></tr></thead><tbody><tr><td>IRpA hipoxêmica</td><td>Preferir CNAF ao O₂ convencional; preferida sobre VNI na maioria</td></tr><tr><td>DPOC hipercápnica</td><td><b>VNI continua 1ª escolha</b> com acidose/hipercapnia</td></tr><tr><td>Pós-extubação baixo risco</td><td>CNAF pode substituir O₂ convencional</td></tr><tr><td>Pós-extubação alto risco</td><td>VNI central; CNAF nos intervalos</td></tr></tbody></table></div>
<h4>Instalar, titular, reavaliar</h4>
<div class="flow"><span><b>Instalar</b>: cânula do tamanho da narina, 34–37 °C, cabeceira elevada, explicar o fluxo</span><i>→</i><span><b>Titular</b>: fluxo inicial 30–40 L/min, subir a 50–60; FiO₂ pela meta</span><i>→</i><span><b>Reavaliar</b>: SpO₂/FiO₂, FR, esforço, hemodinâmica, consciência; ROX só como apoio</span></div>
<div class="pearl">A melhora deve ser clínica, não apenas numérica.</div>` },

{ t: 'Desmame, quando O₂ não basta e paliativos', s: 'Retirar é tão importante quanto iniciar',
b: `<h4>Desmame do O₂</h4>
<div class="flow"><span>1 Estável e na meta</span><i>→</i><span>2 Reduzir FiO₂/fluxo em pequenos passos</span><i>→</i><span>3 Reavaliar SpO₂, FR, esforço, sintomas</span><i>→</i><span>4 Repetir até ar ambiente</span><i>→</i><span>5 Documentar meta e resposta</span></div>
<p>Evite manter O₂ "por rotina" ou "para conforto" após resolver a hipoxemia.</p>
<h4>Quando o O₂ não basta</h4>
<div class="minis"><div class="mini"><b>FR</b>&gt; 30 ou aumentando.</div><div class="mini"><b>Esforço</b>Tiragem, acessórios, fala entrecortada.</div><div class="mini"><b>FiO₂</b>Necessidade crescente para a mesma SpO₂.</div><div class="mini"><b>Gasometria</b>Acidose / PaCO₂ subindo.</div><div class="mini"><b>Consciência</b>Agitação ou sonolência nova.</div><div class="mini"><b>Hemodinâmica</b>Instabilidade, choque.</div></div>
<div class="warn">Após iniciar ou titular O₂: reavaliar em ~20–30 min. Escalar sem atraso: CNAF, VNI ou IOT conforme mecanismo.</div>
<p><b>VNI:</b> falência ventilatória/hipercápnica, EAP cardiogênico, evitar IOT em cenário apropriado. <b>Invasiva:</b> não protege via aérea, rebaixamento de consciência, hipoxemia grave/fadiga apesar do suporte, instabilidade, falha das não invasivas.</p>
<h4>Registro (segurança assistencial)</h4>
<p>Indicação · Meta · Dispositivo · Resposta · Plano. <b>"O₂ 3 L/min contínuo" sem meta e sem reavaliação é prescrição incompleta.</b></p>
<h4>Paliativos</h4>
<p>Cuidado paliativo é tratamento guiado por conforto e propósito. Com hipoxemia, O₂ pode ajudar (observar resposta sintomática). <b>Sem hipoxemia, não há benefício consistente do O₂</b>: considerar ventilador portátil (ar na face), controle de ansiedade, dor e opioides em baixa dose. Pergunta central: "isso melhora o conforto do paciente?".</p>` }
];
